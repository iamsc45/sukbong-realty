<style>
/* ── 밸런스 게임 (2026-08-31 초안) ─────────────────────────────
   놀이터(가격 맞히기)와 같은 B&W 에디토리얼. 색은 잉크·회색·강조 하나.
   ⚠️ keyframes 에 opacity 를 쓰지 않는다 — 탭이 백그라운드면 시계가 멈춰
      콘텐츠가 통째로 안 보인다(2026-08-31 놀이터에서 겪음). */
.b-wrap{max-width:560px;margin:0 auto;padding:0 20px 72px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:38px 0 10px}
h1.b{font-size:clamp(28px,6.5vw,40px);font-weight:800;letter-spacing:-.04em;margin:0 0 12px;line-height:1.15}
.lead{color:var(--muted);font-size:14.5px;line-height:1.8;margin:0 0 22px;word-break:keep-all}
.rules{font-size:12.5px;color:var(--text2);border-top:1px solid var(--hair);
  border-bottom:1px solid var(--hair);padding:13px 0;margin:0 0 26px;line-height:1.9}
.btn.full{display:block;width:100%;text-align:center;border:0;font-family:inherit;cursor:pointer;font-size:15px}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--text)}
.btn+.btn{margin-top:9px}

.steps{display:flex;gap:5px;margin:30px 0 22px}
.steps i{flex:1 1 0;height:2px;background:var(--hair)}
.steps i.done{background:var(--text)}

.qn{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:8px}
.qt{font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1.3;margin:0 0 24px;word-break:keep-all}

.picks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pick{border:1px solid var(--hair);background:var(--soft);border-radius:14px;padding:22px 14px;
  text-align:center;cursor:pointer;font-family:inherit;transition:border-color 150ms ease,background 150ms ease}
.pick:hover{border-color:var(--text)}
.pick .t{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.3;word-break:keep-all}
.pick .s{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;word-break:keep-all}
.vs{text-align:center;font-size:11px;color:var(--muted2);font-weight:700;letter-spacing:.1em;margin:12px 0}

/* 결과 */
.bars{margin-top:4px}
.bar{margin-bottom:16px}
.bar .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:6px}
.bar .lb b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.bar .lb .pc{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px}
.bar .tr{height:8px;background:var(--gray);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--muted2);border-radius:4px;transition:width 400ms ease}
.bar.mine .tr i{background:var(--text)}
.bar.mine .lb b:after{content:" 내 선택";font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0}
.tot{font-size:12px;color:var(--muted2);margin:-4px 0 20px}

.fact{border-left:2px solid var(--text);padding:2px 0 2px 14px;margin:22px 0}
.fact .h{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:8px}
.fact p{margin:0 0 8px;font-size:14px;line-height:1.85;word-break:keep-all}
.fact p:last-of-type{margin-bottom:0}
.fact a{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--text);
  border-bottom:1px solid var(--text);text-decoration:none;padding-bottom:1px}

.done h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:34px 0 8px}
.done p{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.8}
.foot{font-size:11px;color:var(--muted2);line-height:1.8;margin-top:38px;
  border-top:1px solid var(--hair);padding-top:14px}
.hide{display:none}
</style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">석봉 부동산 정보방</a>
  <nav>
    <a href="index.html">홈</a>
    <a href="map.html">실거래지도</a>
    <a href="apply.html">청약</a>
    <a href="auction.html">경매·공매</a>
    <a href="%EC%A7%80%ED%91%9C.html">금리·지표</a>
    <a href="%EA%B8%80.html">리포트</a>
  </nav>
</header>

<div class="b-wrap">

  <section id="intro">
    <div class="eyebrow">부동산 밸런스 게임</div>
    <h1 class="b">당신의 선택은?</h1>
    <p class="lead">정답이 없는 질문 다섯 개입니다.<br>고르고 나면 다른 분들의 선택과 <b>실제 거래가 어땠는지</b>를 보여드립니다.</p>
    <div class="rules">
      다섯 문제 · 한 번 고르면 바꿀 수 없습니다<br>
      수치는 국토교통부 실거래 신고분에서 뽑았습니다.
    </div>
    <button class="btn full" id="start">시작하기</button>
  </section>

  <section id="play" class="hide">
    <div class="steps" id="steps"></div>
    <div class="qn"><span id="qi">1</span> / <span id="qn">5</span></div>
    <div class="qt" id="qt"></div>

    <div id="beforeVote">
      <div class="picks">
        <button class="pick" id="pickA"><span class="t"></span><span class="s"></span></button>
        <button class="pick" id="pickB"><span class="t"></span><span class="s"></span></button>
      </div>
      <div class="vs">둘 중 하나</div>
    </div>

    <div id="afterVote" class="hide">
      <div class="bars">
        <div class="bar" id="barA"><div class="lb"><b></b><span class="pc"></span></div><div class="tr"><i></i></div></div>
        <div class="bar" id="barB"><div class="lb"><b></b><span class="pc"></span></div><div class="tr"><i></i></div></div>
      </div>
      <div class="tot" id="tot"></div>
      <div class="fact">
        <div class="h">그런데 실제로는</div>
        <p id="fact"></p>
        <p id="more"></p>
        <a id="flink" href="#" target="_blank" rel="noopener"></a>
      </div>
      <button class="btn full" id="next">다음 질문</button>
    </div>
  </section>

  <section id="end" class="hide">
    <div class="done">
      <h2>다섯 질문이 끝났습니다</h2>
      <p>같은 질문에 다른 사람들은 어떻게 답했는지 보셨습니다.<br>
         숫자로 보면 생각이 조금 달라지기도 합니다.</p>
      <button class="btn full" id="share">결과 공유하기</button>
      <button class="btn full line" id="again">다시 보기</button>
      <a class="btn full line" href="%EB%86%80%EC%9D%B4%ED%84%B0_staging.html" style="text-decoration:none">
        실거래가 맞히기도 해보기
      </a>
    </div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script src="assets/sb_share.js?v=2"></script>
<script src="data/polls.js?v=1"></script>
<script>
(function(){
  "use strict";
  var P = (window.POLLS && window.POLLS.items) || [];
  var SB_URL = "https://bwgoufxonqamglbqsife.supabase.co";
  var SB_KEY = "sb_publishable_kYd1gCyqCR2Qy8Ix6KE6og_FfJUImfR";
  var idx = 0, picked = [];
  var $ = function(id){ return document.getElementById(id); };

  function cid(){
    try{
      var v = localStorage.getItem("sb_cid");
      if(!v){ v = Math.random().toString(36).slice(2) + Date.now().toString(36);
              localStorage.setItem("sb_cid", v); }
      return v.slice(0, 32);
    }catch(e){ return "nocid"; }
  }
  function sbFetch(path, opt){
    opt = opt || {};
    opt.headers = Object.assign({ apikey: SB_KEY, Authorization: "Bearer " + SB_KEY,
      "Content-Type": "application/json" }, opt.headers || {});
    return fetch(SB_URL + "/rest/v1/" + path, opt);
  }
  function show(which){
    ["intro","play","end"].forEach(function(k){ $(k).classList.toggle("hide", k!==which); });
    window.scrollTo(0,0);
  }
  function drawSteps(){
    $("steps").innerHTML = P.map(function(_,i){
      return "<i class='"+(i<idx?"done":"")+"'></i>";
    }).join("");
  }

  function render(){
    var q = P[idx];
    drawSteps();
    $("qi").textContent = idx+1;
    $("qn").textContent = P.length;
    $("qt").textContent = q.q;
    $("pickA").querySelector(".t").textContent = q.a.t;
    $("pickA").querySelector(".s").textContent = q.a.s;
    $("pickB").querySelector(".t").textContent = q.b.t;
    $("pickB").querySelector(".s").textContent = q.b.s;
    $("beforeVote").classList.remove("hide");
    $("afterVote").classList.add("hide");
  }

  /* 한 번 고르면 못 바꾼다. 그래야 결과를 믿을 수 있다 */
  function vote(choice){
    var q = P[idx];
    picked.push(choice);
    /* 표를 먼저 보내고, 집계를 받아 그린다.
       실패해도 화면은 진행한다 — 서버가 잠깐 안 되더라도 게임은 끝까지 돌아야 한다 */
    sbFetch("poll_votes", { method: "POST",
      body: JSON.stringify({ slug: q.slug, choice: choice, cid: cid() }) })
      .catch(function(){})
      .then(function(){ return sbFetch("poll_result?slug=eq." + encodeURIComponent(q.slug)); })
      .then(function(r){ return r && r.ok ? r.json() : null; })
      .then(function(rows){
        var a = 0, b = 0;
        if(rows && rows.length){ a = +rows[0].a_cnt || 0; b = +rows[0].b_cnt || 0; }
        /* 내 표가 아직 집계에 안 잡혔으면(중복 투표로 막혔거나 지연) 최소한 내 것은 보탠다 */
        if(a + b === 0){ if(choice === "a") a = 1; else b = 1; }
        paint(q, a, b, choice);
      })
      .catch(function(){ paint(q, choice==="a"?1:0, choice==="b"?1:0, choice); });
  }

  function paint(q, a, b, mine){
    var tot = a + b, pa = tot ? Math.round(a/tot*100) : 0, pb = tot ? 100 - pa : 0;
    var A = $("barA"), B = $("barB");
    A.className = "bar" + (mine==="a" ? " mine" : "");
    B.className = "bar" + (mine==="b" ? " mine" : "");
    A.querySelector("b").textContent = q.a.t;
    B.querySelector("b").textContent = q.b.t;
    A.querySelector(".pc").textContent = pa + "%";
    B.querySelector(".pc").textContent = pb + "%";
    A.querySelector("i").style.width = pa + "%";
    B.querySelector("i").style.width = pb + "%";
    $("tot").textContent = tot.toLocaleString() + "명이 골랐습니다";
    $("fact").innerHTML = q.fact;
    $("more").innerHTML = q.more;
    var l = $("flink");
    if(q.link){ l.href = q.link.u; l.textContent = q.link.t; l.style.display = ""; }
    else l.style.display = "none";
    $("next").textContent = (idx === P.length-1) ? "결과 보기" : "다음 질문";
    $("beforeVote").classList.add("hide");
    $("afterVote").classList.remove("hide");
  }

  $("pickA").addEventListener("click", function(){ vote("a"); });
  $("pickB").addEventListener("click", function(){ vote("b"); });
  $("next").addEventListener("click", function(){
    idx++;
    if(idx >= P.length){ drawSteps(); show("end"); }
    else { render(); window.scrollTo({top:0, behavior:"smooth"}); }
  });
  $("start").addEventListener("click", function(){
    if(!P.length){ alert("질문을 불러오지 못했습니다."); return; }
    idx = 0; picked = []; render(); show("play");
  });
  $("again").addEventListener("click", function(){ idx = 0; picked = []; render(); show("play"); });

  $("share").addEventListener("click", function(){
    var url = "https://xn--2q1br1nnrasc92a76myvau64b.com/" + encodeURIComponent("밸런스_staging.html");
    SBShare.any({
      title: "부동산 밸런스 게임",
      desc: "정답이 없는 질문 다섯 개. 고르고 나면 실제 거래가 어땠는지 보여드립니다.",
      image: "https://xn--2q1br1nnrasc92a76myvau64b.com/assets/og_quiz.png",
      url: url, btn: "나도 골라보기",
      text: "부동산 밸런스 게임, 당신의 선택은?\n" + url
    }).then(function(how){
      if(how === "clipboard") alert("주소를 복사했습니다.");
    });
  });

  $("foot").innerHTML =
    "원자료 국토교통부 실거래가 공개시스템 · " + ((window.POLLS && window.POLLS.base) || "") + "<br>" +
    "취소된 거래와 직거래는 집계에서 제외했습니다. 면적은 전용면적 기준입니다.<br>" +
    "지역·연식·입지가 섞인 표본이라 같은 조건끼리의 차이와는 다를 수 있습니다. 참고용입니다.";
})();
</script>
</body>
