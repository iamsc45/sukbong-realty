    offi: { pre: 'hist_offi_', from: 2024, cov: 216, jb: 100 },
    /* 오피스텔 전월세 (2026-08-25 추가). 아파트 전월세(rent)와 같은 자리 —

    offirent: { pre: 'hist_offirent_', from: 2024, cov: 231, jb: 100 }

    /* 매매를 껐으면 매매 파일은 받지 않는다(전월세 파일만 남는다) */
    if (!curU['매매']) ks = ks.filter(function (k) { return !RENTPAIR[k]; });

  var curT = { apt: 1 }, curU = { '매매': 1 };
  var rows = [];                 /* 지금 조건에 걸린 행 */

  var S = window.SB && SB.summary ? SB.summary : { regions: [], updated: '', period: {} };
  var $ = function (id) { return document.getElementById(id); };

  function py(a) {               /* ㎡ → 평. 100㎡ 미만은 소수1자리(사이트 공통 규칙) */

  /* ── 지역 고르기 ── */
  /* 🔴 열자마자 **엉뚱한 지역 결과가 뜨던 것**을 막는다(2026-08-22 석봉님 지적).

     이제 **둘 다 고를 때까지 아무 결과도 그리지 않는다.** */
  function fillSido() {

  /* 지역이 안 정해졌을 때의 빈 화면. 받기 버튼도 잠근다. */

  /* 아파트가 아닌 버킷(원천이 단지명 자리에 종류 이름을 넣은 것) — 위 buildAsk 주석 참조.
     종류(`t`)가 붙은 뒤로는 보조 그물이다(옛 파일·종류 미상 행 대비). */
  var NOTAPT = { '단독':1, '다가구':1, '빌라':1, '연립':1, '일반원룸':1, '기타':1 };
  /* 원천 종류 이름 → 우리 상품 칩(2026-08-24). 분양권·재건축은 결국 아파트다.
     ⚠️빌딩·구분상가·토지는 이 수집기가 아예 안 받는다 — 계속 「준비 중」이다. */
  var HOTYPE = { '아파트':'apt', '재건축':'apt', '아파트분양권':'apt',
                 '오피스텔':'offi', '오피스텔분양권':'offi',
                 '빌라':'villa', '연립':'villa', '일반원룸':'villa',

  var HO_HAVE = { apt:1, offi:1, villa:1, house:1 };      /* 지금 자료가 있는 종류 */
  var curHoT = { apt: 1 };

  /* ── 호가 탭 필터 (2026-08-23) ──────────────────────────────
     자료가 단지별 집계 한 파일이라 실거래처럼 종류·기간이 넓지 않다.
     지금 있는 것(아파트 · 매매·전세·월세 · 법정동)만 필터로 내고,
     없는 종류는 「준비 중」으로 보여준다 — 감추면 없는 줄 알고, 켜 두면 고장난 줄 안다. */
  var curHoU = { '매매': 1, '전세': 1, '월세': 1 };
  function hoChips() {
    var el = $('hoTypes'); if (!el) return;
    /* 2026-08-24 — 원본에 있던 물건종류를 소급해 채워 넣어(누적 187만 행 중 99.1%)
       아파트·오피스텔·연립·단독을 실제로 가를 수 있게 됐다. 나머지는 수집 대상이 아니라
       계속 준비 중이다(수집기 RLET = APT·ABYG·JGC·OPST·OBYG·VL·DDDGG). */
    el.innerHTML = Object.keys(TYPE).map(function (k) {

        + '><span class="dot" style="background:' + TYPE[k][1] + '"></span>' + TYPE[k][0]

    }).join('');
    $('hoDeals').innerHTML = DEALS.map(function (d) {
      return '<button type="button" class="chip' + (curHoU[d] ? ' on' : '') + '" data-k="' + d + '">' + d + '</button>';
    }).join('');
    /* 기간(2026-08-23 석봉님 지시) — 호가는 시점 스냅샷이라 지금은 최신 수집분 하나뿐이다.
       ⚠️없는 시점을 선택지로 만들지 않는다(고르면 빈 표가 되는 가짜 선택지가 된다).
       지난 시점을 쌓으면 여기 option 이 늘어난다 — 원천은 아파트호가_누적.csv(수집일별)에 이미 있다. */
    var hp = $('hoPer');

  }
  function hoDongFill() {
    var el = $('hoDong'); if (!el) return;

    ds.sort();

    /* 수집일(APTASKDAY)은 지역 파일이 와야 안다 — 동 목록을 채울 때 기간 표기도 같이 갱신 */
    var hp = $('hoPer');
    if (hp) hp.innerHTML = '<option value="latest">최신 수집분 (' + (window.APTASKDAY || '-') + ' 수집)</option>';
  }

  /* ── 물건종류·거래유형 칩 ── */
  function chips() {
    $('types').innerHTML = Object.keys(TYPE).map(function (k) {

  function toggle(box, cur, k) {

    if (!Object.keys(cur).length) cur[k] = 1;    /* 하나는 남긴다 */

  /* ── 기간 고르기 ── */
  function fillPer() {
    var y = new Date().getFullYear(), out = ['<option value="recent">최근 자료</option>'];
    /* 고른 종류 중 가장 이른 해부터 — 아파트를 끄면 2016~2020 은 아예 안 뜬다 */
    var ks = histKinds(), from = HIST_FROM, to = y;
    if (ks.length) {
      from = Math.min.apply(null, ks.map(function (k) { return HKIND[k].from; }));
      to = Math.max.apply(null, ks.map(function (k) { return HKIND[k].to || y; }));
    }
    var keep = $('per').value;
    for (var i = to; i >= from; i--) out.push('<option value="' + i + '">' + i + '년</option>');
    $('per').innerHTML = out.join('');
    if (keep) { $('per').value = keep; if (!$('per').value) $('per').value = 'recent'; }
  }
  function isHist() { return $('per').value !== 'recent'; }

  /* ── 계약월 ── */
  function fillMonths(months) {
    var opt = months.map(function (m) { return '<option>' + m + '</option>'; }).join('');
    $('mFrom').innerHTML = opt; $('mTo').innerHTML = opt;
    $('mFrom').value = months[0]; $('mTo').value = months[months.length - 1];
  }

  /* ── 자료 받기 (지도가 쓰는 파일 그대로) ── */
  var loaded = {};
  function loadJs(src, done) {
    if (loaded[src]) { done(); return; }
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { loaded[src] = 1; done(); };
    s.onerror = function () { done('없음'); };
    document.body.appendChild(s);
  }

  function load() {
    var code = $('sgg').value;
    if (!code) { reset(); return; }
    $('cnt').textContent = '불러오는 중…';
    if (tab === 'tx' && isHist()) {
      /* 🔴 고른 종류를 **모두** 받아 합친다(2026-08-22). 종류마다 파일이 따로라
         하나만 받으면 칩을 여러 개 켜 둔 사람에게 조용히 일부만 나간다. */
      var ks = histFiles();
      if (!ks.length) { allTx = []; rows = []; draw('물건종류와 거래유형을 골라 주세요'); return; }
      var left = ks.length, miss = 0;
      ks.forEach(function (k) {
        loadJs('data/' + HKIND[k].pre + code + '.js', function (err) {
          if (err) miss++;
          if (--left === 0) {
            buildHist(code, ks);
            draw(allTx.length ? '' : '이 지역·연도에는 고른 종류의 자료가 없습니다');
          }
        });
      });
    } else if (tab === 'tx') {
      loadJs('data/detail_' + code + '.js', function (err) {
        if (err) { rows = []; draw(); return; }
        build(code); draw();
      });
    } else {
      loadJs('data/apt_asking_' + code + '.js', function (err) {
        if (err) { rows = []; draw(); return; }
        buildAsk(code); draw();
      });
    }
  }

  var allTx = [], months = [];
  function build(code) {
    var reg = S.regions.filter(function (r) { return r.code === code; })[0] || {};
    var arr = (window.SB && SB.d && SB.d[code]) || [];
    var mm = {};
    allTx = [];
    arr.forEach(function (pt) {
      (pt.txs || []).forEach(function (t) {
        var m = String(t.cd || '').slice(0, 7);
        if (m) mm[m] = 1;
        allTx.push({
          sido: reg.sido, sgg: reg.sgg, dong: pt.dong || '', nm: pt.name || '',
          jibun: pt.jibun || '', t: pt.t, u: t.u, cd: t.cd, a: t.a, f: t.f,
          p: t.p, r: t.r || '', built: pt.extra || ''
        });
      });
    });
    months = Object.keys(mm).sort();
    fillMonths(months);
  }

  /* 과거 연도 — 사전으로 묶어 둔 것을 풀어 최근 6개월과 **같은 모양**으로 맞춘다.
     모양이 갈리면 표·엑셀을 두 벌 만들게 된다. */
  function buildHist(code, kinds) {
    var reg = S.regions.filter(function (r) { return r.code === code; })[0] || {};
    allTx = [];
    (kinds || ['apt']).forEach(function (kind) {
      /* 아파트는 `HIST`, 나머지는 `HIST2["종류|코드"]` — 이름을 나눈 이유는 빌더 주석에 있다 */
      var H = kind === 'apt'
        ? ((window.HIST && HIST[code]) || null)
        : ((window.HIST2 && HIST2[kind + '|' + code]) || null);
      if (!H) return;
      var b = H.b || [];
      (H.r || []).forEach(function (v) {
        var k = b[v[0]] || ['', '', '', 0];
        var ym = String(v[3]), y = ym.slice(0, 4), m = ym.slice(4);
        /* 전월세는 값이 둘이다 — 8번째 칸이 월세이고, 0이면 전세다.
           ⚠️`sh`(지분)도 8번째를 쓰지만 종류가 다르므로 섞이지 않는다. */
        /* 2026-08-25 오피스텔 전월세 추가 — 전월세 파일은 둘이고, 표에 적을 물건종류는
           그 짝(apt·offi)이다. `kind` 를 그대로 쓰면 표에 「offirent」가 찍힌다. */
        var RENTOF = { rent: 'apt', offirent: 'offi' };
        var isRent = !!RENTOF[kind];
        allTx.push({
          sido: reg.sido, sgg: reg.sgg, dong: k[0], nm: k[1], jibun: k[2],
          t: isRent ? RENTOF[kind] : kind,
          u: isRent ? (v[7] ? '월세' : '전세') : '매매',
          cd: y + '-' + m + '-' + (v[4] < 10 ? '0' + v[4] : v[4]),
          a: v[1], f: v[2] || '', p: v[5], r: isRent ? (v[7] || '') : '',
          built: k[3] ? (k[3] + '년 준공') : '',
          cx: (!isRent && v[6]) ? '해제' : '',
          sh: (!isRent && v[7]) ? '지분' : ''
        });
      });
    });
    allTx.sort(function (x, y2) { return x.cd < y2.cd ? 1 : -1; });
  }

  function buildAsk(code) {
    var reg = S.regions.filter(function (r) { return r.code === code; })[0] || {};
    var box = (window.APTASK && APTASK[code]) || {};
    allTx = [];
    Object.keys(box).forEach(function (k) {

      /* 워터마크로 심어 둔 가짜 키는 내보내지 않는다(카나리아_점검.py 와 짝) */
      if (p[1] === '누리솔동') return;
      /* 🔴 호가 원본에는 **아파트가 아닌 것도 섞여 있다**(2026-08-24 석봉님 지적 —
         물건종류를 아파트로 뒀는데 「빌라·연립·단독」이 표에 나왔다). 단지명이 없는 물건은
         원천이 종류 이름을 그대로 단지명 자리에 넣어 준다(전국 표본 17,632키 중
         단독 868 · 다가구 520 · 빌라 513 · 연립 343 · 일반원룸 136 · 기타 69 · 오피스텔 13).
         지금 이 탭은 **아파트만** 제공하므로 그 버킷을 뺀다.
         ⚠️단지명 「일부에」 이 말이 들어간 것(예: 「○○빌라트」)은 건드리지 않는다 —
           정확히 같을 때만 뺀다. 실제 아파트 인덱스(전국 6.5만 단지)에 이 이름과
           **정확히 같은 단지는 0개**임을 확인하고 넣었다(오피스텔·도시형생활주택은

      var ht = HOTYPE[(v.t || '').trim()] || (NOTAPT[p[0]] ? 'etc' : '');
      allTx.push({

        sido: reg.sido, sgg: reg.sgg, dong: p[1] || '', nm: p[0] || '',
        mmMed: (v.mm || {}).med || '', mmPy: (v.mm || {}).py || '', mmN: (v.mm || {}).n || '',
        jeMed: (v.je || {}).med || '', jeN: (v.je || {}).n || '',
        woBo: (v.wo || {}).bo || '', woWol: (v.wo || {}).wol || '', woN: (v.wo || {}).n || ''
      });
    });
    allTx.sort(function (a, b) { return (b.mmN || 0) - (a.mmN || 0); });
    hoDongFill();
  }

  /* ── 조건 걸러 표로 ── */
  function filtered() {
    if (tab === 'ho') {
      var dg = ($('hoDong') && $('hoDong').value) || '';
      return allTx.filter(function (x) {
        if (dg && x.dong !== dg) return false;
        if (!curHoT[x.ht]) return false;          /* 고른 물건종류만(종류 미상은 안 나온다) */
        /* 고른 거래유형의 매물이 하나라도 있는 단지만 */
        return (curHoU['매매'] && x.mmN) || (curHoU['전세'] && x.jeN) || (curHoU['월세'] && x.woN);
      });
    }
    if (isHist()) {
      var yy = $('per').value;
      /* 연도 + 고른 물건종류. 종류를 안 걸면 방금 끈 칩의 자료가 표에 남는다
         (파일은 이미 받아 놨으므로 allTx 에 들어 있다). */
      return allTx.filter(function (x) {
        return String(x.cd).slice(0, 4) === yy && !!curT[x.t] && !!curU[x.u];
      });
    }
    var f = $('mFrom').value, t = $('mTo').value;
    return allTx.filter(function (x) {
      if (!curT[x.t]) return false;
      if (!curU[x.u]) return false;
      var m = String(x.cd || '').slice(0, 7);
      if (f && m < f) return false;
      if (t && m > t) return false;
      return true;
    });
  }

  var COLS_TX = [
    ['시도', 'sido'], ['시군구', 'sgg'], ['법정동', 'dong'], ['단지·물건명', 'nm'], ['지번', 'jibun'],
    ['물건종류', function (x) { return (TYPE[x.t] || [x.t])[0]; }],
    ['거래유형', 'u'], ['계약일', 'cd'],
    ['전용면적(㎡)', 'a', 1], ['전용면적(평)', function (x) { return py(x.a); }, 1],
    ['층', 'f'],
    ['거래금액(만원)', 'p', 1], ['월세(만원)', 'r', 1],
    ['평당가(만원·전용)', function (x) {
      return (x.u === '매매' && x.a && x.p) ? Math.round(x.p / x.a * PY) : '';
    }, 1],
    ['준공', 'built']
  ];
  var COLS_HO = [
    ['시도', 'sido'], ['시군구', 'sgg'], ['법정동', 'dong'], ['단지명', 'nm'],
    ['매매 중위(만원)', 'mmMed', 1], ['매매 평당(만원·전용)', 'mmPy', 1], ['매매 매물수', 'mmN', 1],
    ['전세 중위(만원)', 'jeMed', 1], ['전세 매물수', 'jeN', 1],
    ['월세 보증금(만원)', 'woBo', 1], ['월세(만원)', 'woWol', 1], ['월세 매물수', 'woN', 1]
  ];
  function cols() {
    if (tab !== 'tx') {
      /* 고른 거래유형의 열만 낸다 — 전세만 골랐는데 매매 열이 비어 늘어서면 표만 넓다 */
      return COLS_HO.filter(function (c) {
        var t = c[0];
        if (/^매매/.test(t)) return !!curHoU['매매'];
        if (/^전세/.test(t)) return !!curHoU['전세'];
        if (/^월세/.test(t)) return !!curHoU['월세'];
        return true;
      });
    }
    /* 해제 신고분은 **지우지 않고 표시만 한다.** 지우면 원본과 건수가 달라진다. */
    if (!isHist()) return COLS_TX;
    var ks = histKinds(), add = [['해제여부', 'cx']];
    /* 지분 거래는 토지·상가에서 값을 크게 흔든다 — 그 종류를 골랐을 때만 칸을 낸다 */
    if (ks.indexOf('land') >= 0 || ks.indexOf('comm') >= 0) add.push(['지분거래', 'sh']);
    return COLS_TX.concat(add);
  }
  function val(c, x) { return typeof c[1] === 'function' ? c[1](x) : (x[c[1]] === undefined ? '' : x[c[1]]); }

  function draw(msg) {
    rows = filtered();
    var C = cols();
    var none = msg || '조건에 맞는 자료가 없습니다';
    $('cnt').textContent = rows.length ? ('총 ' + comma(rows.length) + '행') : none;
    $('goXlsx').disabled = $('goCsv').disabled = !rows.length;
    if (!rows.length) { $('prev').innerHTML = '<div class="empty">' + none + '</div>'; return; }
    var head = '<tr>' + C.map(function (c) { return '<th>' + c[0] + '</th>'; }).join('') + '</tr>';
    var body = rows.slice(0, 15).map(function (x) {
      return '<tr>' + C.map(function (c) {
        var v = val(c, x);
        return '<td' + (c[2] ? ' class="n"' : '') + '>' + (c[2] ? comma(v) : v) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    $('prev').innerHTML = '<table>' + head + body + '</table>';
  }

  /* ── 내려받기 ── */
  function fname(ext) {
    var sgg = $('sgg').options[$('sgg').selectedIndex].text;
    var head = tab === 'tx' ? '실거래' : '호가집계';
    var per = tab !== 'tx' ? '' : (isHist() ? ('_' + $('per').value + '년') : ('_' + $('mFrom').value + '_' + $('mTo').value));
    return '석봉부동산_' + head + '_' + $('sido').value + '_' + sgg + per + '.' + ext;
  }
  function table() {
    var C = cols();
    var out = [C.map(function (c) { return c[0]; })];
    rows.forEach(function (x) { out.push(C.map(function (c) { return val(c, x); })); });
    return out;
  }
  function meta() {
    return [
      ['자료명', tab === 'tx' ? '국토교통부 실거래 신고분' : '네이버 부동산 매물 호가 · 단지별 집계'],
      ['제공', '석봉 부동산 정보방 (https://석봉부동산정보방.com)'],
      ['집계 기준일', S.updated || ''],
      ['집계 기간', tab !== 'tx' ? ('수집일 ' + (window.APTASKDAY || '-'))
        : (isHist() ? ($('per').value + '년 계약분 (아파트 매매)')
          : ($('mFrom').value + ' ~ ' + $('mTo').value + ' 계약분'))],
      ['면적·단가 기준', '전용면적 기준 · 평 = ㎡ ÷ 3.305785 · 평당가는 매매만'],
      ['유의', tab === 'tx'
        ? '신고 지연으로 최근 며칠분은 계속 늘어납니다. 해제 신고분은 원본 기준입니다.'
        : '호가는 협상 전 매물가라 실제 체결가와 다릅니다. 개별 매물은 제공하지 않습니다.']
    ];
  }
  function gate(run) {
    /* 회원만 받게 한다. SBAuth 가 없으면(시안·파일 직접 열기) 그냥 진행한다. */
    try {
      if (window.SBAuth && SBAuth.isIn && !SBAuth.isIn() && SBAuth.gate) {
        SBAuth.gate(null, run, {
          title: '자료는 회원에게 드립니다',
          desc: '카카오 로그인 3초, 무료입니다.<br>받으신 자료는 자유롭게 쓰셔도 됩니다.'
        });
        return;
      }
    } catch (e) { }
    run();
  }
  function dlCsv() {
    gate(function () {
      var t = table(), m = meta();
      var lines = m.map(function (r) { return '# ' + r[0] + ': ' + r[1]; })
        .concat(t.map(function (r) {
          return r.map(function (v) {
            v = (v === null || v === undefined) ? '' : String(v);
            return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
          }).join(',');
        }));
      var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      save(blob, fname('csv'));
    });
  }
  function dlXlsx() {
    gate(function () {
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(table()), '자료');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['항목', '내용']].concat(meta())), '출처·기준');
      XLSX.writeFile(wb, fname('xlsx'));
    });
  }
  function save(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }

  /* ── 안내문 ── */
  function notes() {
    if (tab === 'tx') {
      $('srcNote').innerHTML = '<b>어디서 온 자료인가</b> · 국토교통부 실거래가 공개시스템 신고분을 '
        + '매일 받아 시군구·물건종류별로 정리한 것입니다. 집계 기준일 <b>' + (S.updated || '-') + '</b>, '
        + (isHist() ? '연도를 고르면 <b>그 해 전체</b>를 받습니다. 전월세는 아파트·오피스텔에 있습니다.<br>'
                      + '<b>과거 자료는 2024년부터 제공합니다. 지난 연도는 계속 넓혀 나가겠습니다.</b><br>'
                    : '연도를 고르지 않으면 최근 신고분을 받습니다.<br>')
        + '면적은 <b>전용면적</b>이고 평은 ㎡ ÷ 3.305785로 환산했습니다. 평당가는 매매에만 붙습니다.';
      var u = '<b>읽으실 때</b> · 신고 기한이 계약 후 30일이라 <b>최근 며칠분은 계속 늘어납니다.</b> '
        + '그날 숫자를 확정된 것으로 보지 마세요. 원본이 갱신되지 않은 날은 그 몫이 다음 날에 합쳐집니다.';
      /* 🔴 지번이 가려져 나가는 종류는 **미리 말한다**(2026-08-22).
         국토부가 물건종류마다 공개 수준을 달리해 토지·단독다가구는 `3*` 처럼 뒤를 지워서 준다.
         모르고 받으면 「자료가 깨졌나」 한다. 우리가 가린 것이 아니라는 점까지 적는다. */
      if (isHist()) {
        var low = histKinds().filter(function (k) { return HKIND[k].jb < 100; });
        if (low.length) {
          /* ⚠️어떻게 채울 것인지(무엇과 맞춘다든지)는 쓰지 않는다 — 준비 중이라는 사실만 알린다.
             2026-08-22 석봉님 지시. */
          u += '<br><b>지번</b> · ' + low.map(function (k) {
            var j = HKIND[k].jb;
            return (TYPE[k] || [k])[0] + (j ? ' 약 ' + j + '%' : ' 전부 가려짐');
          }).join(', ') + '. <b>준비 중입니다. 최대한 빨리 제공할 수 있도록 하겠습니다.</b>';
        }
      }
      $('useNote').innerHTML = u;
    } else {
      $('srcNote').innerHTML = '<b>어디서 온 자료인가</b> · 네이버 부동산에 올라온 매물 호가를 모아 '
        + '<b>단지별로 중위값·매물수만</b> 집계한 것입니다. 수집일 <b>' + (window.APTASKDAY || '-') + '</b>.<br>'
        + '매매 평당가는 전용면적 기준입니다.';
      $('useNote').innerHTML = '<b>읽으실 때</b> · 호가는 <b>협상 전 부르는 값</b>이라 실제 체결가와 다릅니다. '
        + '실거래와 함께 보셔야 뜻이 있습니다.<br>'
        + '<b>개별 매물(동·향·층·매물번호)은 제공하지 않습니다.</b> 단지별 집계까지만 공개합니다.<br>'
        + '<b>아파트·오피스텔·연립다세대·단독다가구</b>를 물건종류로 골라 보실 수 있습니다. '
        + '빌딩·구분상가·토지 호가와 지난 시점 자료는 <b>계속 업데이트하고 있습니다.</b>';
    }
  }

  /* ── 탭 ── */
  /* 🔴 2026-08-26 동선점검에서 잡은 것 — 첫 화면에서 호가 전용 행 4개(물건종류·거래유형·
     법정동·기간)가 실거래 탭과 함께 보였다. setTab() 이 이 숨김을 하는데 **초기 진입에는
     한 번도 불리지 않아서**(var tab='tx' 로 값만 맞춰 놓았다) 탭을 한 번 눌러야 정리됐다.
     그래서 숨김을 함수로 떼어 초기화에서도 부른다. 초기화에서 setTab() 을 그대로 부르면
     load() 가 한 번 더 돌므로 화면 정리만 하는 이 함수를 쓴다. */
  function applyOnly() {
    document.querySelectorAll('[data-only]').forEach(function (el) {
      el.style.display = (el.getAttribute('data-only') === tab) ? '' : 'none';
    });
  }

  function setTab(t) {
    tab = t;
    document.querySelectorAll('.tabs button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.t === t);
    });
    applyOnly();
    if (t === 'ho') hoChips();
    notes(); load();
  }

  /* ── 붙이기 ── */
  function perUI() {
    var h = isHist();
    $('mBox').style.display = h ? 'none' : '';
    /* 🔴 과거 자료도 이제 **물건종류를 고를 수 있다**(2026-08-22 매매 5종 추가).
       다만 거래유형은 여전히 매매뿐이고, 종류마다 있는 기간·지역이 다르다.
       ⚠️「전 물건종류」 같은 뭉뚱그린 말을 쓰지 않는다 — 고른 것에 맞춰 실제를 적는다. */
    var msg;
    if (h) {
      var ks = histKinds();
      var lim = ks.filter(function (k) { return HKIND[k].cov < 250; });
      /* 🔴 2026-08-26 석봉님 지시 — 「2024년부터로 하고 옆에 앞으로 더 늘려나가겠다고 적어 주자」.
         범위를 좁혔으면 **좁혔다고 말하는 것**이 맞다. 말없이 줄이면 「자료가 없어졌다」로 읽힌다. */
      msg = '과거 자료는 2024년부터 · 한 번에 1년치 · 전월세는 아파트·오피스텔';
      if (lim.length) {
        msg += ' · ' + lim.map(function (k) {
          return (TYPE[k] || [k])[0] + ' ' + HKIND[k].cov + '개 시군구';
        }).join(', ') + '만 있습니다';
      }
    } else {
      msg = '최근분은 전 물건종류·전 거래유형';
    }
    $('perNote').textContent = msg;
    /* 🔴 이제 과거도 거래유형을 고를 수 있다(2026-08-22 아파트 전월세 · 2026-08-25 오피스텔 전월세).
       다만 **전월세가 있는 것은 아파트·오피스텔뿐**이라, 토지·빌딩 등에 전세·월세를 걸면
       0행이 된다. 칩을 잠그는 대신 위 안내에 그 사실을 적는다.
       ⚠️전월세를 새 종류로 넓힐 때는 `HKIND` 와 `RENTPAIR` 를 **함께** 고칠 것 —
         한쪽만 고치면 파일은 받는데 표에 종류가 「offirent」처럼 찍히거나 그 반대가 된다. */
    document.querySelectorAll('#deals .chip, #types .chip').forEach(function (b) {
      b.style.opacity = 1; b.style.pointerEvents = '';
    });
  }
  fillPer(); fillSido(); chips(); applyOnly(); perUI(); notes();
  $('sido').addEventListener('change', fillSgg);
  $('sgg').addEventListener('change', load);
  $('per').addEventListener('change', function () { perUI(); notes(); load(); });
  $('mFrom').addEventListener('change', function () { draw(); });
  $('mTo').addEventListener('change', function () { draw(); });
  $('types').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    toggle('types', curT, b.dataset.k);
    /* 과거 모드에서는 종류가 곧 파일이다 — 칩을 바꾸면 연도 목록과 자료를 다시 잡는다 */
    if (isHist()) { fillPer(); perUI(); notes(); load(); }
  });
  $('deals').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    toggle('deals', curU, b.dataset.k);
    /* 과거 모드에서는 거래유형이 곧 파일이다(전월세는 별도 파일) — 다시 받는다 */
    if (isHist()) { perUI(); notes(); load(); }
  });
  $('hoTypes').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b || b.disabled) return;
    var k = b.dataset.k;
    if (curHoT[k]) delete curHoT[k]; else curHoT[k] = 1;
    if (!Object.keys(curHoT).length) curHoT[k] = 1;   /* 하나는 남긴다 */
    hoChips(); draw();
  });
  $('hoDeals').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var k = b.dataset.k;
    if (curHoU[k]) delete curHoU[k]; else curHoU[k] = 1;
    if (!Object.keys(curHoU).length) curHoU[k] = 1;   /* 하나는 남긴다 */
    hoChips(); draw();
  });
  $('hoDong').addEventListener('change', function () { draw(); });
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) setTab(b.dataset.t);
  });
  $('goCsv').addEventListener('click', dlCsv);
  $('goXlsx').addEventListener('click', dlXlsx);
  $('regNote').textContent = '전국 ' + S.regions.length + '개 시군구';
})();
</script>
<script src="assets/sb_footer.js?v=1"></script><script defer src="assets/sb_nav.js?v=2"></script>
</body></html>
