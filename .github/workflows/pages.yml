# GitHub Pages 배포 (2026-08-06 신설)
# ---------------------------------------------------------------------------
# 왜 만들었나
#   기본 배포(Deploy from a branch)는 깃허브가 자동 생성하는 절차를 쓰는데, 그 안의
#   deploy-pages 단계가 10분(600000ms)을 넘기면 배포를 스스로 취소한다.
#   우리 사이트는 파일이 21,000개를 넘겼고 그중 단지 페이지가 93%라 푸는 데만
#   10분을 넘겨 2026-08-06 배포가 계속 실패했다(로그 마지막 줄 Timeout reached).
#   이 절차를 직접 들고 있으면 그 시간을 늘릴 수 있다.
#
# 같이 해결되는 것
#   · "시간당 10회 빌드" 소프트 제한이 커스텀 워크플로에는 적용되지 않는다.
#   · concurrency에 cancel-in-progress: false 를 줘서 **뒤 커밋이 앞 배포를 취소하지
#     않게** 한다(8/6에 밀린 변경분을 3번 나눠 올리다 서로 취소시킨 사고 방지).
#
# 주의
#   이 파일은 리포 루트의 .github/workflows/ 에 있어야 한다.
#   우리 배포 스크립트는 `사이트/` 폴더를 리포 루트로 올리므로 실제 위치는
#   `사이트/.github/workflows/pages.yml` 이다.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # 필요할 때 손으로 다시 돌릴 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않고 줄을 세운다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 기본 10분 → 45분. 파일 수가 많아 푸는 데만 10분을 넘긴다.
          timeout: 2700000
          # 상태 조회가 일시적으로 실패해도(깃허브 쪽 5xx) 바로 포기하지 않게 여유를 둔다.
          error_count: 20
