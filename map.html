<script>
var TYPE={apt:["아파트","#2554E0"],offi:["오피스텔","#7A5AF8"],villa:["연립·다세대","#0FA98A"],
  house:["단독·다가구","#6E6E6A"],bldg:["빌딩","#D4573F"],comm:["구분상가·오피스","#E8A13A"],land:["토지","#4C9A4C"]};
var Z_DETAIL=13, Z_POINT=15, Z_NAME=16;
var curU='all', curD='all', curSido='all', curSgg='all';
var curTset=null;
var curMode='trade';
var curRF={'재개발':true,'재건축':true,'신통':true,'모아':true};
var redevShowTrade=false;
function matchRF(cat,tag){
  return (curRF['재개발']&&cat==='재개발') || (curRF['재건축']&&(cat==='재건축'||cat==='주거환경'))
    || (curRF['신통']&&(tag==='신통'||cat==='신통')) || (curRF['모아']&&tag==='모아');
}
try{var P0=new URLSearchParams(location.search);var t0=P0.get('t');if(t0&&TYPE[t0]){curTset={};curTset[t0]=true;}
var u0=P0.get('u');if(u0==='매매'||u0==='전세'||u0==='월세')curU=u0;}catch(e){}
/* 상세 필터 상태 (매매가·보증금·월세·면적·연식·층) — fXc는 직접 입력 [최소,최대+1) 만원 */
var fS='all', fB='all', fW='all', fA='all', fY='all', fF='all';
var fSc=null, fBc=null, fWc=null;
var FSR={s1:[0,50000],s2:[50000,100000],s3:[100000,200000],s4:[200000,1e15]};
var FBR={b1:[0,10000],b2:[10000,30000],b3:[30000,60000],b4:[60000,1e15]};
var FWR={w1:[0,50],w2:[50,100],w3:[100,200],w4:[200,1e9]};
var FAR={a1:[0,60],a2:[60,85],a3:[85,115],a4:[115,1e9]};
var CURY=new Date().getFullYear();
function ptYear(pt){if(pt._y===undefined){var m=/(19|20)\d{2}/.exec(pt.extra||'');pt._y=m?+m[0]:null;}return pt._y;}
function regionPass(r){if(curSgg!=='all')return r.code===curSgg;if(curSido!=='all')return r.sido===curSido;return true;}
var map=L.map('map',{minZoom:9}).setView([37.55,126.98],11);
var baseV=L.tileLayer('https://api.vworld.kr/req/wmts/1.0.0/EBC23601-6E41-3269-9ECB-821DEECCF3F0/Base/{z}/{y}/{x}.png',
  {attribution:'&copy; VWorld(국토교통부)',maxZoom:19,maxNativeZoom:18,minZoom:6}).addTo(map);
var _te=0;
baseV.on('tileerror',function(){if(++_te===12){map.removeLayer(baseV);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(map);}});
var layer=L.layerGroup().addTo(map);
function go(lat,lng,z){try{map.flyTo([lat,lng],z,{duration:.6});}catch(e){try{map.setView([lat,lng],z,{animate:false});}catch(e2){}}}
var loading={}, loaded={};

function fmtEok(man){var e=man/10000;return (e>=10?e.toFixed(1):e.toFixed(2)).replace(/\.?0+$/,'')+'억';}
function PY(m){m=+m;if(!m)return '';var p=m/3.305785;return (p<100?p.toFixed(1):Math.round(p))+'평';}
/* 관심단지 (이 기기 브라우저에 저장) */
function favList(){try{return JSON.parse(localStorage.getItem('sb_fav')||'[]');}catch(e){return [];}}
function favSave(l){try{localStorage.setItem('sb_fav',JSON.stringify(l));}catch(e){}}
function favHas(id){return favList().some(function(f){return f.id===id;});}
function favToggle(item){var l=favList(),i=-1;for(var k=0;k<l.length;k++){if(l[k].id===item.id){i=k;break;}}
  if(i>=0){l.splice(i,1);favSave(l);return false;}l.push(item);favSave(l);return true;}
function priceLabel(tx){
  if(tx.u==='매매')return fmtEok(tx.p);
  if(tx.u==='전세')return '전세 '+fmtEok(tx.p);
  return '월 '+(tx.p>=10000?fmtEok(tx.p):Math.round(tx.p).toLocaleString())+'/'+Math.round(tx.r);
}
function txBase(tx){
  /* 가격 외 공통 조건 (계약월·면적·층) — 거래 칩(curU)은 표시 단계에서 적용 */
  if(curD!=='all'&&tx.cd.indexOf(curD)!==0)return false;
  if(fA!=='all'){var ar=FAR[fA];if(tx.a==null||tx.a<ar[0]||tx.a>=ar[1])return false;}
  if(fF!=='all'){var fl=+tx.f;if(!fl||fl<(fF==='f5'?5:15))return false;}
  return true;
}
function inR(v,r){return v>=r[0]&&v<r[1];}
function ptTxs(pt){
  /* 맞춤 검색: 설정된 가격 필터 프로파일을 "같은 지점"이 전부 충족해야 표시.
     매매가 → 해당 범위 매매 거래 보유 / 보증금(+월세액) → 해당 조건 전·월세 거래 보유.
     매매가+보증금 조합 = 매매가 X이면서 전세(보증금) Y인 매물(갭 검색). */
  if(curTset&&!curTset[pt.t])return [];
  if(fY!=='all'){
    var y=ptYear(pt);if(!y)return [];
    var ag=CURY-y;
    if(fY==='y5'&&ag>5)return [];
    if(fY==='y10'&&ag>10)return [];
    if(fY==='y20'&&ag<20)return [];
  }
  var base=pt.txs.filter(txBase);
  var S=fSc||(fS!=='all'?FSR[fS]:null);
  var B=fBc||(fB!=='all'?FBR[fB]:null);
  var W=fWc||(fW!=='all'?FWR[fW]:null);
  var out;
  if(!S&&!B&&!W){
    out=base;
  }else{
    var sale=S?base.filter(function(t){return t.u==='매매'&&inR(t.p,S);}):[];
    var rent=[];
    if(W)rent=base.filter(function(t){return t.u==='월세'&&inR(t.r||0,W)&&(!B||inR(t.p,B));});
    else if(B)rent=base.filter(function(t){return (t.u==='전세'||t.u==='월세')&&inR(t.p,B);});
    if(S&&!sale.length)return [];
    if((B||W)&&!rent.length)return [];
    out=sale.concat(rent);
    out.sort(function(a,b){return a.cd<b.cd?1:-1;});
  }
  if(curU!=='all')out=out.filter(function(t){return t.u===curU;});
  return out;
}
function setFcount(msg){var fc=document.getElementById('fcount');if(fc)fc.textContent=msg;}
function loadDetail(code,cb){
  if(loaded[code]||loading[code])return;
  if(!(SB.summary.regions.find(function(r){return r.code===code&&r.geo>0;})))return;
  loading[code]=1;
  var s=document.createElement('script');
  s.src='data/detail_'+code+'.js';
  s.onload=function(){loaded[code]=1;delete loading[code];if(cb)cb();};
  s.onerror=function(){delete loading[code];};
  document.body.appendChild(s);
}
function visibleRegions(){
  var b=map.getBounds(), m=0.065;  // 구 중심이 화면 밖이어도 ~7km 여유로 포함 (깊은 줌 대응)
  var eb=L.latLngBounds([b.getSouth()-m,b.getWest()-m],[b.getNorth()+m,b.getEast()+m]);
  return SB.summary.regions.filter(function(r){return r.lat&&regionPass(r)&&eb.contains([r.lat,r.lng]);});
}
function render(){
  layer.clearLayers();
  if(curMode==='redev'&&!redevShowTrade)return;
  var z=map.getZoom(), nPt=0, nTx=0;
  document.getElementById('map').classList.toggle('names',z>=Z_NAME);
  if(z<Z_DETAIL){
    SB.summary.regions.forEach(function(r){
      if(!r.lat||!regionPass(r))return;
      var tot;if(!curTset||!r.nt){tot=r.n['매매']+r.n['전세']+r.n['월세'];}else{tot=0;for(var _k in curTset){tot+=(r.nt[_k]||0);}}
      if(!tot)return;
      var sz=Math.min(64,Math.max(42,Math.round(14*Math.log(tot||1))));
      var icon=L.divIcon({className:'',html:'<div class="clus" style="width:'+sz+'px;height:'+sz+'px">'
        +'<span class="cn">'+r.sgg.replace(/_/g,' ')+'</span><span class="cc">'+tot.toLocaleString()+'</span></div>',
        iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
      L.marker([r.lat,r.lng],{icon:icon}).on('click',function(){go(r.lat,r.lng,Z_DETAIL+1);}).addTo(layer);
      nPt++;nTx+=tot;
    });
    document.getElementById('stat').textContent='시군구 '+nPt+'곳 · '+nTx.toLocaleString()+'건 (확대하면 상세)';
    setFcount('상세 필터는 지도를 확대하면 적용됩니다');
    return;
  }
  var need=visibleRegions(), pending=0;
  need.forEach(function(r){if(!loaded[r.code]){pending++;loadDetail(r.code,render);}});
  var b=map.getBounds().pad(0.1);
  var pts=[];
  need.forEach(function(r){
    var d=SB.d[r.code]; if(!d)return;
    d.forEach(function(pt){
      if(!b.contains([pt.lat,pt.lng]))return;
      var txs=ptTxs(pt); if(!txs.length)return;
      pts.push({pt:pt,txs:txs,code:r.code});
    });
  });
  window._PTS=pts;
  if(z<Z_POINT){
    var dongs={};
    pts.forEach(function(o){
      var k=o.pt.dong;
      var g=dongs[k]=dongs[k]||{lat:0,lng:0,n:0,tx:0};
      g.lat+=o.pt.lat;g.lng+=o.pt.lng;g.n++;g.tx+=o.txs.length;
    });
    Object.keys(dongs).forEach(function(k){
      var g=dongs[k],sz=Math.min(58,Math.max(38,Math.round(12*Math.log(g.tx+2))));
      var icon=L.divIcon({className:'',html:'<div class="clus dong" style="width:'+sz+'px;height:'+sz+'px">'
        +'<span class="cn">'+k+'</span><span class="cc">'+g.tx+'</span></div>',
        iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
      var la=g.lat/g.n,ln=g.lng/g.n;
      L.marker([la,ln],{icon:icon}).on('click',function(){go(la,ln,Z_POINT);}).addTo(layer);
      nPt++;nTx+=g.tx;
    });
    document.getElementById('stat').textContent='동 '+nPt+'곳 · '+nTx.toLocaleString()+'건'+(pending?' · 불러오는 중…':'');
    setFcount('화면 내 조건 일치 '+nTx.toLocaleString()+'건');
    return;
  }
  pts.forEach(function(o){
    var pt=o.pt,txs=o.txs,ti=TYPE[pt.t]||["기타","#6E6E6A"],col=ti[1],latest=txs[0];
    var icon=L.divIcon({className:'',html:'<div class="pricetag'+(pt.ax?' apx':'')+'" style="background:'+col+'">'
      +priceLabel(latest)+' <span class="n">'+(latest.a?Math.round(latest.a)+'㎡·'+PY(latest.a):'')+'</span>'
      +'<span class="nm">'+pt.name+'</span></div>',iconSize:null,iconAnchor:[30,12]});
    var rows=txs.map(function(t){
      var u=t.u+(t.k?'·'+t.k.slice(0,2):'');
      var sqm=(t.u==='매매'&&t.a)?'<div style="font-weight:normal;font-size:10px;color:#888">'+Math.round(t.p/t.a*3.305785).toLocaleString()+'만/평</div>':'';
      return '<tr><td>'+t.cd.slice(5)+'</td><td>'+u+'</td><td>'+(t.a?t.a+'<span style="color:#9a938a;font-size:10px"> '+PY(t.a)+'</span>':'-')+'</td><td>'+t.f+'</td><td class="pr">'+priceLabel(t)+sqm+'</td></tr>';
    }).join('');
    var pop='<div class="pop"><h4>'+pt.name+'<span class="badge" style="background:'+col+'">'+ti[0]+'</span></h4>'
      +'<div class="meta">'+pt.dong+' '+pt.jibun+(pt.extra?' · '+pt.extra:'')+' · '+txs.length+'건'+(pt.ax?' · <b style="color:#D4573F">지번 비공개 — 동 단위 개략 위치</b>':'')+'</div>'
      +'<div class="tw"><table><thead><tr><th>계약</th><th>거래</th><th>면적㎡</th><th>층</th><th>가격</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    var mk=L.marker([pt.lat,pt.lng],{icon:icon}).on('click',function(){showAptCard(pt,txs);});
    mk.on('popupopen',function(){var el=mk.getElement();if(el){var t=el.querySelector('.pricetag');if(t)t.classList.add('sel');}});
    mk.on('popupclose',function(){var el=mk.getElement();if(el){var t=el.querySelector('.pricetag');if(t)t.classList.remove('sel');}});
    mk.addTo(layer);
    nPt++;nTx+=txs.length;
  });
  document.getElementById('stat').textContent='지점 '+nPt+' · '+nTx.toLocaleString()+'건'+(pending?' · 불러오는 중…':'');
  setFcount('화면 내 조건 일치 '+nTx.toLocaleString()+'건');
}
/* 칩 */
function mkChips(elId,items,cur,setter){
  var el=document.getElementById(elId);
  items.forEach(function(it){
    var b=document.createElement('button');
    b.className='chip'+(it[0]===cur?' on':'');
    b.innerHTML=(it[2]?'<span class="dot" style="background:'+it[2]+'"></span>':'')+it[1];
    b.addEventListener('click',function(){
      el.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');setter(it[0]);render();});
    el.appendChild(b);
  });
}
(function(){var el=document.getElementById('typechips');
  var items=[['all','전체',null]].concat(Object.keys(TYPE).map(function(t){return [t,TYPE[t][0],TYPE[t][1]];}));
  var btns={};
  function syncUI(){items.forEach(function(it){var on=it[0]==='all'?!curTset:(curTset&&curTset[it[0]]);btns[it[0]].classList.toggle('on',!!on);});}
  items.forEach(function(it){var b=document.createElement('button');b.className='chip';
    b.innerHTML=(it[2]?'<span class="dot" style="background:'+it[2]+'"></span>':'')+it[1];btns[it[0]]=b;
    b.addEventListener('click',function(){
      if(it[0]==='all'){curTset=null;}
      else{if(!curTset)curTset={};if(curTset[it[0]])delete curTset[it[0]];else curTset[it[0]]=true;if(Object.keys(curTset).length===0)curTset=null;}
      syncUI();render();});
    el.appendChild(b);});
  syncUI();})();
mkChips('uchips',[['all','전체'],['매매','매매'],['전세','전세'],['월세','월세']],curU,function(v){curU=v;});
mkChips('dchips',[['all','전체'],['2026-07','7월'],['2026-06','6월']],'all',function(v){curD=v;});
/* 모바일 카테고리 바텀시트 (누르면 목록에서 선택) */
(function(){
  var TYPEITEMS=[['all','전체']].concat(Object.keys(TYPE).map(function(t){return [t,TYPE[t][0],TYPE[t][1]];}));
  var UITEMS=[['all','전체'],['매매','매매'],['전세','전세'],['월세','월세']];
  var DITEMS=[['all','전체'],['2026-07','7월'],['2026-06','6월']];
  var dLabel={'2026-07':'7월','2026-06':'6월','all':'전체'};
  var sheet=document.getElementById('msheet');
  if(!sheet)return;
  var body=document.getElementById('msBody'), title=document.getElementById('msTitle');
  var MSHORT={apt:'아파트',offi:'오피스텔',villa:'연립',house:'단독',bldg:'빌딩',comm:'상가',land:'토지'};
  function labels(){
    var mt=document.getElementById('mcType');
    if(mt){if(!curTset)mt.textContent='전체';else{var ks=Object.keys(curTset);mt.textContent=ks.length===1?(MSHORT[ks[0]]||(TYPE[ks[0]]?TYPE[ks[0]][0]:ks[0])):ks.length+'종';}}
    var mu=document.getElementById('mcU'); if(mu)mu.textContent=curU==='all'?'전체':curU;
    var md=document.getElementById('mcD'); if(md)md.textContent=dLabel[curD]||'전체';
  }
  function isOn(cat,k){if(cat==='type')return k==='all'?!curTset:!!(curTset&&curTset[k]);if(cat==='u')return curU===k;return curD===k;}
  function close(){sheet.classList.remove('open');}
  function openSheet(cat){
    var items=cat==='type'?TYPEITEMS:(cat==='u'?UITEMS:DITEMS), multi=cat==='type';
    title.textContent=(cat==='type'?'상품':cat==='u'?'거래 유형':'계약월')+(multi?' (여러 개 선택 가능)':'');
    body.innerHTML=items.map(function(it){
      var on=isOn(cat,it[0]);
      var dot=it[2]?'<span class="dot" style="background:'+it[2]+'"></span>':'';
      return '<div class="ms-opt'+(on?' on':'')+'" data-k="'+it[0]+'"><span>'+dot+it[1]+'</span>'+(on?'<span class="ck">'+(multi?'✓':'●')+'</span>':'')+'</div>';
    }).join('');
    body.querySelectorAll('.ms-opt').forEach(function(el){el.addEventListener('click',function(){pick(cat,el.getAttribute('data-k'));});});
    sheet.classList.add('open');
  }
  function pick(cat,k){
    if(cat==='type'){
      if(k==='all')curTset=null;
      else{if(!curTset)curTset={};if(curTset[k])delete curTset[k];else curTset[k]=true;if(!Object.keys(curTset).length)curTset=null;}
      render();labels();openSheet('type');
    }else if(cat==='u'){curU=k;render();labels();close();}
    else{curD=k;render();labels();close();}
  }
  document.getElementById('msClose').addEventListener('click',close);

  var hoSec='';
  {
    function eok2(m){if(!m)return '';var v=m/10000;return (v>=100?Math.round(v):(''+v.toFixed(1)).replace(/\.0$/,''))+'억';}
    function md(a){if(!a.length)return 0;var s=a.slice().sort(function(x,y){return x-y;});return s[Math.floor(s.length/2)];}
    var mmT=txs.filter(function(t){return t.u==='매매';}),jeT=txs.filter(function(t){return t.u==='전세';}),woT=txs.filter(function(t){return t.u==='월세';});
    function rrow(l,rv,hv){return '<div style="display:grid;grid-template-columns:40px 1fr 1fr;font-size:12.5px;padding:5px 0;border-bottom:1px dotted #e7e1d4"><b style="color:#6b6355;font-weight:700">'+l+'</b><span style="text-align:right;font-weight:700">'+(rv||'·')+'</span><span style="text-align:right;font-weight:700;color:#c0562e">'+(hv||'·')+'</span></div>';}
    hoSec='<div class="rc-sec"><div class="rc-lab">실거래 vs 호가 · 중위</div>'
      +'<div style="display:grid;grid-template-columns:40px 1fr 1fr;font-size:10px;color:#8a8071;font-weight:700;padding-bottom:2px"><span></span><span style="text-align:right">실거래</span><span style="text-align:right">호가</span></div>'
      +rrow('매매',eok2(md(mmT.map(function(t){return t.p;}))),(A&&A.mm)?eok2(A.mm.med):'')
      +rrow('전세',eok2(md(jeT.map(function(t){return t.p;}))),(A&&A.je)?eok2(A.je.med):'')
      +rrow('월세',woT.length?(eok2(md(woT.map(function(t){return t.p;})))+'/'+md(woT.map(function(t){return t.r;}))+'만'):'',(A&&A.wo)?(eok2(A.wo.bo)+'/'+A.wo.wol+'만'):'')
      +'<div class="rc-note" style="padding:4px 0 0">호가=협상 전 매물가(중위, 주황). '+(A?'실거래(체결가)와 다를 수 있음.':'이 단지 현재 호가 매물 없음.')+'</div></div>';
  }
  var favId=code+'|'+pt.name;
  var isFav=(window.SBAuth&&SBAuth.isIn())?SBAuth.favHas(favId):false;
  var html='<button id="rcClose" style="position:absolute;top:8px;right:10px;border:0;background:rgba(255,255,255,.28);color:#fff;font-size:18px;width:28px;height:28px;border-radius:50%;cursor:pointer;z-index:2">×</button>'
    +'<div class="rc-h" style="background:'+col+'"><div class="k">'+ti[0]+' · 실거래</div><h2>'+pt.name+'</h2><div class="loc">'+pt.dong+' '+(pt.jibun||'')+'</div>'
    +'<button id="rcFav" style="margin-top:9px;border:0;border-radius:100px;padding:8px 16px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;'
      +(isFav?'background:#ffd24d;color:#5c4300':'background:rgba(255,255,255,.92);color:#1a1a1a')+'">'
    +(isFav?'★ 등록됨 · 목록 보기':'☆ 관심단지 등록')+'</button></div>'
    +hoSec
    +'<div class="rc-sec"><div class="rc-lab">최근 실거래 · 평당 전용기준</div>'+(rows||'<div style="color:#8a8071;font-size:13px">거래 없음</div>')+'</div>'
    +(near?'<div class="rc-sec"><div class="rc-lab">인근 정비구역 (누르면 이동)</div>'+near+'</div>':'')
    +'<a class="rc-cta" href="단지상세.html?code='+code+'&nm='+encodeURIComponent(pt.name)+'&dong='+encodeURIComponent(pt.dong||'')+'" style="background:#12203a">이 단지 실거래·평형별 상세 →</a>'
    +'<div class="rc-note">실거래 기준일 '+((window.SB&&SB.summary&&SB.summary.updated)||'-')+' · 호가 수집일 '+(window.APTASKDAY||(A?'-':'미수집 지역'))+'</div>';
  var rc=document.getElementById('rcard');rc.innerHTML=html;rc.classList.add('open');
  document.getElementById('rcClose').onclick=function(){rc.classList.remove('open');};
  var fb=document.getElementById('rcFav');
  if(fb)fb.onclick=function(){
    var item={id:favId,nm:pt.name,code:code,dong:pt.dong||'',lastN:(pt.txs||txs||[]).length};
    function paint(on){
      fb.textContent=on?'★ 등록됨 · 목록 보기':'☆ 관심단지 등록';
      fb.style.background=on?'#ffd24d':'rgba(255,255,255,.92)';fb.style.color=on?'#5c4300':'#1a1a1a';
    }
    if(!(window.SBAuth&&SBAuth.isIn())){
      if(window.SBAuth)SBAuth.gate(item,null);
      return;
    }
    if(SBAuth.favHas(favId)){
      if(confirm('관심단지 목록으로 이동할까요? (취소=등록 해제)')){location.href='favorites.html';return;}
      SBAuth.delFav(favId).then(function(ok){if(ok)paint(false);});
    }
    else{SBAuth.addFav(item).then(function(ok){if(ok)paint(true);});}
    try{if(typeof gtag==='function')gtag('event','favorite_toggle',{item_name:pt.name});}catch(e){}
  };
}

function setMode(m){
  curMode=m;
  document.querySelectorAll('#modes button').forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});
  document.body.classList.toggle('redev',m==='redev');
  if(!map.hasLayer(layer))map.addLayer(layer);
  if(m==='trade'){
    if(map.hasLayer(redevLayer))map.removeLayer(redevLayer);
    document.getElementById('rcard').classList.remove('open');
    tradeLegend();render();
  }else{
    if(!map.hasLayer(redevLayer))map.addLayer(redevLayer);
    redevLegend();render();loadRedev(renderRedev);
  }
}
document.querySelectorAll('#modes button').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.m);});});
/* 모바일에선 trade 칩이 #map 안으로 이동돼 있어 두 위치 모두 배선 */
document.querySelectorAll('#rfbar button,#map .rfc.trade').forEach(function(b){b.addEventListener('click',function(){
  var rf=b.dataset.rf;
  if(rf==='trade'){redevShowTrade=!redevShowTrade;b.classList.toggle('on',redevShowTrade);render();}
  else{curRF[rf]=!curRF[rf];b.classList.toggle('on',curRF[rf]);renderRedev();}
});});
try{if((new URLSearchParams(location.search)).get('mode')==='redev'){setMode('redev');}}catch(e){}

render();
</script>
</body></html>
