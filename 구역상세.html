<script>
/* 시도 확장 데이터 병합 */
if(window.REDEVEXT){
  window.REDEVDETAIL=window.REDEVDETAIL||{};window.REDEVTREND=window.REDEVTREND||{};window.REDEVMARK=window.REDEVMARK||[];

  window.REDEVMARK=REDEVMARK.concat(g.marks||[]);})();
}
var RCOL={'재개발':'#E0632E','재건축':'#2554E0','주거환경':'#0FA98A'};
function catKo(c){return RCOL[c]?c:'정비구역';}
var STAGEIDX={'정비구역지정':0,'정비계획 수립':0,'재정비촉진지구수립':0,'안전진단':0,'안전진단(1차)':0,
'추진위원회승인':1,'추진위구성':1,'조합원 모집신고':1,'주민대표회의구성통지':1,
'조합설립인가':2,'사업시행인가':3,'사업시행계획인가':3,'사업시행자(LH) 지정':3,
'관리처분인가':4,'착공':5,'분양':5,'철거':5,'이주':5,'준공':6,'준공인가':6,
'구역지정':0,'구역지정(예정)':0,'재건축진단':0,'추진위 승인':1,'이주·철거':5};
function stageBar(stage){
  var order=['구역지정','추진위','조합설립','사업시행','관리처분','착공','준공'];
  var cur=(stage in STAGEIDX)?STAGEIDX[stage]:-1;
  return '<div class="stage">'+order.map(function(nm,i){
    var cls=i<cur?'done':(i===cur?'now':'');
    return '<div class="st '+cls+'"><div class="dot"></div><div class="t">'+nm+'</div></div>';}).join('')+'</div>';
}
function num(v){return v?Number(v).toLocaleString():'';}
/* 면적은 평을 병기한다(2026-07-26 원칙). 100㎡ 미만은 소수1자리, 이상은 정수. */
function PY(m){m=+m;if(!m)return '';var p=m/3.305785;return (p<100?p.toFixed(1):Math.round(p).toLocaleString())+'평';}
function m2(v){return v?num(Math.round(v))+'㎡('+PY(v)+')':'';}
/* 최고높이 정규화(2026-08-05).
   원본 정비몽땅 값이 m·cm·mm가 섞여 들어온다(은마 118400=mm, 신길7 7790=cm).
   층수를 아는 경우 층당 2.6~6.0m에 들어맞는 배율만 채택하고, 어느 배율도 안 맞으면
   값 자체를 못 믿는 것이므로 표시하지 않는다(층수를 그대로 적어 넣은 행, 0·1 같은 더미가 있다).
   층수를 모르면 사람이 사는 건물로 말이 되는 10~300m만 통과시킨다. */
function normH(h,floors){
  h=parseFloat(String(h||'').replace(/,/g,''));
  if(!isFinite(h)||h<=0)return '';
  var m=/지상[:\s]*(\d+)/.exec(floors||''),up=m?parseInt(m[1],10):0;
  var cands=[h,h/10,h/100,h/1000];
  if(up>0){
    for(var i=0;i<cands.length;i++){var r=cands[i]/up;if(r>=2.6&&r<=6.0)return cands[i];}
    return '';
  }
  return (h>=10&&h<=300)?h:'';
}
/* 정비계획 수치 범위 가드(2026-08-05). 원본 오기(용적률 4%·건폐율 722%·61,944세대 등)가
   그대로 노출되던 것 — 상식 범위 밖이면 그 칸을 표시하지 않는다(최고높이와 같은 원칙). */
function okRange(v,lo,hi){v=parseFloat(String(v||'').replace(/,/g,''));return (isFinite(v)&&v>=lo&&v<=hi)?v:null;}
/* 대외 출처 순화: 소스명 대신 '공공 DB', 기준일만 유지 */
function srcLab(s){var m=(s||'').match(/\(([^)]*기준[^)]*)\)/);return '공공 DB'+(m?' ('+m[1]+')':'');}
function qs(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';}
function esc(s){return (s||'').replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}

function render(){
  var nm=qs('nm');
  /* 상단 링크도 이 구역으로 (2026-08-04). 구역명이 없으면 기존대로 재개발 지도 첫 화면 */
  (function(){
    var a=document.getElementById('topMap');
    if(a&&nm)a.href='map.html?mode=redev&q='+encodeURIComponent(nm);
  })();
  var D=window.REDEVDETAIL||{};
  var d=D[nm];
  var app=document.getElementById('app');
  if(!nm||!d){app.innerHTML='<div class="pend">구역 정보를 찾지 못했습니다. 지도에서 구역을 눌러 다시 열어주세요.</div>';document.title='정비구역 상세';return;}
  document.title=nm+' · 정비구역 상세';
  var cat=catKo(d.cat|| (d.gubun&&d.gubun.indexOf('재개발')>=0?'재개발':(d.gubun&&d.gubun.indexOf('주거환경')>=0?'주거환경':'재건축')));
  var col=RCOL[cat];
  var tg=(window.REDEVTAG||{})[nm]||'';
  var tgm={'신통':['신속통합기획','#C2185B'],'모아':['모아주택','#7CB518']}[tg];
  var tgb=tgm?'<span class="pill" style="background:'+tgm[1]+';margin-right:6px">'+tgm[0]+'</span>':'';
  var h='<div class="mast"><div class="k">'+(d.sido||'서울')+' '+esc(d.gu||'')+' · '+cat+' · 정비구역</div>'
    +'<h1>'+esc(nm)+'</h1>'
    +tgb+'<span class="pill" style="background:'+col+'">'+esc(d.stage||'확인중')+'</span>'
    +'<div class="loc">'+esc(d.gubun||'')+'</div></div>';
  h+='<div class="sec"><div class="lab">추진 단계 · '+srcLab(d.src)+' 최신</div>'+stageBar(d.stage)+'</div>';

  if(d.fixed){
    var _far=okRange(d.far,50,1500),_bcr=okRange(d.bcr,5,90),_un=okRange(d.units,5,20000);
    h+='<div class="sec"><div class="lab">정비계획 핵심 · '+srcLab(d.src)+' 사업개요</div><div class="big">'
      +(_far?'<div class="stat"><div class="n">'+_far+'%</div><div class="l">용적률</div></div>':'')
      +(_bcr?'<div class="stat"><div class="n">'+_bcr+'%</div><div class="l">건폐율</div></div>':'')
      +(_un?'<div class="stat"><div class="n">'+num(_un)+'</div><div class="l">계획 세대수</div></div>':'')
      +'</div></div>';
    /* 대지면적이 정비구역 면적보다 20% 이상 크면 둘 중 하나가 원본 오기다(사당동 318-99가
       7배 — 2026-08-05 대조). 어느 쪽이 틀렸는지 알 수 없으니 둘 다 표시하지 않는다.
       20% 이내 초과는 국공유지 포함 등 정의 차이일 수 있어 그대로 둔다. */
    var _areaConflict=(function(){var z=parseFloat(d.zone_area),st=parseFloat(d.site_area);
      return (isFinite(z)&&isFinite(st)&&z>0&&st>z*1.2);})();
    h+='<div class="sec"><div class="lab">규모 · 면적</div><div class="grid">'
      +kv('용도지역',d.usezone)
      /* 면적 3종은 이름만으로 헷갈린다(석봉님 8/5 지적) — 뜻을 같이 적는다 */
      +kv('정비구역 면적 · 구역 전체 땅',_areaConflict?'':m2(d.zone_area))
      +kv('대지면적 · 건물이 앉는 땅',_areaConflict?'':m2(d.site_area))
      +kv('연면적 · 모든 층 바닥 합계',m2(d.floor_area))
      +kv('건축면적',d.height_area)
      +kv('최고층수',d.floors)
      +kv('최고높이',(function(v){return v?(v<100?v.toFixed(1):Math.round(v).toLocaleString())+'m':'';})(normH(d.height,d.floors)))
      +'</div></div>';
    /* 구간 세대는 분양표만 집계된 값이고 총세대는 임대 포함이라 합이 안 맞는 게 정상
       (2026-08-05 원본 대조 — 정비몽땅 수집기가 분양표+임대표를 합쳐 총세대를 만든다).
       독자가 오해하지 않게 기준을 표기하고, 차이가 나면 임대분으로 안내한다. */
    var _bsum=(parseInt(d.u60)||0)+(parseInt(d.u6085)||0)+(parseInt(d.u85)||0);
    var _rent=(_un&&_bsum&&_un>_bsum)?(_un-_bsum):0;
    var seh=(d.u60||d.u6085||d.u85)?('<div class="sec"><div class="lab">전용면적별 계획 세대 (분양분 기준)</div><div class="grid">'
      +kv('전용 60㎡(18.1평) 이하',d.u60?num(d.u60)+'세대':'')
      +kv('전용 60~85㎡(18.1~25.7평)',d.u6085?num(d.u6085)+'세대':'')
      +kv('전용 85㎡(25.7평) 초과',d.u85?num(d.u85)+'세대':'')
      +kv('총 세대'+(_rent?' (임대 포함)':''),_un?num(_un)+'세대':'')
      +'</div>'
      +(_rent?'<div class="note">면적 구간은 분양분 기준이라 합계('+num(_bsum)+'세대)와 총 세대의 차이 '+num(_rent)+'세대는 임대 등 기타 공급분입니다.</div>':'')
      +'</div>'):'';
    h+=seh;
    h+='<div class="sec"><div class="lab">권리 관계</div><div class="grid">'
      +kv('조합원 수',d.members?num(d.members)+'명':'')
      +kv('토지등소유자 수',d.owners?num(d.owners)+'명':'')
      +'</div></div>';
  }else{
    /* 공람·언론 단계 보강(2026-08-08 석봉님 확정): 공공 DB가 비어 있어도 공람안이 확보된 구역은
       출처를 구분해 보여준다. 확정값과 절대 섞지 않도록 라벨·출처·주의문을 함께 표기한다. */
    var ov=(window.REDEVOVR||{})[nm];
    if(ov&&ov.rows&&ov.rows.length){
      h+='<div class="sec"><div class="lab">정비계획 · 공람안 기준 (확정 아님)</div><div class="grid">'
        +ov.rows.map(function(r){return kv(r[0],r[1]);}).join('')
        +'</div><div class="note">공공 DB 확정값이 아닌 공람·고시 단계 계획('+esc(ov.asof||'')+')으로, 심의 과정에서 달라질 수 있습니다. 출처: '+esc(ov.src||'')+'</div></div>';
    }else{
      h+='<div class="sec"><div class="lab">정비계획</div><div class="pend">정비계획 확정 전입니다. 용적률·세대수·면적 등 세부 계획은 사업시행계획이 확정·고시되는 시점에 채워집니다. 지금 단계에서는 추진 단계와 사업 구분까지 확인됩니다.</div></div>';
    }
  }
  var tr=(window.REDEVTREND||{})[nm];
  h+='<div class="sec"><div class="lab">구역 시세 추이 · 법정동 매매 평당(전용)</div>'
    +(tr?trendSection(tr,d.gu):'<div class="soon">'
      +'<svg viewBox="0 0 48 28" width="54" height="31" fill="none" stroke="#a8792c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,24 12,16 22,19 32,9 46,3"/><circle cx="46" cy="3" r="2.6" fill="#a8792c" stroke="none"/></svg>'
      +'<div class="tag">업데이트 예정</div>'
      +'<div>이 구역 법정동의 과거 실거래 표본이 부족합니다. 데이터가 쌓이면 연도별 시세 그래프가 표시됩니다.</div></div>')+'</div>';
  h+='<div class="sec" id="nearTxSec"></div>';
  h+='<div class="sec"><div class="lab">더 보기</div>'
    /* 구역 이름을 안 붙이면 재개발 지도 첫 화면(서울 전역)이 떠서 보던 구역이 사라진다
       (2026-08-04 단지상세에서 같은 문제가 제보돼 함께 고침) */
    +'<a class="cta dark" href="map.html?mode=redev&q='+encodeURIComponent(nm)+'">지도에서 이 구역 보기 →</a>'
    +'<a class="cta line" href="재개발_기초상식.html">재개발·재건축 기초상식 →</a></div>';
  app.innerHTML=h;
  if(tr)drawTrend(99);
  loadNearTx(nm,d.gu);
}
var GUCODE={'종로구':'11110','중구':'11140','용산구':'11170','성동구':'11200','광진구':'11215','동대문구':'11230','중랑구':'11260','성북구':'11290','강북구':'11305','도봉구':'11320','노원구':'11350','은평구':'11380','서대문구':'11410','마포구':'11440','양천구':'11470','강서구':'11500','구로구':'11530','금천구':'11545','영등포구':'11560','동작구':'11590','관악구':'11620','서초구':'11650','강남구':'11680','송파구':'11710','강동구':'11740'};
function hav(a,b,c,d){var R=6371000,r=Math.PI/180,x=Math.sin((c-a)*r/2),y=Math.sin((d-b)*r/2);return 2*R*Math.asin(Math.sqrt(x*x+Math.cos(a*r)*Math.cos(c*r)*y*y));}
function eok(m){if(!m)return '·';var v=m/10000;return (v>=100?Math.round(v):(''+v.toFixed(1)).replace(/\.0$/,''))+'억';}
function zoneCoords(nm){
  var c=null;
  (window.REDEVMARK||[]).forEach(function(m){if(!c&&m.nm===nm)c=[m.lat,m.lon];});
  if(!c&&window.REDEV&&REDEV.features)REDEV.features.forEach(function(f){if(c)return;if((f.properties.biz||f.properties.nm)===nm){var r0=f.geometry.coordinates[0],cx=0,cy=0;for(var i=0;i<r0.length;i++){cx+=r0[i][0];cy+=r0[i][1];}c=[cy/r0.length,cx/r0.length];}});
  return c;
}
var _TREND=null,_TRENDGU='';
function trendSection(s,gu){
  _TREND=s;_TRENDGU=gu;
  var btns=[['전체',99],['최근5년',5],['최근3년',3]].map(function(b){
    return '<button class="trbtn'+(b[1]===99?' on':'')+'" onclick="drawTrend('+b[1]+',this)">'+b[0]+'</button>';}).join('');
  return '<div style="border:1px solid #ded8cc;border-radius:11px;padding:12px 14px;background:#fff">'
    +'<div style="display:flex;gap:5px;margin-bottom:9px">'+btns+'</div><div id="trendchart"></div></div>';
}
function drawTrend(ny,btn){
  if(btn){var ps=btn.parentNode.querySelectorAll('.trbtn');for(var i=0;i<ps.length;i++)ps[i].classList.remove('on');btn.classList.add('on');}
  var s=_TREND||[]; if(ny<99&&s.length>ny)s=s.slice(s.length-ny);
  var el=document.getElementById('trendchart'); if(el)el.innerHTML=trendSvg(s,_TRENDGU);
}
function trendSvg(s,gu){
  if(!s||s.length<2)return '<div style="color:#8a8071;padding:10px 2px;font-size:13px">해당 기간 표본이 부족합니다.</div>';
  var W=600,H=182,padL=54,padR=16,padT=26,padB=28;
  var ys=s.map(function(d){return d.py;}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
  var x0=s[0].y,x1=s[s.length-1].y,sp=(x1-x0)||1;
  function X(y){return padL+(y-x0)/sp*(W-padL-padR);}
  function Y(v){return padT+(1-(v-mn)/((mx-mn)||1))*(H-padT-padB);}
  var grid='';[mx,(mn+mx)/2,mn].forEach(function(v){var yy=Y(v).toFixed(1);
    grid+='<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="#efe8da" stroke-width="1"/>'
      +'<text x="'+(padL-7)+'" y="'+(parseFloat(yy)+3.5)+'" font-size="10" fill="#8a8071" text-anchor="end">'+Math.round(v).toLocaleString()+'</text>';});
  var line=s.map(function(d){return X(d.y).toFixed(1)+','+Y(d.py).toFixed(1);}).join(' ');
  var area='M'+X(x0).toFixed(1)+','+(H-padB)+' L'+line.split(' ').join(' L')+' L'+X(x1).toFixed(1)+','+(H-padB)+' Z';
  /* 표본 5건 미만 연도는 속 빈 흐린 점 + 툴팁(2026-08-05). 동 단위라 단지(3건)보다 문턱을 높게. */
  var dots=s.map(function(d){var thin=(d.n||0)<5;
    return '<circle cx="'+X(d.y).toFixed(1)+'" cy="'+Y(d.py).toFixed(1)+'" r="'+(thin?2.5:3)+'"'
      +(thin?' fill="#f8f6f1" stroke="#c9b183" stroke-width="1.5" opacity=".85"':' fill="#a8792c"')
      +'><title>'+d.y+'년 '+d.py.toLocaleString()+'만원/평 · '+(d.n||0)+'건'+(thin?' (표본 적음·참고만)':'')+'</title></circle>';}).join('');
  var xlabs=s.map(function(d,i){return (s.length<=7||i===0||i===s.length-1||i%2===0)?'<text x="'+X(d.y).toFixed(1)+'" y="'+(H-9)+'" font-size="10" fill="#8a8071" text-anchor="middle">'+d.y+'</text>':'';}).join('');
  var solid=s.filter(function(d){return (d.n||0)>=5;});
  var rb=solid.length>=2?solid:s;
  var first=rb[0],last=rb[rb.length-1],rise=Math.round((last.py/first.py-1)*100);
  var thinCnt=s.length-solid.length;
  var head='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><span style="font-size:12.5px;color:#6b6355">'+esc(gu)+' 법정동 · '+s[0].y+'~'+s[s.length-1].y+'</span><b style="font-size:16px;color:'+(rise>=0?'#c0562e':'#2b6cb0')+'">'+(rise>=0?'+':'')+rise+'%</b></div>';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:visible">'
    +'<text x="6" y="13" font-size="10" fill="#8a8071">만원/평(전용)</text>'
    +grid
    +'<path d="'+area+'" fill="rgba(168,121,44,.12)"/><polyline points="'+line+'" fill="none" stroke="#a8792c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+dots+xlabs
    +'<text x="'+X(s[s.length-1].y).toFixed(1)+'" y="'+(Y(s[s.length-1].py)-9).toFixed(1)+'" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">'+s[s.length-1].py.toLocaleString()+'</text>'
    +'</svg>';
  return head+svg+'<div class="note" style="margin-top:4px">Y축=평당 만원(전용) · X축=연도 · 법정동 아파트 매매 실거래 연도별 중위값(해제 제외). 구역 단지가 아닌 동 단위 참고치.'
    +(thinCnt?' 속이 빈 점은 그 해 거래 5건 미만이라 참고만 하십시오.':'')
    +(solid.length>=2&&thinCnt?' 상승률은 5건 이상인 해('+first.y+'~'+last.y+') 기준.':'')+'</div>';
}
function loadNearTx(nm,gu){
  var d=(window.REDEVDETAIL||{})[nm]||{};
  var co=zoneCoords(nm),code=GUCODE[gu]||d.sgg;
  if(!co||!code)return;
  var s=document.createElement('script');s.src='data/detail_'+code+'.js';
  s.onload=function(){fillNearTx(co,code);};s.onerror=function(){};document.body.appendChild(s);
}
var TYPE={apt:['아파트','#2554E0'],offi:['오피스텔','#7A5AF8'],villa:['연립·다세대','#0FA98A'],house:['단독·다가구','#6E6E6A'],bldg:['빌딩','#D4573F'],comm:['구분상가·오피스','#E8A13A'],land:['토지','#4C9A4C']};
var SN={apt:'아파트',offi:'오피스텔',villa:'연립',house:'단독',bldg:'빌딩',comm:'상가',land:'토지'};
var ORD={apt:0,offi:1,villa:2,house:3,comm:4,bldg:5,land:6};
function fillNearTx(co,code){
  var arr=(window.SB&&SB.d&&SB.d[code])||[];
  var near=arr.filter(function(p){return p.lat;}).map(function(p){return {p:p,d:Math.round(hav(co[0],co[1],p.lat,p.lng))};})
    .filter(function(o){return o.d<=1200;}).sort(function(a,b){return a.d-b.d;}).slice(0,10);
  if(!near.length)return;
  near.sort(function(a,b){return (ORD[a.p.t]||9)-(ORD[b.p.t]||9)||a.d-b.d;});
  var rows=near.map(function(o){var t=(o.p.txs||[])[0];if(!t)return '';var tp=TYPE[o.p.t]||['기타','#8a8071'];
    var py=(t.u==='매매'&&t.a)?(' <span style="color:#8a8071;font-weight:400">'+Number(Math.round(t.p/t.a*3.305785)).toLocaleString()+'만/평</span>'):'';
    var pr=t.u==='월세'?(eok(t.p)+' / '+t.r+'만'):eok(t.p);
    var chip='<span style="background:'+tp[1]+';color:#fff;font-size:9.5px;padding:1px 6px;border-radius:20px;font-weight:700;margin-right:6px">'+(SN[o.p.t]||'기타')+'</span>';
    return '<a href="단지상세.html?code='+code+'&nm='+encodeURIComponent(o.p.name)+'&dong='+encodeURIComponent(o.p.dong||'')+'" style="display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:inherit;padding:7px 2px;border-bottom:1px dotted #e7e1d4;font-size:13px"><span style="color:#6b6355">'+chip+esc(o.p.name)+' <span style="color:#8a8071">'+o.d+'m</span> <span style="color:#b6ad9c">→</span></span><b style="white-space:nowrap">'+pr+py+'</b></a>';}).join('');
  document.getElementById('nearTxSec').innerHTML='<div class="lab">인근 실거래 · 상품별 · 누르면 단지 상세</div>'+rows;
}
function kv(k,v){return v?'<div class="kv"><span>'+k+'</span><span class="v">'+esc(String(v))+'</span></div>':'';}
render();
</script>
