.pcard{background:var(--soft);border:1px solid var(--hair);border-radius:14px;overflow:hidden;

.pcard .bd>span{display:block}
.pcard .cat{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.pcard .ti{font-size:15.5px;font-weight:800;line-height:1.4;letter-spacing:-0.02em;color:var(--text);margin:5px 0 6px}
/* .bd>span 규칙보다 뒤에 오고 선택자도 같은 무게라 이쪽이 이긴다.
   앞 규칙이 이기면 3줄 자르기가 풀려 카드 높이가 제각각이 된다(2026-08-02 확인) */
.pcard .bd>span.ex{font-size:13px;color:var(--muted);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard .dt{font-size:11.5px;color:var(--muted2);margin-top:9px}
.empty{color:var(--muted);font-size:14px;padding:30px 0}

<script>
(function(){
  var P=(window.SB&&SB.posts&&SB.posts.items)||[],el=document.getElementById('plist'),cur='';
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function card(p){
    var th=p.img?'<img class="th" src="'+encodeURI(p.img)+'" alt="" loading="lazy">':'';
    return '<a class="pcard" href="'+encodeURI('글/'+p.f)+'">'+th
      +'<span class="bd"><span class="cat">'+esc(p.c)+'</span>'
      +'<span class="ti">'+esc(p.t)+'</span>'
      +'<span class="ex">'+esc(p.e)+'</span>'
      +'<span class="dt">'+esc(p.d)+'</span></span></a>';
  }
  function draw(){
    var rows=cur?P.filter(function(p){return p.c===cur;}):P;
    el.innerHTML=rows.length?rows.map(card).join(''):'<p class="empty">글이 없습니다.</p>';
  }
  document.querySelectorAll('.filters button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.filters button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');cur=b.dataset.c;draw();
    });
  });
  draw();
})();
</script>
