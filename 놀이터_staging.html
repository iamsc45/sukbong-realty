<style>
/* ── 놀이터 · 가격 맞히기 (2026-08-31 개편) ────────────────────────
   설계 원칙: **사이트와 같은 B&W 에디토리얼**로 되돌린다.
   전 판은 네이비 배경 + 파란 칩 + 초록 카드라 사이트에서 혼자 튀었다
   (석봉님 "너무 촌스러워"). 색은 잉크 + 회색 + 강조 하나로 줄이고,
   상자 대신 괘선으로 나눈다. 위계는 크기와 굵기로만 만든다. */
.q-wrap{max-width:560px;margin:0 auto;padding:0 20px 72px}

.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:38px 0 10px}
h1.q{font-size:clamp(30px,7vw,44px);font-weight:800;letter-spacing:-.04em;margin:0 0 12px;line-height:1.15}
.lead{color:var(--muted);font-size:14.5px;line-height:1.8;margin:0 0 22px;word-break:keep-all}
.rules{font-size:12.5px;color:var(--text2);border-top:1px solid var(--hair);
  border-bottom:1px solid var(--hair);padding:13px 0;margin:0 0 26px;line-height:1.9}
.rules b{font-weight:700}
.mine-best{font-size:12.5px;color:var(--muted);margin-top:16px}

.btn.full{display:block;width:100%;text-align:center;border:0;font-family:inherit;cursor:pointer}
button.btn{font-size:15px}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--text)}
.btn+.btn{margin-top:9px}

/* ── 문제 ── */
.meter{display:flex;align-items:center;gap:12px;margin:30px 0 6px}
.steps{display:flex;gap:5px}
.steps i{width:22px;height:2px;background:var(--hair);transition:background 200ms}
.steps i.done{background:var(--text)}
.steps i.on{background:var(--text)}
.left{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.left b{color:var(--text);font-weight:700}
.left.warn b{color:var(--down)}
.tline{height:2px;background:var(--hair);margin-bottom:26px}
.tline i{display:block;height:100%;width:100%;background:var(--text)}
.tline.warn i{background:var(--down)}

.place{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.apt{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.25;margin:0 0 10px;word-break:keep-all}
.spec{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:34px}

.guess{text-align:center}
.guess .v{font-size:clamp(34px,9vw,46px);font-weight:800;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.guess .l{font-size:12px;color:var(--muted);margin:6px 0 20px}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--hair)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:var(--text);margin-top:-12px;cursor:pointer}
input[type=range]::-moz-range-track{height:2px;background:var(--hair)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--text);border:0}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted2);margin:9px 0 30px}
.trail{font-size:12px;color:var(--muted);line-height:1.9;margin-top:18px}

/* ── 채점 대기 ── */
.mid{text-align:center;padding:60px 0 20px}
.mid h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
.mid p{color:var(--muted);font-size:14px;margin:0 0 26px}

/* ── 결과 ── */
.score{border-bottom:1px solid var(--hair);padding:34px 0 26px;margin-bottom:4px}
.score .l{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.score .n{font-size:66px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:10px 0 0;
  font-variant-numeric:tabular-nums;display:inline-block}
.score .n em{font-style:normal;font-size:26px;color:var(--muted2);font-weight:700;letter-spacing:-.02em}
.score .tag{font-size:13.5px;font-weight:700;margin-top:12px}
.score .meta{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:8px}

/* 항목 — 상자 대신 왼쪽 괘선 하나로 정답을 표시한다 */
.row{border-bottom:1px solid var(--hair);padding:17px 0 17px 15px;
  border-left:2px solid transparent;cursor:pointer;animation:rise .3s ease}
.row.hit{border-left-color:var(--up)}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.row .a{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row .nm{font-size:15.5px;font-weight:700;letter-spacing:-.02em;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .ans{font-size:17px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .b{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.row .b .when{white-space:nowrap}
.row .c{font-size:12px;color:var(--muted2);margin-top:7px}
.row .c .ok{color:var(--up);font-weight:700}
.row .c .no{color:var(--muted)}
.det{display:none;margin-top:13px;padding-top:13px;border-top:1px dashed var(--hair)}
.det.open{display:block}
.det dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.det dt{color:var(--muted)}
.det dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.det a{display:inline-block;margin-top:11px;font-size:12.5px;font-weight:700;color:var(--text);
  border-bottom:1px solid var(--text);text-decoration:none;padding-bottom:1px}
.tap{font-size:11.5px;color:var(--muted2);margin:14px 0 30px}

.foot{font-size:11px;color:var(--muted2);line-height:1.8;margin-top:38px;
  border-top:1px solid var(--hair);padding-top:14px}
.hide{display:none}
</style>
</head>

<div class="q-wrap">

  <!-- 시작 -->
  <section id="intro">
    <div class="eyebrow">실거래가 맞히기</div>
    <h1 class="q">이 집, 얼마일까요?</h1>
    <p class="lead">국토교통부에 신고된 진짜 거래 다섯 건입니다.<br>얼마에 팔렸을지 맞혀 보세요.</p>
    <div class="rules">
      다섯 문제 · 오차 <b>10%</b> 안에 들면 정답 · 문제당 <b>20초</b><br>
      정답은 다 푼 뒤에 한꺼번에 공개됩니다.
    </div>
    <button class="btn full" id="start">시작하기</button>
    <div class="mine-best" id="bestIntro"></div>
  </section>

  <!-- 문제 -->
  <section id="play" class="hide">
    <div class="meter">
      <div class="steps" id="steps"></div>
      <span class="left" id="left">남은 시간 <b id="tsec">20</b>초</span>
    </div>
    <div class="tline" id="tline"><i id="tfill"></i></div>

    <div id="qbox">
      <div class="place" id="place"></div>
      <div class="apt" id="apt"></div>
      <div class="spec" id="spec"></div>
    </div>

    <div class="guess">
      <div class="v" id="val"></div>
      <div class="l">내가 생각한 가격</div>
      <input type="range" id="rng">
      <div class="ends"><span id="lo"></span><span id="hi"></span></div>
    </div>

    <button class="btn full" id="submit">이 가격으로 확정</button>
    <div class="trail" id="trail"></div>
  </section>

  <!-- 채점 대기 -->
  <section id="wait" class="hide">
    <div class="mid">
      <h2>다섯 문제를 다 푸셨습니다</h2>
      <p>이제 실제 거래가와 맞춰 보겠습니다.</p>
      <button class="btn full" id="reveal">결과 확인하기</button>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" class="hide">
    <div class="score">
      <div class="l">결과</div>
      <div class="n"><span id="hit">0</span><em> / 5</em></div>
      <div class="tag" id="tag"></div>
      <div class="meta" id="meta"></div>
    </div>
    <div id="list"></div>
    <div class="tap">항목을 누르면 그 단지의 최근 시세가 나옵니다</div>
    <button class="btn full" id="share">결과 공유하기</button>
    <button class="btn full line" id="again">다시 하기</button>
    <a class="btn full line" href="map.html" style="text-decoration:none">전국 실거래가 지도에서 보기</a>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script src="assets/sb_share.js?v=2"></script>
<script src="data/quiz_price.js?v=4"></script>
<script>
(function(){
  "use strict";
  var D = window.QUIZ_PRICE || {items:[]};
  var POOL = D.items || [];
  var N = 5;          // 한 세트 문제 수 (2026-08-30 석봉님 확정)
  var HIT = 10;       // 오차 10% 안에 들면 정답 (2026-08-30 석봉님 확정)
  var SEC = 20;       // 문제당 제한 시간 (2026-08-30 석봉님 지시)
  var set = [], idx = 0, log = [];
  var tStart = 0, tick = 0, away = 0, awayAt = 0;
  var $ = function(id){ return document.getElementById(id); };

  /* 다른 화면에 다녀온 시간을 잰다. 검색을 막을 수는 없지만 사실은 남는다 */
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ awayAt = Date.now(); }
    else if(awayAt){ away += Date.now() - awayAt; awayAt = 0; }
  });

  function money(man){
    var eok = Math.floor(man/10000), rest = man%10000;
    if(eok && rest) return eok+"억 "+rest.toLocaleString()+"만원";
    if(eok) return eok+"억원";
    return man.toLocaleString()+"만원";
  }
  function ymd(q){
    var p = (q.ymd || q.ym || "").split("-");
    if(p.length >= 3) return p[0]+"년 "+(+p[1])+"월 "+(+p[2])+"일";
    if(p.length === 2) return p[0]+"년 "+(+p[1])+"월";
    return "";
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
    return a;
  }
  function grade(hit){
    return ["다시 도전","다시 도전","조금 아쉽습니다","감이 좋으시네요","고수시네요","신의 눈"][hit];
  }
  function show(which){
    ["intro","play","wait","result"].forEach(function(k){
      $(k).classList.toggle("hide", k!==which);
    });
    window.scrollTo(0,0);
  }
  function drawSteps(){
    $("steps").innerHTML = set.map(function(_,i){
      return "<i class='"+(i<idx?"done":(i===idx?"on":""))+"'></i>";
    }).join("");
  }

  function render(){
    var q = set[idx];
    drawSteps();
    $("place").textContent = q.sgg+" "+q.dong;
    $("apt").textContent = q.apt;
    $("spec").textContent =
      "전용 "+q.m2+"㎡("+q.py+"평) · "+q.fl+"층 · "+q.yr+"년 준공 · "+
      q.ym.split("-")[0]+"년 "+(+q.ym.split("-")[1])+"월 계약";

    var r = $("rng");
    r.min = q.lo; r.max = q.hi; r.step = q.st;
    r.value = Math.round(((+q.lo + +q.hi)/2)/q.st)*q.st;
    $("lo").textContent = money(q.lo);
    $("hi").textContent = money(q.hi);
    $("val").textContent = money(+r.value);

    var box = $("qbox");
    box.style.animation = "none"; void box.offsetWidth; box.style.animation = "rise .3s ease";
    startTimer();
  }

  /* 남은 시간은 Date.now() 로 잰다. 탭이 백그라운드여도 시계는 정확하다 */
  function startTimer(){
    stopTimer();
    tStart = Date.now();
    var fill = $("tfill"), line = $("tline"), left = $("left"), sec = $("tsec");
    fill.style.width = "100%";
    line.classList.remove("warn"); left.classList.remove("warn");
    sec.textContent = SEC;
    tick = setInterval(function(){
      var rem = SEC - (Date.now() - tStart)/1000;
      if(rem <= 0){
        stopTimer(); fill.style.width = "0%"; sec.textContent = 0;
        submit(true); return;
      }
      fill.style.width = (rem/SEC*100).toFixed(1)+"%";
      sec.textContent = Math.ceil(rem);
      if(rem <= 5){ line.classList.add("warn"); left.classList.add("warn"); }
    }, 100);
  }
  function stopTimer(){ if(tick){ clearInterval(tick); tick = 0; } }

  $("rng").addEventListener("input", function(){
    $("val").textContent = money(+this.value);
  });

  function submit(auto){
    if(idx >= set.length) return;
    stopTimer();
    var q = set[idx], my = +$("rng").value;
    var spent = Math.min((Date.now() - tStart)/1000, SEC);
    log.push({q:q, my:my, err: Math.abs(my - q.ans)/q.ans*100, sec:spent, auto:!!auto});
    $("trail").textContent = log.map(function(x, i){
      return (i+1)+"번 "+money(x.my)+(x.auto ? " (시간 종료)" : "");
    }).join("   ");
    idx++;
    if(idx >= set.length){ setTimeout(function(){ show("wait"); }, 220); }
    else { render(); window.scrollTo({top:0, behavior:"smooth"}); }
  }
  $("submit").addEventListener("click", function(){ submit(false); });

  function renderResult(){
    var hit = 0, sum = 0, spent = 0, autos = 0;
    log.forEach(function(x){
      sum += x.err; spent += x.sec;
      if(x.err <= HIT) hit++;
      if(x.auto) autos++;
    });
    var avg = sum/log.length;

    show("result");

    /* 🔴 점수는 세어 올리지 않는다. 처음부터 정확한 값을 쓴다.
       세는 연출이 0 에서 1 을 찍거나 도중 값에 멈춰 틀린 점수가 보인 적이 있다(2026-08-31). */
    $("hit").textContent = hit;
    $("tag").textContent = grade(hit);
    $("meta").innerHTML = "평균 오차 "+avg.toFixed(1)+"% · 걸린 시간 "+Math.round(spent)+"초"+
      (autos ? "<br>시간이 끝나 자동 제출된 문제 "+autos+"개" : "")+
      (away > 3000 ? "<br>푸는 동안 다른 화면에 "+Math.round(away/1000)+"초 다녀오셨습니다" : "");

    /* 항목은 전부 즉시 붙이고 움직임만 늦춘다(백그라운드에서 setTimeout 이 늘어진다) */
    $("list").innerHTML = "";
    log.forEach(function(x, i){ addRow(x, i); });

    var prev = null;
    try{
      var raw = localStorage.getItem("sb_quiz_hit");
      prev = raw === null ? null : parseInt(raw, 10);
      if(prev === null || hit > prev){ localStorage.setItem("sb_quiz_hit", String(hit)); }
    }catch(e){}
    $("foot").innerHTML = footText() +
      (prev !== null && hit > prev ? "<br><b>최고 기록을 새로 세웠습니다.</b>" : "");
  }

  function addRow(x, i){
    var ok = x.err <= HIT;
    var near = !ok && x.err <= 15;
    var d = document.createElement("div");
    d.className = "row"+(ok ? " hit" : "");
    d.style.animationDelay = (0.05*i)+"s";
    d.innerHTML =
      "<div class='a'><span class='nm'>"+x.q.apt+"</span>"+
        "<span class='ans'>"+money(x.q.ans)+"</span></div>"+
      "<div class='b'><span>내 답 "+money(x.my)+"</span>"+
        "<span class='when'>"+ymd(x.q)+" 거래</span></div>"+
      "<div class='c'>"+x.q.sgg+" · 오차 "+x.err.toFixed(1)+"% · "+
        (ok ? "<span class='ok'>정답</span>" : "<span class='no'>"+(near?"아깝습니다":"오답")+"</span>")+
        " · "+(x.auto ? "시간 종료" : x.sec.toFixed(1)+"초")+"</div>"+
      "<div class='det'><dl>"+
        "<dt>최근 거래</dt><dd>"+x.q.n+"건</dd>"+
        "<dt>중위 가격</dt><dd>"+money(x.q.med)+"</dd>"+
        "<dt>평당가(전용)</dt><dd>"+x.q.ppy.toLocaleString()+"만원</dd>"+
        "</dl><a href='map.html?q="+encodeURIComponent(x.q.q)+
        "' target='_blank' rel='noopener'>이 단지 지도에서 보기</a></div>";
    d.addEventListener("click", function(e){
      if(e.target.closest("a")) return;
      d.querySelector(".det").classList.toggle("open");
    });
    $("list").appendChild(d);
  }

  function begin(){
    stopTimer();
    set = shuffle(POOL.slice()).slice(0, N);
    idx = 0; log = []; away = 0; awayAt = 0; $("trail").textContent = "";
    show("play"); render();
  }
  $("start").addEventListener("click", function(){
    if(!POOL.length){ alert("문제를 불러오지 못했습니다."); return; }
    begin();
  });
  $("again").addEventListener("click", begin);
  $("reveal").addEventListener("click", renderResult);

  /* 결과 공유 — 카카오톡이 되면 카카오톡으로, 안 되면 시스템 공유·복사로 물러선다.
     카카오 JavaScript 키가 `assets/sb_share.js` 에 채워지면 그때부터 카카오톡 창이 뜬다. */
  var SITE = "https://xn--2q1br1nnrasc92a76myvau64b.com/";
  $("share").addEventListener("click", function(){
    var btn = this;
    var hit = log.filter(function(x){ return x.err <= HIT; }).length;
    var url = SITE + encodeURIComponent("놀이터_staging.html");
    var o = {
      title: "실거래가 맞히기 " + hit + " / 5",
      desc: "국토교통부에 신고된 진짜 거래 다섯 건입니다. 당신은 몇 개나 맞히시겠어요?",
      image: SITE + "assets/og_quiz.png",
      url: url,
      btn: "나도 해보기",
      text: "실거래가 맞히기 다섯 문제 중 " + hit + "개를 맞혔습니다.\n당신도 해보세요.\n" + url
    };
    btn.disabled = true;
    SBShare.any(o).then(function(how){
      btn.disabled = false;
      if(how === "clipboard") alert("결과를 복사했습니다. 붙여넣어 공유해 보세요.");
      else if(!how) alert("공유를 지원하지 않는 환경입니다. 주소를 복사해 보내 주세요.");
    });
  });

  try{
    var b = localStorage.getItem("sb_quiz_hit");
    if(b !== null) $("bestIntro").textContent = "내 최고 기록 "+b+"개";
  }catch(e){}

  function footText(){
    return "원자료 국토교통부 실거래가 공개시스템 · 아파트 매매 신고분 (자료 기준일 "+(D.updated||"")+")<br>"+
      "취소된 거래와 직거래는 문제에서 제외했습니다. 면적은 전용면적, 단가는 평당(전용) 기준입니다.<br>"+
      "실제 시세는 층·향·수리 상태에 따라 달라집니다. 참고용입니다.";
  }
  $("foot").innerHTML = footText();
})();
</script>
