<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>[시안] 놀이터 · 석봉 부동산 정보방</title>
<meta property="og:title" content="이 집, 얼마일까요?">
<meta property="og:description" content="실거래가 맞히기. 5문제로 내 시세 감각을 확인해 보세요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="석봉 부동산 정보방">
<style>
:root{
  --navy:#12264A; --navy2:#1B3F7A; --gray:#5A6478; --gray2:#7A8698;
  --red:#B23A48; --green:#1E7A5A; --tint:#EEF3FB; --hair:#E3E8F0; --bar:#C6D3E6;
  --paper:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--tint); color:var(--navy);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding:0 0 40px;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* 머리 */
header{background:var(--navy);color:#fff;padding:14px 0 13px;margin-bottom:18px}
header .wrap{display:flex;align-items:center;gap:8px}
header b{font-size:15px;letter-spacing:-.2px}
.badge{font-size:11px;background:rgba(255,255,255,.18);padding:2px 7px;border-radius:10px;letter-spacing:.3px}
header a{color:#fff;text-decoration:none}

/* 카드 공통 */
.card{background:var(--paper);border:1px solid var(--hair);border-radius:14px;padding:20px 18px;margin-bottom:14px}

/* 진행 */
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.top h1{font-size:19px;margin:0;letter-spacing:-.4px}
.step{font-size:13px;color:var(--gray2);font-variant-numeric:tabular-nums}
.pbar{height:4px;background:var(--hair);border-radius:2px;overflow:hidden;margin-bottom:16px}
.pbar i{display:block;height:100%;background:var(--navy2);transition:width .3s}

/* 문제 */
.q .loc{font-size:13px;color:var(--gray);margin-bottom:3px}
.q .apt{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.3;margin-bottom:12px}
.spec{display:flex;flex-wrap:wrap;gap:6px}
.spec span{background:var(--tint);color:var(--navy2);font-size:13px;padding:5px 10px;border-radius:8px;white-space:nowrap}

/* 슬라이더 */
.pick{margin-top:22px}
.val{text-align:center;font-size:28px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums;margin-bottom:2px}
.valsub{text-align:center;font-size:12px;color:var(--gray2);margin-bottom:14px}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--bar);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--navy2);border:3px solid #fff;box-shadow:0 1px 5px rgba(18,38,74,.35);margin-top:-12px}
input[type=range]::-moz-range-track{height:6px;background:var(--bar);border-radius:3px}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--navy2);border:3px solid #fff}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--gray2);margin-top:7px}

/* 버튼 */
.btn{display:block;width:100%;border:0;border-radius:11px;padding:15px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:-.2px}
.btn.p{background:var(--navy);color:#fff}
.btn.l{background:#fff;color:var(--navy2);border:1.5px solid var(--bar)}
.btn+.btn{margin-top:9px}

/* 정답 */
.ansbox{text-align:center;padding:4px 0 2px}
.ansbox .lab{font-size:12px;color:var(--gray2);letter-spacing:.3px}
.ansbox .big{font-size:30px;font-weight:700;letter-spacing:-.8px;margin:3px 0 8px;font-variant-numeric:tabular-nums}
.grade{display:inline-block;font-size:14px;font-weight:700;padding:6px 14px;border-radius:20px}
.diff{font-size:13px;color:var(--gray);margin-top:8px}

/* 해설 */
.exp{background:var(--tint);border-radius:11px;padding:14px 15px;margin-top:16px}
.exp h3{margin:0 0 9px;font-size:13px;color:var(--navy2);letter-spacing:-.2px}
.exp dl{margin:0;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:5px 12px;font-size:14px}
.exp dt{color:var(--gray);white-space:nowrap}
.exp dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.exp .go{display:block;margin-top:12px;text-align:center;background:#fff;border:1.5px solid var(--bar);
  border-radius:9px;padding:11px;color:var(--navy2);text-decoration:none;font-weight:700;font-size:14px}

/* 결과 */
.res{text-align:center}
.res .ttl{font-size:14px;color:var(--gray2)}
.res .score{font-size:44px;font-weight:700;letter-spacing:-1.5px;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.list{margin-top:18px;border-top:1px solid var(--hair)}
.list div{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 2px;border-bottom:1px solid var(--hair);font-size:14px}
.list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gray)}
.list .er{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.best{font-size:13px;color:var(--gray2);margin-top:12px}

.foot{font-size:11px;color:var(--gray2);line-height:1.7;padding:6px 2px 0}
.hide{display:none}
</style>
</head>
<body>

<header><div class="wrap">
  <a href="index.html"><b>석봉 부동산 정보방</b></a>
  <span class="badge">시안</span>
</div></header>

<div class="wrap">

  <!-- 시작 -->
  <section id="intro" class="card">
    <div class="top"><h1>이 집, 얼마일까요?</h1></div>
    <p style="margin:0 0 4px;color:var(--gray);font-size:15px">
      실제로 거래된 아파트 다섯 곳을 보여드립니다.<br>얼마에 팔렸을지 맞혀 보세요.
    </p>
    <p style="margin:14px 0 18px;font-size:13px;color:var(--gray2)">
      국토교통부에 신고된 진짜 거래입니다. 정답을 맞히면 그 단지의 최근 시세도 같이 보여드립니다.
    </p>
    <button class="btn p" id="start">시작하기</button>
    <div class="best" id="bestIntro"></div>
  </section>

  <!-- 문제 -->
  <section id="play" class="hide">
    <div class="card">
      <div class="top">
        <h1>이 집, 얼마일까요?</h1>
        <span class="step"><b id="cur">1</b> / <span id="tot">5</span></span>
      </div>
      <div class="pbar"><i id="pb" style="width:0"></i></div>

      <div class="q">
        <div class="loc" id="loc"></div>
        <div class="apt" id="apt"></div>
        <div class="spec" id="spec"></div>
      </div>

      <div class="pick" id="pick">
        <div class="val" id="val"></div>
        <div class="valsub">내 답</div>
        <input type="range" id="rng">
        <div class="ends"><span id="lo"></span><span id="hi"></span></div>
      </div>
    </div>

    <div id="beforeAns"><button class="btn p" id="submit">정답 보기</button></div>

    <!-- 정답 -->
    <div id="afterAns" class="hide">
      <div class="card">
        <div class="ansbox">
          <div class="lab">실제 거래가</div>
          <div class="big" id="ansBig"></div>
          <span class="grade" id="grade"></span>
          <div class="diff" id="diff"></div>
        </div>
        <div class="exp">
          <h3 id="expTtl"></h3>
          <dl id="expDl"></dl>
          <a class="go" id="goMap" href="#" target="_blank" rel="noopener">이 단지 지도에서 보기</a>
        </div>
      </div>
      <button class="btn p" id="next">다음 문제</button>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" class="hide">
    <div class="card res">
      <div class="ttl">다섯 문제 평균 오차</div>
      <div class="score" id="avg"></div>
      <span class="grade" id="finalGrade"></span>
      <div class="list" id="list"></div>
      <div class="best" id="bestRes"></div>
    </div>
    <button class="btn p" id="share">결과 공유하기</button>
    <button class="btn l" id="again">다시 하기</button>
    <a class="btn l" href="map.html" style="text-align:center;text-decoration:none;line-height:1.4;display:block;margin-top:9px">
      전국 실거래가 지도에서 보기
    </a>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script src="data/quiz_price.js?v=2"></script>
<script>
(function(){
  "use strict";
  var D = window.QUIZ_PRICE || {items:[]};
  var POOL = D.items || [];
  var N = 5;                     // 한 세트 문제 수 (2026-08-30 석봉님 확정)
  var set = [], idx = 0, log = [];

  var $ = function(id){ return document.getElementById(id); };

  /* 만원 단위를 사람이 읽는 말로. 35300 → 3억 5,300만원 */
  function money(man){
    var eok = Math.floor(man/10000), rest = man%10000;
    if(eok && rest) return eok+"억 "+rest.toLocaleString()+"만원";
    if(eok) return eok+"억원";
    return man.toLocaleString()+"만원";
  }
  function pick(n){
    var a = POOL.slice(), out = [];
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    for(var k=0;k<n && k<a.length;k++) out.push(a[k]);
    return out;
  }
  /* 오차율에 따른 등급. 색은 브랜드 팔레트만 쓴다 */
  function grade(err){
    if(err<=3)  return {t:"신의 눈",   bg:"#1E7A5A", fg:"#fff"};
    if(err<=7)  return {t:"고수",      bg:"#1B3F7A", fg:"#fff"};
    if(err<=15) return {t:"감이 좋네요", bg:"#EEF3FB", fg:"#1B3F7A"};
    if(err<=30) return {t:"아쉽네요",   bg:"#EEF3FB", fg:"#5A6478"};
    return {t:"다시 도전", bg:"#EEF3FB", fg:"#B23A48"};
  }

  function show(which){
    ["intro","play","result"].forEach(function(k){
      $(k).classList.toggle("hide", k!==which);
    });
    window.scrollTo(0,0);
  }

  function render(){
    var q = set[idx];
    $("cur").textContent = idx+1;
    $("tot").textContent = set.length;
    $("pb").style.width = (idx/set.length*100)+"%";
    $("loc").textContent = q.sgg+" "+q.dong;
    $("apt").textContent = q.apt;
    $("spec").innerHTML =
      "<span>전용 "+q.m2+"㎡ ("+q.py+"평)</span>"+
      "<span>"+q.fl+"층</span>"+
      "<span>"+q.yr+"년 준공</span>"+
      "<span>"+q.ym.split("-")[0]+"년 "+(+q.ym.split("-")[1])+"월 계약</span>";

    var r = $("rng");
    r.min = q.lo; r.max = q.hi; r.step = q.st;
    r.value = Math.round(((+q.lo + +q.hi)/2)/q.st)*q.st;
    $("lo").textContent = money(q.lo);
    $("hi").textContent = money(q.hi);
    $("val").textContent = money(+r.value);

    $("beforeAns").classList.remove("hide");
    $("afterAns").classList.add("hide");
    $("pick").style.opacity = 1;
    r.disabled = false;
  }

  $("rng").addEventListener("input", function(){
    $("val").textContent = money(+this.value);
  });

  function submit(){
    var q = set[idx], my = +$("rng").value;
    var err = Math.abs(my - q.ans) / q.ans * 100;
    var g = grade(err);
    log.push({q:q, my:my, err:err});

    $("rng").disabled = true;
    $("pick").style.opacity = .55;
    $("ansBig").textContent = money(q.ans);
    var gd = $("grade");
    gd.textContent = g.t; gd.style.background = g.bg; gd.style.color = g.fg;
    $("diff").textContent =
      "내 답 "+money(my)+" · 오차 "+err.toFixed(1)+"%";

    $("expTtl").textContent = "이 단지는 (전용 "+q.m2+"㎡ 기준)";
    $("expDl").innerHTML =
      "<dt>최근 거래</dt><dd>"+q.n+"건</dd>"+
      "<dt>중위 가격</dt><dd>"+money(q.med)+"</dd>"+
      "<dt>평당가(전용)</dt><dd>"+q.ppy.toLocaleString()+"만원</dd>";
    $("goMap").href = "map.html?q="+encodeURIComponent(q.q);

    $("beforeAns").classList.add("hide");
    $("afterAns").classList.remove("hide");
    $("pb").style.width = ((idx+1)/set.length*100)+"%";
    $("afterAns").scrollIntoView({behavior:"smooth", block:"nearest"});
  }

  function finish(){
    var sum = 0;
    log.forEach(function(x){ sum += x.err; });
    var avg = sum/log.length;
    var g = grade(avg);
    $("avg").textContent = avg.toFixed(1)+"%";
    var fg = $("finalGrade");
    fg.textContent = g.t; fg.style.background = g.bg; fg.style.color = g.fg;
    $("list").innerHTML = log.map(function(x){
      var c = x.err<=7 ? "var(--green)" : (x.err<=15 ? "var(--navy2)" : "var(--red)");
      return "<div><span class='nm'>"+x.q.apt+"</span>"+
             "<span class='er' style='color:"+c+"'>"+x.err.toFixed(1)+"%</span></div>";
    }).join("");

    /* 최고 기록은 이 브라우저에만 남는다. 서버로 보내지 않는다 */
    var best = null;
    try{
      var raw = localStorage.getItem("sb_quiz_best");
      best = raw ? parseFloat(raw) : null;
      if(best===null || avg < best){ localStorage.setItem("sb_quiz_best", avg.toFixed(1)); best = avg; }
    }catch(e){}
    $("bestRes").textContent = best!==null ? ("내 최고 기록 평균 오차 "+(+best).toFixed(1)+"%") : "";
    show("result");
  }

  $("start").addEventListener("click", function(){
    if(!POOL.length){ alert("문제를 불러오지 못했습니다."); return; }
    set = pick(N); idx = 0; log = [];
    render(); show("play");
  });
  $("submit").addEventListener("click", submit);
  $("next").addEventListener("click", function(){
    idx++;
    if(idx >= set.length) finish(); else render();
  });
  $("again").addEventListener("click", function(){
    set = pick(N); idx = 0; log = [];
    render(); show("play");
  });
  $("share").addEventListener("click", function(){
    var sum = 0; log.forEach(function(x){ sum += x.err; });
    var txt = "실거래가 맞히기 평균 오차 "+(sum/log.length).toFixed(1)+"%가 나왔습니다.\n"+
              "당신도 해보세요.\n"+location.href;
    if(navigator.share){ navigator.share({text:txt}).catch(function(){}); }
    else if(navigator.clipboard){
      navigator.clipboard.writeText(txt).then(function(){ alert("결과를 복사했습니다. 붙여넣어 공유해 보세요."); });
    }
  });

  try{
    var b = localStorage.getItem("sb_quiz_best");
    if(b) $("bestIntro").textContent = "내 최고 기록 평균 오차 "+(+b).toFixed(1)+"%";
  }catch(e){}

  $("foot").innerHTML =
    "원자료 국토교통부 실거래가 공개시스템 · 아파트 매매 신고분 "+
    "(자료 기준일 "+(D.updated||"")+")<br>"+
    "취소된 거래와 직거래는 문제에서 제외했습니다. 면적은 전용면적, 단가는 평당(전용) 기준입니다.<br>"+
    "실제 시세는 층·향·수리 상태에 따라 달라집니다. 참고용입니다.";
})();
</script>
</body>
</html>
