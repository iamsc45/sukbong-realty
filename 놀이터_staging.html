<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>[시안] 놀이터 · 석봉 부동산 정보방</title>
<meta property="og:title" content="이 집, 얼마일까요?">
<meta property="og:description" content="실거래가 맞히기. 다섯 문제로 내 시세 감각을 확인해 보세요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="석봉 부동산 정보방">
<style>
:root{
  --navy:#12264A; --navy2:#1B3F7A; --gray:#5A6478; --gray2:#7A8698;
  --red:#B23A48; --green:#1E7A5A; --tint:#EEF3FB; --hair:#E3E8F0; --bar:#C6D3E6;
  --paper:#fff; --gold:#A8802C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:linear-gradient(180deg,#E7EEF9 0%,var(--tint) 240px,var(--tint) 100%);
  color:var(--navy); min-height:100vh;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding:0 0 48px;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

header{background:var(--navy);color:#fff;padding:14px 0 13px}
header .wrap{display:flex;align-items:center;gap:8px}
header b{font-size:15px;letter-spacing:-.2px}
header a{color:#fff;text-decoration:none}
.badge{font-size:11px;background:rgba(255,255,255,.18);padding:2px 7px;border-radius:10px;letter-spacing:.3px}

.card{background:var(--paper);border:1px solid var(--hair);border-radius:16px;padding:20px 18px;
  margin-bottom:14px;box-shadow:0 1px 3px rgba(18,38,74,.05)}

/* ── 시작 화면 ── */
.hero{text-align:center;padding:30px 18px 26px}
.hero .eyebrow{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:700}
.hero h1{font-size:27px;margin:9px 0 12px;letter-spacing:-.9px;line-height:1.25}
.hero p{margin:0 0 6px;color:var(--gray);font-size:15px}
.hero .sub{font-size:13px;color:var(--gray2);margin-top:12px;line-height:1.7}
.rulebox{display:flex;gap:8px;margin:20px 0 22px}
.rulebox div{flex:1 1 0;min-width:0;background:var(--tint);border-radius:11px;padding:12px 6px}
.rulebox b{display:block;font-size:19px;letter-spacing:-.5px;color:var(--navy2)}
.rulebox span{font-size:11px;color:var(--gray)}

/* ── 진행 점 ── */
.dots{display:flex;justify-content:center;gap:7px;margin:0 0 16px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--bar);transition:all .35s}
.dots i.on{background:var(--navy2);transform:scale(1.45)}
.dots i.done{background:var(--navy2)}

/* ── 문제 ── */
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:15px}
.qhead h2{font-size:17px;margin:0;letter-spacing:-.4px}
.qno{font-size:12px;color:var(--gray2);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.q{animation:slide .32s ease both}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.q .loc{font-size:13px;color:var(--gray);margin-bottom:3px}
.q .apt{font-size:21px;font-weight:700;letter-spacing:-.5px;line-height:1.3;margin-bottom:13px;word-break:keep-all}
.spec{display:flex;flex-wrap:wrap;gap:6px}
.spec span{background:var(--tint);color:var(--navy2);font-size:13px;padding:5px 10px;border-radius:8px;white-space:nowrap}

.pick{margin-top:24px}
.val{text-align:center;font-size:31px;font-weight:700;letter-spacing:-1px;
  font-variant-numeric:tabular-nums;line-height:1.2;transition:transform .12s}
.val.bump{transform:scale(1.045)}
.valsub{text-align:center;font-size:12px;color:var(--gray2);margin:2px 0 16px}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--bar);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;
  background:var(--navy2);border:3px solid #fff;box-shadow:0 2px 7px rgba(18,38,74,.4);margin-top:-13px}
input[type=range]::-moz-range-track{height:6px;background:var(--bar);border-radius:3px}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--navy2);border:3px solid #fff}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--gray2);margin-top:8px}

/* 내가 찍은 답 미니 기록 */
.trail{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;min-height:26px}
.trail span{font-size:11px;background:#fff;border:1px solid var(--hair);color:var(--gray);
  padding:3px 8px;border-radius:14px;animation:pop .3s ease both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:-.2px;transition:transform .1s}
.btn:active{transform:scale(.985)}
.btn.p{background:var(--navy);color:#fff}
.btn.g{background:var(--gold);color:#fff}
.btn.l{background:#fff;color:var(--navy2);border:1.5px solid var(--bar)}
.btn+.btn{margin-top:9px}

/* ── 채점 대기 ── */
.reveal{text-align:center;padding:34px 18px}
.reveal h2{font-size:21px;margin:0 0 8px;letter-spacing:-.6px}
.reveal p{color:var(--gray);font-size:14px;margin:0 0 22px}

/* ── 결과 ── */
.score{text-align:center;padding:6px 0 2px}
.score .lab{font-size:12px;color:var(--gray2);letter-spacing:.5px}
.score .big{font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1.1;margin:2px 0 6px;
  font-variant-numeric:tabular-nums}
.score .big small{font-size:22px;color:var(--gray2);font-weight:600;letter-spacing:-.5px}
.grade{display:inline-block;font-size:14px;font-weight:700;padding:7px 16px;border-radius:20px}
.score .avg{font-size:13px;color:var(--gray);margin-top:10px}

.item{border:1px solid var(--hair);border-radius:13px;padding:14px 15px;margin-top:10px;
  background:#fff;animation:slide .4s ease both;cursor:pointer}
.item.ok{border-color:#BFE0D2;background:#F4FBF8}
.item .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.3px}
.mark{flex:0 0 auto;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#fff}
.mark.o{background:var(--green)} .mark.x{background:var(--bar);color:var(--gray)}
.item .r2{display:flex;justify-content:space-between;font-size:13px;margin-top:9px;
  font-variant-numeric:tabular-nums;gap:8px}
.item .r2 b{font-size:15px;letter-spacing:-.3px}
.item .mine{color:var(--gray)}
.item .er{font-size:12px;margin-top:6px;color:var(--gray2)}
.det{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--hair)}
.det.open{display:block;animation:slide .28s ease both}
.det dl{margin:0;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:5px 12px;font-size:13px}
.det dt{color:var(--gray);white-space:nowrap}
.det dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.det .go{display:block;margin-top:11px;text-align:center;background:var(--tint);border-radius:9px;
  padding:10px;color:var(--navy2);text-decoration:none;font-weight:700;font-size:13px}
.tapme{font-size:11px;color:var(--gray2);text-align:center;margin-top:12px}

.best{font-size:13px;color:var(--gray2);text-align:center;margin-top:14px}
.foot{font-size:11px;color:var(--gray2);line-height:1.7;padding:8px 2px 0}
.hide{display:none}
</style>
</head>
<body>

<header><div class="wrap">
  <a href="index.html"><b>석봉 부동산 정보방</b></a>
  <span class="badge">시안</span>
</div></header>

<div class="wrap">

  <!-- 시작 -->
  <section id="intro">
    <div class="card hero">
      <div class="eyebrow">실거래가 맞히기</div>
      <h1>이 집, 얼마일까요?</h1>
      <p>국토교통부에 신고된 진짜 거래 다섯 건입니다.</p>
      <div class="rulebox">
        <div><b>5</b><span>문제</span></div>
        <div><b>10%</b><span>안에 들면 정답</span></div>
        <div><b>3분</b><span>이면 끝납니다</span></div>
      </div>
      <button class="btn p" id="start">시작하기</button>
      <div class="sub">정답은 다섯 문제를 다 푼 뒤에 한꺼번에 공개됩니다.</div>
      <div class="best" id="bestIntro"></div>
    </div>
  </section>

  <!-- 문제 -->
  <section id="play" class="hide">
    <div class="card">
      <div class="dots" id="dots"></div>
      <div class="qhead">
        <h2>얼마에 팔렸을까요?</h2>
        <span class="qno"><b id="cur">1</b> / <span id="tot">5</span></span>
      </div>
      <div class="q" id="qbox">
        <div class="loc" id="loc"></div>
        <div class="apt" id="apt"></div>
        <div class="spec" id="spec"></div>
      </div>
      <div class="pick">
        <div class="val" id="val"></div>
        <div class="valsub">내가 생각한 가격</div>
        <input type="range" id="rng">
        <div class="ends"><span id="lo"></span><span id="hi"></span></div>
      </div>
    </div>
    <button class="btn p" id="submit">이 가격으로 확정</button>
    <div class="trail" id="trail"></div>
  </section>

  <!-- 채점 대기 -->
  <section id="wait" class="hide">
    <div class="card reveal">
      <h2>다섯 문제를 다 푸셨습니다</h2>
      <p>이제 실제 거래가와 맞춰 보겠습니다.</p>
      <button class="btn g" id="reveal">결과 확인하기</button>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" class="hide">
    <div class="card">
      <div class="score">
        <div class="lab">다섯 문제 중</div>
        <div class="big"><span id="hit">0</span><small> 개 정답</small></div>
        <span class="grade" id="finalGrade"></span>
        <div class="avg" id="avgLine"></div>
      </div>
    </div>
    <div id="list"></div>
    <div class="tapme">항목을 누르면 그 단지의 최근 시세가 나옵니다</div>
    <div class="best" id="bestRes"></div>
    <div style="margin-top:16px">
      <button class="btn p" id="share">결과 공유하기</button>
      <button class="btn l" id="again">다시 하기</button>
      <a class="btn l" href="map.html" style="text-align:center;text-decoration:none;display:block;margin-top:9px">
        전국 실거래가 지도에서 보기
      </a>
    </div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script src="data/quiz_price.js?v=3"></script>
<script>
(function(){
  "use strict";
  var D = window.QUIZ_PRICE || {items:[]};
  var POOL = D.items || [];
  var N = 5;          // 한 세트 문제 수 (2026-08-30 석봉님 확정)
  var HIT = 10;       // 오차 10% 안에 들면 정답 (2026-08-30 석봉님 확정)
  var set = [], idx = 0, log = [];
  var $ = function(id){ return document.getElementById(id); };

  /* 만원 단위를 사람이 읽는 말로. 35300 → 3억 5,300만원 */
  function money(man){
    var eok = Math.floor(man/10000), rest = man%10000;
    if(eok && rest) return eok+"억 "+rest.toLocaleString()+"만원";
    if(eok) return eok+"억원";
    return man.toLocaleString()+"만원";
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
    return a;
  }
  /* 맞힌 개수로 등급을 준다. 색은 브랜드 팔레트만 쓴다 */
  function grade(hit){
    if(hit===5) return {t:"신의 눈",     bg:"#1E7A5A", fg:"#fff"};
    if(hit===4) return {t:"고수",        bg:"#1B3F7A", fg:"#fff"};
    if(hit===3) return {t:"감이 좋네요",  bg:"#EEF3FB", fg:"#1B3F7A"};
    if(hit===2) return {t:"조금 아쉽네요", bg:"#EEF3FB", fg:"#5A6478"};
    return {t:"다시 도전", bg:"#EEF3FB", fg:"#B23A48"};
  }
  function show(which){
    ["intro","play","wait","result"].forEach(function(k){
      $(k).classList.toggle("hide", k!==which);
    });
    window.scrollTo(0,0);
  }
  function drawDots(){
    $("dots").innerHTML = set.map(function(_,i){
      return "<i class='"+(i<idx?"done":(i===idx?"on":""))+"'></i>";
    }).join("");
  }

  function render(){
    var q = set[idx];
    drawDots();
    $("cur").textContent = idx+1;
    $("tot").textContent = set.length;
    $("loc").textContent = q.sgg+" "+q.dong;
    $("apt").textContent = q.apt;
    $("spec").innerHTML =
      "<span>전용 "+q.m2+"㎡ ("+q.py+"평)</span>"+
      "<span>"+q.fl+"층</span>"+
      "<span>"+q.yr+"년 준공</span>"+
      "<span>"+q.ym.split("-")[0]+"년 "+(+q.ym.split("-")[1])+"월 계약</span>";

    var r = $("rng");
    r.min = q.lo; r.max = q.hi; r.step = q.st;
    r.value = Math.round(((+q.lo + +q.hi)/2)/q.st)*q.st;
    $("lo").textContent = money(q.lo);
    $("hi").textContent = money(q.hi);
    $("val").textContent = money(+r.value);

    /* 문제 카드가 새로 들어오는 느낌을 준다 */
    var box = $("qbox");
    box.style.animation = "none"; void box.offsetWidth; box.style.animation = "";
  }

  $("rng").addEventListener("input", function(){
    $("val").textContent = money(+this.value);
    var v = $("val"); v.classList.add("bump");
    setTimeout(function(){ v.classList.remove("bump"); }, 120);
  });

  function submit(){
    var q = set[idx], my = +$("rng").value;
    log.push({q:q, my:my, err: Math.abs(my - q.ans)/q.ans*100});
    /* 내가 찍은 답을 아래에 쌓아 보여 준다. 정답은 아직 말하지 않는다 */
    var s = document.createElement("span");
    s.textContent = (idx+1)+"번 "+money(my);
    $("trail").appendChild(s);
    idx++;
    if(idx >= set.length){ setTimeout(function(){ show("wait"); }, 260); }
    else { render(); window.scrollTo({top:0, behavior:"smooth"}); }
  }
  $("submit").addEventListener("click", submit);

  /* 숫자가 올라가는 효과. 정답 공개의 재미는 여기서 난다 */
  function countUp(el, to){
    var t0 = null, dur = 620;
    function step(ts){
      if(!t0) t0 = ts;
      var p = Math.min((ts-t0)/dur, 1);
      var e = 1 - Math.pow(1-p, 3);
      el.textContent = money(Math.round(to*e/100)*100);
      if(p < 1) requestAnimationFrame(step); else el.textContent = money(to);
    }
    requestAnimationFrame(step);
  }

  function renderResult(){
    var hit = 0, sum = 0;
    log.forEach(function(x){ sum += x.err; if(x.err <= HIT) hit++; });
    var avg = sum/log.length, g = grade(hit);

    /* 🔴 화면을 먼저 켜고 나서 항목을 붙인다.
       display:none 인 채로 append 하면 CSS 애니메이션이 시작되지 않고,
       animation-fill-mode:both 탓에 opacity 0 에 그대로 멈춘다.
       2026-08-30 라이브에서 실제로 났다 — DOM 에는 5개가 있는데 화면은 비어 있었다. */
    show("result");

    var h = $("hit"); h.textContent = "0";
    var n = 0, tick = setInterval(function(){
      n++; h.textContent = n;
      if(n >= hit) clearInterval(tick);
    }, 170);
    if(hit === 0) h.textContent = "0";

    var fg = $("finalGrade");
    fg.textContent = g.t; fg.style.background = g.bg; fg.style.color = g.fg;
    $("avgLine").textContent = "평균 오차 "+avg.toFixed(1)+"%";

    $("list").innerHTML = "";
    log.forEach(function(x, i){
      var ok = x.err <= HIT;
      var near = !ok && x.err <= 15;
      var d = document.createElement("div");
      d.className = "item"+(ok ? " ok" : "");
      d.style.animationDelay = (0.12*i + 0.25)+"s";
      d.innerHTML =
        "<div class='r1'><span class='nm'>"+x.q.apt+"</span>"+
          "<span class='mark "+(ok?"o":"x")+"'>"+(ok?"○":"✕")+"</span></div>"+
        "<div class='r2'><span class='mine'>내 답 "+money(x.my)+"</span>"+
          "<b class='ansv'>"+money(x.q.ans)+"</b></div>"+
        "<div class='er'>"+x.q.sgg+" · 오차 "+x.err.toFixed(1)+"%"+
          (ok ? " · 정답입니다" : (near ? " · 아깝습니다" : ""))+"</div>"+
        "<div class='det'><dl>"+
          "<dt>최근 거래</dt><dd>"+x.q.n+"건</dd>"+
          "<dt>중위 가격</dt><dd>"+money(x.q.med)+"</dd>"+
          "<dt>평당가(전용)</dt><dd>"+x.q.ppy.toLocaleString()+"만원</dd>"+
          "</dl><a class='go' href='map.html?q="+encodeURIComponent(x.q.q)+
          "' target='_blank' rel='noopener'>이 단지 지도에서 보기</a></div>";
      d.addEventListener("click", function(e){
        if(e.target.closest("a")) return;
        d.querySelector(".det").classList.toggle("open");
      });
      $("list").appendChild(d);
      /* 실제 거래가만 카운트업으로 올린다 */
      setTimeout(function(){ countUp(d.querySelector(".ansv"), x.q.ans); }, 120*i + 300);
    });

    /* 최고 기록은 이 브라우저에만 남는다. 서버로 보내지 않는다 */
    var prev = null;
    try{
      var raw = localStorage.getItem("sb_quiz_hit");
      prev = raw === null ? null : parseInt(raw, 10);
      if(prev === null || hit > prev){ localStorage.setItem("sb_quiz_hit", String(hit)); }
    }catch(e){}
    $("bestRes").textContent =
      (prev !== null && hit > prev) ? "최고 기록을 새로 세웠습니다 (지난 최고 "+prev+"개)"
      : (prev !== null ? "내 최고 기록 "+Math.max(prev,hit)+"개" : "");
  }
  $("reveal").addEventListener("click", renderResult);

  function begin(){
    set = shuffle(POOL.slice()).slice(0, N);
    idx = 0; log = []; $("trail").innerHTML = "";
    render(); show("play");
  }
  $("start").addEventListener("click", function(){
    if(!POOL.length){ alert("문제를 불러오지 못했습니다."); return; }
    begin();
  });
  $("again").addEventListener("click", begin);

  $("share").addEventListener("click", function(){
    var hit = log.filter(function(x){ return x.err <= HIT; }).length;
    var txt = "실거래가 맞히기 다섯 문제 중 "+hit+"개를 맞혔습니다.\n당신도 해보세요.\n"+location.href;
    if(navigator.share){ navigator.share({text:txt}).catch(function(){}); }
    else if(navigator.clipboard){
      navigator.clipboard.writeText(txt).then(function(){ alert("결과를 복사했습니다. 붙여넣어 공유해 보세요."); });
    }
  });

  try{
    var b = localStorage.getItem("sb_quiz_hit");
    if(b !== null) $("bestIntro").textContent = "내 최고 기록 "+b+"개";
  }catch(e){}

  $("foot").innerHTML =
    "원자료 국토교통부 실거래가 공개시스템 · 아파트 매매 신고분 (자료 기준일 "+(D.updated||"")+")<br>"+
