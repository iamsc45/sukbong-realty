function boot(){
  var code=qs('code'),nm=qs('nm'),dong=qs('dong');
  if(!code||!nm){fail();return;}
  var s=document.createElement('script');s.src='data/detail_'+code+'.js';
  s.onload=function(){
    var a=document.createElement('script');a.src='data/apt_info_'+code+'.js';
    a.onload=a.onerror=function(){
      var k=document.createElement('script');k.src='data/apt_asking_'+code+'.js';
      k.onload=k.onerror=function(){
        var al=document.createElement('script');al.src='data/alias_'+code+'.js';
        al.onload=al.onerror=function(){
          var fe=document.createElement('script');fe.src='data/apt_fee_'+code+'.js';
          fe.onload=fe.onerror=function(){go(code,nm,dong);};document.body.appendChild(fe);
        };document.body.appendChild(al);
      };document.body.appendChild(k);
    };
    document.body.appendChild(a);
  };
  s.onerror=fail;document.body.appendChild(s);
}
function fail(){document.getElementById('nm').textContent='단지 정보를 찾지 못했습니다';document.getElementById('body').innerHTML='<p style="color:#8a8071">지도 카드에서 단지를 눌러 다시 열어주세요.</p>';}
function go(code,nm,dong){
  var arr=(window.SB&&SB.d&&SB.d[code])||[];
  var pt=null;
  for(var i=0;i<arr.length;i++){if(arr[i].name===nm&&(!dong||arr[i].dong===dong)){pt=arr[i];break;}}
  if(!pt){for(i=0;i<arr.length;i++){if(arr[i].name===nm){pt=arr[i];break;}}}
  if(!pt){fail();return;}
  render(pt,code);
}
function band(a){return a<=60?'60㎡(18.1평) 이하':a<=85?'60~85㎡(18.1~25.7평)':a<=110?'85~110㎡(25.7~33.3평)':'110㎡(33.3평) 초과';}
/* 단지정보 키 매칭: 표기 차이(아파트 접미·공백·괄호) 흡수 (2026-07-27) */
function nkey(n){return String(n||'').replace(/[\s\-_()·]/g,'').replace(/(아파트|APT|apt)$/,'');}
var _CURDONG='';
function aliasOf(code,name,f){var B=(window.APTALIAS&&window.APTALIAS[code])||null;if(!B)return null;var A=B[name+'|'+(_CURDONG||'')]||B[name]||null;return A?A[f]:null;}
function findInfo(code,name){
  var box=(window.APTINFO&&window.APTINFO[code])||null; if(!box)return null;
  var ak=aliasOf(code,name,'i');            /* 빌드 시 정합된 별칭 우선 */
  if(ak&&box[ak]&&box[ak].se)return box[ak];
  if(box[name]&&box[name].se)return box[name];   /* 빈 껍데기는 무시 */
  var t=nkey(name);
  for(var k in box){if(nkey(k)===t&&box[k]&&box[k].se)return box[k];}
  return null;
}
function findAsk(code,name){
  var box=(window.APTASK&&window.APTASK[code])||null; if(!box)return null;
  var ak=aliasOf(code,name,'a');
  return (ak&&box[ak])||box[name]||null;
}
function findFee(code,name){
  var box=(window.APTFEE&&window.APTFEE[code])||null; if(!box)return null;
  var ak=aliasOf(code,name,'i');
  return (ak&&box[ak])||box[name]||null;
}
function won(v){return v?Number(v).toLocaleString()+'원':'·';}
/* 관리비 섹션 — 세대당(메인) · 평당 전용(사이트 단가 기준 통일) · ㎡당 부과면적(공식 대조용) */
function feeSec(fee,myArea){
  if(!fee||!fee.tot||(!fee.perSe&&!fee.perPy))return '';
  var ym=(fee.ym||'').replace(/^(\d{4})(\d{2})$/,'$1.$2');
  var mine=(myArea&&fee.privArea&&fee.se)?Math.round(fee.tot*(myArea/fee.privArea)):0;
  function box(n,l,s){return '<div class="fee-b"><div class="n">'+n+'</div><div class="l">'+l+'</div>'
    +(s?'<div class="s">'+s+'</div>':'')+'</div>';}
  var tops=(fee.top||[]).map(function(x){
    return '<div class="lrow"><span>'+x[0]+'</span><span class="lv">'+won(Math.round(x[1]/(fee.se||1)))+'</span></div>';}).join('');
  return '<div class="sec"><div class="lab">관리비 · 공공 DB ('+ym+' 기준)</div>'
    +'<div class="fee">'
    + box(fee.perSe?comma(fee.perSe)+'<small>원</small>':'·','세대당 월 평균')
    + box(fee.perPy?comma(fee.perPy)+'<small>원</small>':'·','평당 월(전용 기준)')
    + box(mine?comma(mine)+'<small>원</small>':'·', myArea?('전용 '+myArea.toFixed(1)+'㎡('+PY(myArea)+') 기준 추정'):'평형별 추정')
    +'</div>'
    +'<div class="grid2" style="margin-top:10px"><div>'
    +'<div class="lrow"><span>공용관리비</span><span class="lv">'+won(Math.round(fee.cmn/(fee.se||1)))+'</span></div>'
    +'<div class="lrow"><span>개별사용료(난방·전기·수도 등)</span><span class="lv">'+won(Math.round(fee.ind/(fee.se||1)))+'</span></div>'
    +'<div class="lrow"><span>장기수선충당금</span><span class="lv">'+won(Math.round(fee.ltsn/(fee.se||1)))+'</span></div>'
    +'</div><div>'+(tops?'<div class="lrow" style="border:0;color:#8a8071;font-size:11.5px">비중 큰 항목(세대당)</div>'+tops:'')+'</div></div>'
    +'<div class="note">세대당 금액은 단지 전체 월 관리비를 세대수로 나눈 평균입니다. 평형과 사용량에 따라 실제 고지서와 차이가 납니다. '
    +'단가는 <b>전용면적 기준</b>'+(fee.perPy?(', 전용 ㎡당 '+comma(Math.round(fee.perPy/3.305785))+'원'):'')+'입니다.'
    +(fee.perM2?(' 공용부까지 포함한 관리비부과면적으로 나누면 ㎡당 '+comma(fee.perM2)+'원이 됩니다.'):'')
    +' 공용관리비와 개별사용료(난방·전기·수도), 장기수선충당금을 모두 합친 금액입니다.</div></div>';
}
function render(pt,code){
  _CURDONG=pt.dong||'';
  document.title=pt.name+' · 단지 상세';
  var txs=pt.txs||[];
  var info=findInfo(code,pt.name);
  var mm=txs.filter(function(t){return t.u==='매매';}),
      je=txs.filter(function(t){return t.u==='전세';}),
      wo=txs.filter(function(t){return t.u==='월세';});
  var mmpy=med(mm.filter(function(t){return t.a;}).map(function(t){return Math.round(t.p/t.a*3.305785);}));
  var mmamt=med(mm.map(function(t){return t.p;}));
  var jemed=med(je.map(function(t){return t.p;}));
  var jr=(mmamt&&jemed)?Math.round(jemed/mmamt*100):0;
  document.getElementById('kk').textContent='단지 상세 · '+esc(pt.dong||'');
  document.getElementById('nm').textContent=pt.name;
  /* 관심단지 등록 버튼 (회원 기능 · 카카오 원클릭 가입 유도) */
  (function(){
    var fid=code+'|'+pt.name;
    var item={id:fid,nm:pt.name,code:code,dong:pt.dong||'',lastN:(pt.txs||[]).length};
    var b=document.getElementById('favBtn');
    if(!b){b=document.createElement('button');b.id='favBtn';
      b.style.cssText='display:block;margin:10px 0 0;border:1.5px solid #b08434;border-radius:100px;padding:9px 20px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;background:#fff;color:#5c4300';
      document.querySelector('.mast').appendChild(b);}
    function paint(on){b.textContent=on?'★ 관심단지 등록됨 (목록 보기)':'☆ 관심단지 등록';
      b.style.background=on?'#ffd24d':'#fff';}
    function sync(){paint(window.SBAuth&&SBAuth.isIn()&&SBAuth.favHas(fid));}
    if(window.SBAuth){SBAuth.whenReady(sync);SBAuth.onChange(sync);}else{paint(false);}
    b.onclick=function(){
      if(!(window.SBAuth&&SBAuth.isIn())){if(window.SBAuth)SBAuth.gate(item,null);return;}
      if(SBAuth.favHas(fid)){
        if(confirm('관심단지 목록으로 이동할까요? (취소=등록 해제)')){location.href='favorites.html';return;}
        SBAuth.delFav(fid).then(function(ok){if(ok)paint(false);});return;
      }
      SBAuth.addFav(item).then(function(ok){if(ok)paint(true);});
      try{if(typeof gtag==='function')gtag('event','favorite_toggle',{item_name:pt.name,on:1});}catch(e){}
    };
  })();
  document.getElementById('loc').innerHTML=esc((pt.dong||'')+' '+(pt.jibun||''))+(info&&info.subway?' · <b style="color:var(--brass)">'+esc(info.subway)+'역</b>':'')+((info&&info.ymd)?' · '+info.ymd+'년 준공':(pt.extra?' · '+esc(pt.extra):''));
  var kp=[[mmpy?comma(mmpy)+'<small style="font-size:11px">만</small>':'·','매매 평당(전용)'],
    [eok(mmamt),'매매 중위 총액'],[eok(jemed),'전세 보증금 중위'],
    [jr?jr+'%':'·','전세가율'],
    [(info&&info.se)?comma(info.se):(mm.length+'건'),(info&&info.se)?'세대수':'매매 표본'],
    [(info&&info.ymd)?info.ymd:((je.length+wo.length)+'건'),(info&&info.ymd)?'준공':'전월세 표본']];
  /* 아래 3칸: 최고가·월세·거래활발도 (2026-07-28) */
  var mmTop=mm.length?Math.max.apply(null,mm.map(function(t){return t.p;})):0;
  var mmTopT=mm.filter(function(t){return t.p===mmTop;})[0];
  var woB=med(wo.map(function(t){return t.p;})),woW=med(wo.map(function(t){return t.r;}));
  var lastCd=txs.length?txs.map(function(t){return t.cd;}).sort().pop():'';
  kp.push([mmTop?eok(mmTop):'·','최고 매매가'+(mmTopT&&mmTopT.a?' · 전용 '+mmTopT.a.toFixed(1)+'㎡':'')]);
  kp.push([wo.length?(eok(woB)+'<small style="font-size:11px">/'+comma(woW)+'만</small>'):'·','월세 중위(보증금/월세)']);
  kp.push([txs.length?comma(txs.length)+'<small style="font-size:11px">건</small>':'·','최근 6개월 거래'+(lastCd?' · 최근 '+lastCd.slice(2).replace(/-/g,'.'):'')]);
  var h='<div class="top"><div id="map"></div><div class="kpis">'
    +kp.map(function(x){return '<div class="kpi"><div class="n">'+x[0]+'</div><div class="u">'+x[1]+'</div></div>';}).join('')+'</div></div>';
  var womed=med(wo.map(function(t){return t.p;})),womedw=med(wo.map(function(t){return t.r;}));
  var A=findAsk(code,pt.name);
  function arng(list){var a=list.filter(function(t){return t.a;}).map(function(t){return t.a;}).sort(function(x,y){return x-y;});
    if(!a.length)return '';var lo=a[0].toFixed(1),hi=a[a.length-1].toFixed(1);
    return '<small>전용 '+(lo===hi?lo+'㎡ · '+PY(a[0]):lo+'~'+hi+'㎡')+'</small>';}
  function cmpr(l,rv,hv,ar){return '<div class="cmpr"><b>'+l+(ar||'')+'</b><span>'+(rv||'·')+'</span><span class="ho">'+(hv||'·')+'</span></div>';}
  var mmR=mmamt?(eok(mmamt)+(mmpy?'<small>'+comma(mmpy)+'만/평</small>':'')):'';
  var mmH=(A&&A.mm)?(eok(A.mm.med)+(A.mm.py?'<small>'+comma(A.mm.py)+'만/평 · '+A.mm.n+'건</small>':'')):'';
  var jeR=jemed?eok(jemed):'',jeH=(A&&A.je)?(eok(A.je.med)+'<small>'+A.je.n+'건</small>'):'';
  var woR=wo.length?(eok(womed)+' / '+womedw+'만'):'',woH=(A&&A.wo)?(eok(A.wo.bo)+' / '+A.wo.wol+'만<small>'+A.wo.n+'건</small>'):'';
  h+='<div class="sec"><div class="lab">실거래 vs 호가 · 매매·전세·월세</div><div class="cmp">'
    +'<div class="cmph"><span></span><span>실거래<small>체결가·중위</small></span><span>호가<small>협상 전·중위</small></span></div>'
    +cmpr('매매',mmR,mmH,arng(mm))+cmpr('전세',jeR,jeH,arng(je))+cmpr('월세',woR,woH,arng(wo))+'</div>'
    +'<div class="note"><b>면적 기준</b>: 특정 평형이 아니라 <b>거래된 전 평형의 중위값</b>입니다(평형별은 아래 표 참고). 실거래 기준=최근 계약 '+(txs.length?txs.map(function(t){return t.cd;}).sort().pop().replace(/-/g,'.'):'-')+' (국토부 실거래·해제 제외) · 호가 기준=수집일 '+(window.APTASKDAY||'-')+' (네이버 매물·협상 전). 호가는 실제 체결가와 다를 수 있습니다.</div></div>';
  if(info){
    h+='<div class="sec"><div class="lab">단지 개요</div><div class="ov">'
      +frow(IC.home,'세대/동',(info.se?comma(info.se)+'세대':'')+(info.dongCnt?' · '+info.dongCnt+'동':''))
      +frow(IC.cal,'준공',info.ymd?info.ymd+'년':'')
      +frow(IC.build,'시공사',info.builder)
      +frow(IC.build,'시행사',info.dev)
      +frow(IC.home,'연면적',info.area?comma(info.area)+'㎡('+PY(info.area)+')':'')
      +frow(IC.heat,'난방',info.heat)
      +frow(IC.park,'지하주차',info.park?comma(info.park)+'대':'')
      +frow(IC.cctv,'CCTV',info.cctv?comma(info.cctv)+'대':'')
      +'</div></div>';
    var live=lrow(IC.subway,'교통',info.subway?esc(info.subway)+'역'+(info.subT?' · 도보 '+esc(info.subT):''):(info.busT?'버스 '+esc(info.busT):''))
      +lrow(IC.home,'단지시설',esc(info.welfare))
      +lrow(IC.edu,'교육',esc(info.edu),true)
      +lrow(IC.conv,'생활편의',esc(info.conv),true);
    if(live)h+='<div class="sec"><div class="lab">교통 · 생활 · 교육</div><div class="living">'+live+'</div></div>';
  }
  // 평형별 (매매 없으면 전세→월세 순으로 보완, 거래유형 명시)
  var border=['60㎡(18.1평) 이하','60~85㎡(18.1~25.7평)','85~110㎡(25.7~33.3평)','110㎡(33.3평) 초과'];
  function bandRows(list,kind){
    var bm={};list.forEach(function(t){if(!t.a)return;(bm[band(t.a)]=bm[band(t.a)]||[]).push(t);});
    return border.filter(function(b){return bm[b];}).map(function(b){
      var g=bm[b],am=med(g.map(function(t){return t.p;})),
          py=med(g.map(function(t){return Math.round(t.p/t.a*3.305785);})),
          ars=g.map(function(t){return t.a;}).sort(function(x,y){return x-y;}),
          arl=ars[0].toFixed(1)+(ars[0]!==ars[ars.length-1]?'~'+ars[ars.length-1].toFixed(1):'')+'㎡';
      return '<div class="pyr"><div><span class="pb">전용 '+b+'</span><span class="pm">'+arl+' · '+kind+' '+g.length+'건</span></div>'
        +'<div class="pv">'+eok(am)+'<span class="s">'+(kind==='매매'?comma(py)+'만/평':'보증금 중위')+'</span></div></div>';}).join('');
  }
  var pyr=bandRows(mm,'매매')||bandRows(je,'전세')||bandRows(wo,'월세보증금');
  // 평형 라인업(실거래에 나타난 전용면적 종류)
  var ars=[];txs.forEach(function(t){if(t.a&&ars.indexOf(+t.a.toFixed(1))<0)ars.push(+t.a.toFixed(1));});
  ars.sort(function(a,b){return a-b;});
  var lineup=ars.length?('<div class="sec"><div class="lab">평형 라인업 · 실거래 확인 전용면적 '+ars.length+'종</div><div class="chips">'
    +ars.map(function(a){return '<span class="chip">'+a+'㎡<small>'+PY(a)+'</small></span>';}).join('')
    +'</div><div class="note" style="padding-top:6px">최근 실거래(매매·전월세)에 나타난 전용면적입니다. 거래가 없던 평형은 표시되지 않을 수 있습니다.</div></div>'):'';
  // 대출
  var base=mmamt||0,cap=base<=150000?60000:base<=250000?40000:20000;
  var loan='<div class="loan"><div class="lt">'+(base?'매매 중위 '+eok(base)+' 기준 (규제지역 가정)':'시세 표본 부족')+'</div>'
    +'<div class="lrow"><span>집값 구간 상한</span><span class="lv">'+(base?eok(cap):'·')+'</span></div>'
    +'<div class="lrow"><span>LTV 40% 기준</span><span class="lv">'+(base?eok(Math.round(base*0.4)):'·')+'</span></div>'
    +'<div class="lrow" style="border-top:1px solid #ded8cc;margin-top:3px;padding-top:6px;font-weight:700"><span>은행 예상 한도 (낮은 값)</span><span class="lv">'+(base?eok(Math.min(cap,Math.round(base*0.4))):'·')+'</span></div>'
    +'<div class="note">2026.04 시행 규제(작성 2026.07.25). 소득(DSR)·은행별로 더 낮아질 수 있고 비규제는 다릅니다. 대출 권유·한도 보장 아님. <a href="재개발_기초상식.html#loan-limit" style="color:var(--brass)">자세히 →</a></div></div>';
  h+=lineup;
  var _fee=findFee(code,pt.name);
  /* 대표 평형 = 거래가 가장 많은 전용면적. 84.66·84.99처럼 소수만 다른 같은 평형이
     따로 세어지면 실제 주력 평형이 밀리므로 1㎡ 단위로 묶어 최빈 구간을 고른다. */
  var _myA=(function(){var c={},s={};txs.forEach(function(t){if(!t.a)return;
      var k=Math.round(t.a);c[k]=(c[k]||0)+1;s[k]=(s[k]||0)+t.a;});
    var b=0,bn=0;for(var k in c){if(c[k]>bn){bn=c[k];b=k;}}
    return b?s[b]/c[b]:0;})();
  h+=feeSec(_fee,_myA);
  h+='<div class="grid2"><div class="sec"><div class="lab">평형별 시세 (전용)</div>'+(pyr||'<div style="color:#8a8071;padding:8px 2px">최근 매매 표본 부족</div>')+'</div>'
    +'<div class="sec"><div class="lab">은행 대출 한도 (규제지역 기준)</div>'+loan+'</div></div>';
  h+='<div class="sec"><div class="lab">시세 추이 (평당·연도별)</div><div class="soon">'
    +'<svg viewBox="0 0 48 28" width="54" height="31" fill="none" stroke="#a8792c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,24 12,16 22,19 32,9 46,3"/><circle cx="46" cy="3" r="2.6" fill="#a8792c" stroke="none"/></svg>'
    +'<div class="tag">업데이트 예정</div>'
    +'<div>실거래 과거 데이터(백필)가 쌓이면 연도별 매매 평당가 추이 그래프가 여기에 표시됩니다.</div></div></div>';
  // 인근 정비구역
  var near=nearZones(pt.lat,pt.lng);
  h+='<div class="sec"><div class="lab">인근 정비구역 (재개발·재건축)</div>'+(near||'<div style="color:#8a8071;padding:8px 2px">반경 1.5km 내 진행중 정비구역 없음</div>')
    +'<div class="note">반경 1.5km 진행중 구역 · 단계=공공 DB 최신 · 누르면 구역 상세</div></div>';
  // 실거래 이력
  h+='<div class="sec"><div class="lab">실거래 이력</div>'
    +'<div class="tabs"><b class="on" data-t="mm">매매 '+mm.length+'</b><b data-t="je">전세 '+je.length+'</b><b data-t="wo">월세 '+wo.length+'</b></div>'
    +'<div class="list" id="dlist"></div></div>';
  document.getElementById('body').innerHTML=h;
  // 실거래 렌더
  function rMM(x){return '<div class="deal"><div><b>'+x.a+'㎡('+PY(x.a)+')</b><span class="meta">'+x.f+'층 · '+x.cd.slice(2).replace(/-/g,'.')+'</span></div><div class="pr">'+eok(x.p)+'<span class="s">'+(x.a?comma(Math.round(x.p/x.a*3.305785))+'만/평':'')+'</span></div></div>';}
  function rJE(x){return '<div class="deal"><div><b>'+x.a+'㎡('+PY(x.a)+')</b><span class="meta">'+x.f+'층 · '+x.cd.slice(2).replace(/-/g,'.')+'</span></div><div class="pr">'+eok(x.p)+'<span class="s">전세</span></div></div>';}
  function rWO(x){return '<div class="deal"><div><b>'+x.a+'㎡('+PY(x.a)+')</b><span class="meta">'+x.f+'층 · '+x.cd.slice(2).replace(/-/g,'.')+'</span></div><div class="pr">'+eok(x.p)+' / '+x.r+'만<span class="s">월세</span></div></div>';}
  function rd(t){var a=t==='mm'?mm.map(rMM):t==='je'?je.map(rJE):wo.map(rWO);document.getElementById('dlist').innerHTML=a.length?a.join(''):'<div class="deal">해당 유형 최근 거래 없음</div>';}
  rd('mm');
  document.querySelectorAll('.tabs b').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs b').forEach(function(x){x.classList.remove('on');});b.classList.add('on');rd(b.dataset.t);};});
  if(pt.lat&&pt.lng){var m=L.map('map',{zoomControl:true}).setView([pt.lat,pt.lng],16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(m);
    L.marker([pt.lat,pt.lng]).addTo(m).bindPopup('<b>'+esc(pt.name)+'</b>').openPopup();}
}
var DONE={'준공인가':1,'이전고시':1,'조합해산':1,'조합청산':1,'해산':1,'청산':1,'사업완료':1,'철거':1};
function nearZones(la,ln){
  if(!la)return '';
  var out=[];
  var R=(window.REDEV&&REDEV.features)||[];
  R.forEach(function(f){var r0=f.geometry.coordinates[0],cx=0,cy=0;for(var i=0;i<r0.length;i++){cx+=r0[i][0];cy+=r0[i][1];}cx/=r0.length;cy/=r0.length;
    var d=Math.round(hav(la,ln,cy,cx));if(d<=1500&&!DONE[f.properties.stage])out.push({nm:f.properties.biz||f.properties.nm,stage:f.properties.stage,cat:f.properties.cat,key:f.properties.biz||f.properties.nm,d:d});});
  ((window.REDEVMARK)||[]).forEach(function(mm){var d=Math.round(hav(la,ln,mm.lat,mm.lon));if(d<=1500&&!DONE[mm.stage])out.push({nm:mm.nm,stage:mm.stage,cat:mm.cat,key:mm.nm,d:d});});
  out.sort(function(a,b){return a.d-b.d;});out=out.slice(0,6);
  return out.map(function(z){var col=RCOL[z.cat]||'#c0562e';
    return '<a class="deal" style="text-decoration:none;color:inherit" href="구역상세.html?nm='+encodeURIComponent(z.key)+'"><div><b>'+esc(z.nm)+'</b><span class="meta">'+z.d+'m</span></div><div class="pr"><span style="background:'+col+';color:#fff;font-size:11px;padding:1px 8px;border-radius:20px;font-weight:700">'+esc(z.stage)+'</span></div></a>';}).join('');
}
boot();
</script></body></html>
