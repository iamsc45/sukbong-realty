<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="robots" content="noindex,nofollow">
<title>필지 지도 (스테이징) · 석봉부동산정보방</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ink:#16150f; --ink2:#4a483d; --ink3:#84806f;
  --paper:#fbfaf7; --line:#e2ded2; --brass:#8a6a2f;
  --c-house:#2f6b6b; --c-comm:#8a6a2f; --c-fact:#5a5f6b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink);background:var(--paper);-webkit-text-size-adjust:100%}
#map{position:absolute;inset:0}
.leaflet-tile{filter:saturate(.62) grayscale(.28) brightness(1.05)}
.leaflet-control-attribution{font-size:9px;opacity:.55}

/* 상단 바 */
#bar{position:absolute;top:0;left:0;right:0;z-index:950;
  background:rgba(251,250,247,.96);border-bottom:1px solid var(--line);
  padding:9px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bar b{font-size:14px;letter-spacing:-.02em}
#bar .tag{font-size:10px;color:#fff;background:var(--brass);
  padding:2px 6px;border-radius:3px;letter-spacing:.04em}
#q{flex:1;min-width:130px;max-width:280px;padding:7px 10px;font-size:13px;
  border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);outline:none}
#q:focus{border-color:var(--brass)}
#stat{font-size:11px;color:var(--ink3);margin-left:auto;white-space:nowrap}

/* 상품 필터 (범례 겸용) — 바 바로 아래 가로 칩 */
#filt{position:absolute;left:0;right:0;z-index:945;
  background:rgba(251,250,247,.96);border-bottom:1px solid var(--line);
  padding:6px 12px;display:flex;gap:6px;align-items:center;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#filt::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink3);
  border-radius:14px;padding:4px 10px;font-size:12px;line-height:1.4;
  white-space:nowrap;user-select:none;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--ink3)}
.chip i{width:9px;height:9px;border-radius:2px;flex:none;opacity:.4}
.chip b{font-weight:600;font-variant-numeric:tabular-nums;font-size:11px;opacity:.75}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on i{opacity:1}
.chip.all{font-weight:600}

/* 안내 토스트 */
#hint{position:absolute;left:50%;transform:translateX(-50%);top:64px;z-index:940;
  background:var(--ink);color:#fff;font-size:12px;padding:7px 14px;border-radius:16px;
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#hint.on{opacity:.93}

/* 필지 카드 (바텀시트) — 아파트 단지 카드와 같은 결로 맞춘다 */
#sheet{position:absolute;z-index:960;background:var(--paper);
  border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 28px rgba(0,0,0,.18);
  right:14px;top:64px;width:346px;max-height:calc(100% - 86px);
  display:none;flex-direction:column;overflow:hidden}
#sheet.on{display:flex}
#shead{padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none;position:relative}
#shead .a{font-weight:700;font-size:15px;letter-spacing:-.02em;padding-right:26px;line-height:1.35}
#shead .m{color:var(--ink3);font-size:11px;margin-top:3px}
#sx{position:absolute;right:9px;top:9px;width:24px;height:24px;border:0;background:none;
  font-size:19px;line-height:1;color:var(--ink3);cursor:pointer;border-radius:4px}
#sx:hover{background:#efece3;color:var(--ink)}
#sbody{overflow-y:auto;padding:0 14px 14px;-webkit-overflow-scrolling:touch}
.pc-h{margin:13px 0 5px;padding-top:10px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--ink3);letter-spacing:.06em;font-weight:600}
.pc-h:first-child{border-top:0;padding-top:12px;margin-top:0}
.pc-r{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:12.5px}
.pc-r>span:first-child{color:var(--ink3);flex:none}
.pc-r>span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.pc-t{padding:6px 0;border-bottom:1px dotted var(--line)}
.pc-t:last-child{border-bottom:0}
.pc-t .p{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}
.pc-t .k{display:inline-block;font-size:10px;padding:1px 5px;border-radius:2px;
  background:#efece3;color:var(--ink2);margin-left:5px;vertical-align:1.5px}
.pc-t .k.au{background:#f3e6e0;color:#8a4a2f}
.pc-t .d{color:var(--ink3);font-size:10.5px;margin-top:2px;line-height:1.5}
.pc-none{color:var(--ink3);font-size:11.5px;padding:3px 0}
.pc-src{margin-top:12px;padding-top:9px;border-top:1px solid var(--line);
  color:var(--ink3);font-size:10px;line-height:1.65}
.nbrow{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12px}
.nbrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbrow .vv{font-variant-numeric:tabular-nums;flex:none;color:var(--ink2)}

/* 시군구 배지 */
.sgg-b{background:var(--brass);color:#fff;border-radius:11px;
  font-size:11px;font-weight:700;padding:2px 8px;white-space:nowrap;
  box-shadow:0 1px 4px rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.55)}
.sgg-b small{font-weight:400;opacity:.85;margin-left:3px}

@media(max-width:560px){
  #bar{padding:7px 9px;gap:7px}
  #bar b{font-size:13px}
  #stat{width:100%;margin-left:0;order:9}
  #filt{padding:5px 9px;gap:5px}
  .chip{padding:4px 9px;font-size:11.5px}
  /* 좁은 화면에서는 아래에서 올라오는 시트로 (아파트 카드와 같은 방식) */
  #sheet{right:0;left:0;top:auto;bottom:0;width:auto;
    border-radius:12px 12px 0 0;max-height:74%}
}
</style>
</head>
<body>

<div id="bar">
  <b>필지 지도</b><span class="tag">STAGING</span>
  <input id="q" placeholder="시군구 검색 (예: 종로구, 고양)" autocomplete="off">
  <span id="stat">불러오는 중…</span>
</div>

<div id="map"></div>

<div id="filt"></div>

<div id="hint"></div>

<div id="sheet">
  <div id="shead">
    <div class="a" id="sa">—</div>
    <div class="m" id="sm"></div>
    <button id="sx" aria-label="닫기">&times;</button>
  </div>
  <div id="sbody"></div>
</div>

<script src="data/parcel/index.js"></script>
<script>
(function(){
'use strict';

var PY = 3.305785;
function pyRaw(m){ return m / PY; }          // 계산용 (반올림하지 않는다)
function py(m){                               // 표기용 (100㎡ 미만 소수1자리, 이상 정수)
  var v = m / PY;
  return v < 100 ? v.toFixed(1) : String(Math.round(v));
}
function nf(n){ return (n||0).toLocaleString('ko-KR'); }
function won(man){ // 만원 → 억/만원 표기
  if(man >= 10000){
    var eok = man/10000;
    return (eok >= 100 ? Math.round(eok) : Math.round(eok*10)/10) + '억원';
  }
  return nf(man) + '만원';
}
var COLOR = {'단독다가구':'#2f6b6b','상업업무용':'#8a6a2f','공장창고등':'#5a5f6b'};
var LABEL = {'단독다가구':'단독·다가구','상업업무용':'상업·업무용','공장창고등':'공장·창고'};

var IDX = window.PARCELIDX || {};
var KINDS = ['단독다가구', '상업업무용', '공장창고등'];

/* ── 상품 필터 ─────────────────────────────────────
   전국 건수는 index.js 에 담아 둔 종류별 집계를 쓴다.
   화면에서 세면 아직 안 불러온 시군구가 빠져 숫자가 흔들린다. */
var KTOT = {}, KALL = 0;
KINDS.forEach(function(k){ KTOT[k] = 0; });
for(var _c in IDX){
  var kk = IDX[_c].k || {};
  for(var _k in kk){ KTOT[_k] = (KTOT[_k] || 0) + kk[_k]; KALL += kk[_k]; }
}
var sel = {};                       // 비어 있으면 '전체'
function selOn(k){ return !selCount() || sel[k]; }
function selCount(){ var n = 0; for(var k in sel){ if(sel[k]) n++; } return n; }

function buildChips(){
  var el = document.getElementById('filt'), h = '';
  h += '<span class="chip all' + (selCount() ? '' : ' on') + '" data-k="">전체'
    +  '<b>' + nf(KALL) + '</b></span>';
  KINDS.forEach(function(k){
    if(!KTOT[k]) return;
    h += '<span class="chip' + (sel[k] ? ' on' : '') + '" data-k="' + k + '">'
      +  '<i style="background:' + COLOR[k] + '"></i>' + LABEL[k]
      +  '<b>' + nf(KTOT[k]) + '</b></span>';
  });
  el.innerHTML = h;
  [].forEach.call(el.querySelectorAll('.chip'), function(c){
    c.onclick = function(){
      var k = c.getAttribute('data-k');
      if(!k) sel = {};                       // '전체'
      else sel[k] = !sel[k];
      buildChips();
      drawn = {}; polyLayer.clearLayers();   // 필터가 바뀌면 다시 그린다
      refresh();
    };
  });
}

/* 상단 바 높이가 화면 폭에 따라 달라지므로 위치를 재어 맞춘다 */
function layout(){
  var bh = document.getElementById('bar').offsetHeight;
  var fh = document.getElementById('filt').offsetHeight;
  document.getElementById('filt').style.top = bh + 'px';
  document.getElementById('hint').style.top = (bh + fh + 8) + 'px';
  var sh = document.getElementById('sheet');
  if(window.innerWidth > 560){
    sh.style.top = (bh + fh + 10) + 'px';
    sh.style.maxHeight = 'calc(100% - ' + (bh + fh + 30) + 'px)';
  } else {
    sh.style.top = ''; sh.style.maxHeight = '';
  }
}
// preferCanvas 를 쓰지 않는다: SVG 로 그려야 폴리곤이 DOM 에 남아
// 점검기가 "실제로 보이는지"를 독립적으로 셀 수 있다(CLAUDE.md 작업원칙 7).
var map = L.map('map',{zoomControl:true,minZoom:6,maxZoom:19})
           .setView([36.5,127.8], 7);
window.__map = map;   // 점검 스크립트용
L.control.scale({imperial:false}).addTo(map);

// 배경지도: VWorld 우선, 실패하면 CARTO
var base = L.tileLayer(
  'https://api.vworld.kr/req/wmts/1.0.0/EBC23601-6E41-3269-9ECB-821DEECCF3F0/Base/{z}/{y}/{x}.png',
  {attribution:'&copy; VWorld(국토교통부)', maxZoom:19, maxNativeZoom:18, minZoom:6}
).addTo(map);
var fellback = false;
base.on('tileerror', function(){
  if(fellback) return;
  fellback = true;
  map.removeLayer(base);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19}).addTo(map);
});

var sggLayer  = L.layerGroup().addTo(map);   // 시군구 배지 (넓게 볼 때)
var polyLayer = L.layerGroup().addTo(map);   // 필지 폴리곤 (확대했을 때)
var loaded = {}, loading = {}, drawn = {};
var ZOOM_POLY = 13;   // 이 줌부터 폴리곤을 그린다
var totalN = 0;
for(var c in IDX){ totalN += IDX[c].n; }

var hintEl = document.getElementById('hint'), hintT = null;
function hint(msg){
  hintEl.textContent = msg;
  hintEl.classList.add('on');
  clearTimeout(hintT);
  hintT = setTimeout(function(){ hintEl.classList.remove('on'); }, 2600);
}
function stat(msg){ document.getElementById('stat').textContent = msg; }

/* ---------- 시군구 배지 ---------- */
function sggCount(s){
  if(!selCount()) return s.n;
  var n = 0, kk = s.k || {};
  for(var k in kk){ if(sel[k]) n += kk[k]; }
  return n;
}
function filteredTotal(){
  if(!selCount()) return KALL;
  var n = 0;
  for(var k in sel){ if(sel[k]) n += (KTOT[k] || 0); }
  return n;
}

function drawSgg(){
  sggLayer.clearLayers();
  if(map.getZoom() >= ZOOM_POLY) return;
  var b = map.getBounds(), z = map.getZoom(), shown = 0, sum = 0;
  for(var code in IDX){
    var s = IDX[code];
    if(!b.contains([s.c[1], s.c[0]])) continue;
    var cnt = sggCount(s);                 // 필터를 반영한 건수
    if(!cnt) continue;
    // 넓게 볼 때는 작은 시군구를 접는다
    if(z < 9 && cnt < 12) continue;
    if(z < 8 && cnt < 30) continue;
    shown++; sum += cnt;
    var nm = (s.a[1] || s.a[0] || code);
    L.marker([s.c[1], s.c[0]], {
      icon: L.divIcon({className:'', html:'<div class="sgg-b">'+nm+'<small>'+cnt+'</small></div>',
                       iconSize:null, iconAnchor:[0,0]})
    }).on('click', function(cd){ return function(){
        var t = IDX[cd];
        map.fitBounds([[t.b[1],t.b[0]],[t.b[3],t.b[2]]], {padding:[50,50], maxZoom:16});
      };}(code)).addTo(sggLayer);
  }
  var tot = filteredTotal();
  stat(shown ? ('시군구 '+shown+'곳 · 필지 '+nf(tot)+'개') :
               ('필지 '+nf(tot)+'개 · 확대해 주세요'));
}

/* ---------- 필지 폴리곤 ---------- */
function load(code, cb){
  if(loaded[code]) { cb && cb(); return; }
  if(loading[code]) return;
  loading[code] = 1;
  var sc = document.createElement('script');
  sc.src = 'data/parcel/pc_' + code + '.js';
  sc.onload = function(){ loaded[code] = 1; delete loading[code]; cb && cb(); };
  sc.onerror = function(){ delete loading[code]; loaded[code] = 1; }; // 없으면 조용히 넘어간다
  document.head.appendChild(sc);
}

function toLatLng(g, isPoly){
  // GeoJSON은 [경도,위도], Leaflet은 [위도,경도]
  function conv(a){
    if(typeof a[0] === 'number') return [a[1], a[0]];
    return a.map(conv);
  }
  return isPoly ? conv(g) : conv(g);
}

/* ── 인접 필지 시세 ─────────────────────────────────
   같은 시군구 번들 안에서 반경 안에 드는 필지의 실거래를 모은다.
   위경도 → 미터는 우리 위도대(33~38°) 근사로 충분하다. */
function nearby(code, pnu, self, radius){
  var pack = (window.PARCEL || {})[code] || {}, out = [];
  var cx = self.c[0], cy = self.c[1];
  for(var k in pack){
    if(k === pnu) continue;
    var v = pack[k];
    if(!v.t || !v.t.length) continue;
    var dx = (v.c[0] - cx) * 88000, dy = (v.c[1] - cy) * 111000;
    var d = Math.sqrt(dx*dx + dy*dy);
    if(d > radius) continue;
    var t = v.t[0], lot = parseFloat(t.l) || 0;
    out.push({d: Math.round(d), a: v.a, p: t.p, k: t.k, dt: t.d,
              q: lot ? Math.round(t.p / pyRaw(lot)) : 0});
  }
  out.sort(function(a, b){ return a.d - b.d; });
  return out;
}

function median(arr){
  if(!arr.length) return 0;
  var s = arr.slice().sort(function(a, b){ return a - b; }), m = s.length >> 1;
  return s.length % 2 ? s[m] : Math.round((s[m-1] + s[m]) / 2);
}

var sheet = document.getElementById('sheet');
document.getElementById('sx').onclick = function(){ sheet.classList.remove('on'); };

function openCard(pnu, v, code){
  document.getElementById('sa').textContent = v.a || pnu;
  document.getElementById('sm').textContent = 'PNU ' + pnu;
  var h = '';

  /* 1) 토지 */
  h += '<div class="pc-h">토지</div>';
  if(v.j){
    h += '<div class="pc-r"><span>개별공시지가</span><span>' + nf(v.j) + '원/㎡</span></div>'
      +  '<div class="pc-r"><span></span><span>평당 ' + nf(Math.round(v.j * PY)) + '원'
      +  (v.jy ? ' (' + v.jy + '년 고시)' : '') + '</span></div>';
  }
  if(v.b && v.b.ar)
    h += '<div class="pc-r"><span>대지면적</span><span>' + v.b.ar + '㎡(' + py(v.b.ar) + '평)</span></div>';

  /* 2) 건축물대장 */
  var b = v.b || {};
  h += '<div class="pc-h">건축물대장</div>';
  if(b.pu || b.tot || b.gf || b.y){
    if(b.pu)  h += '<div class="pc-r"><span>주용도</span><span>' + b.pu + '</span></div>';
    /* ⚠️ 반올림하지 않는다. 아래 실거래 줄이 72.62㎡ 로 나오는데 여기만 73㎡ 이면
       같은 값이 한 화면에서 갈린다(CLAUDE.md 작업원칙 8). */
    if(b.tot) h += '<div class="pc-r"><span>연면적</span><span>' + nf(b.tot) + '㎡(' + py(b.tot) + '평)</span></div>';
    if(b.gf || b.uf){
      var fl = (b.gf ? '지상 ' + b.gf + '층' : '') + (b.uf ? (b.gf ? ' · ' : '') + '지하 ' + b.uf + '층' : '');
      h += '<div class="pc-r"><span>층수</span><span>' + fl + '</span></div>';
    } else {
      h += '<div class="pc-r"><span>층수</span><span style="color:#84806f">대장에 기재 없음</span></div>';
    }
    if(b.y)   h += '<div class="pc-r"><span>사용승인</span><span>' + b.y + '년</span></div>';
    if(b.ar && b.tot)
      h += '<div class="pc-r"><span>용적률(참고)</span><span>'
        +  (b.tot / b.ar * 100).toFixed(1) + '%</span></div>';
  } else {
    h += '<div class="pc-none">등재된 건축물이 없습니다(나대지일 수 있습니다).</div>';
  }

  /* 3) 실거래 */
  h += '<div class="pc-h">실거래 ' + ((v.t && v.t.length) || 0) + '건</div>';
  (v.t || []).forEach(function(t){
    var lot = parseFloat(t.l) || 0, flr = parseFloat(t.a) || 0;
    h += '<div class="pc-t"><span class="p">' + won(t.p) + '</span>'
      +  '<span class="k">' + (LABEL[t.k] || t.k) + '</span>'
      +  '<div class="d">' + t.d + ' 계약'
      +  (lot ? ' · 대지 ' + lot + '㎡(' + py(lot) + '평)' : '')
      +  (flr ? ' · 연면적 ' + flr + '㎡(' + py(flr) + '평)' : '')
      +  (t.y ? ' · ' + t.y + '년 준공' : '') + '</div>'
      /* 평당가는 반올림 전 평수로 나눈다(표기용 py() 를 쓰면 이중 반올림) */
      +  (lot ? '<div class="d">대지 평당 ' + nf(Math.round(t.p / pyRaw(lot))) + '만원</div>' : '')
      +  '</div>';
  });

  /* 4) 경매·공매 이력 — 같은 물건이 회차마다 오므로 날짜+감정가로 접는다 */
  var xs = [], seen = {};
  (v.x || []).forEach(function(x){
    var k = x.s + '|' + x.d + '|' + x.ap;
    if(seen[k]) return;
    seen[k] = 1; xs.push(x);
  });
  h += '<div class="pc-h">경매 · 공매 이력</div>';
  if(xs.length){
    xs.slice(0, 6).forEach(function(x){
      var won2 = function(m){ return m >= 10000 ? (Math.round(m/1000)/10) + '억' : nf(m) + '만'; };
      h += '<div class="pc-t">'
        +  '<span class="p">' + (x.wp ? won2(x.wp) : '유찰') + '</span>'
        +  '<span class="k au">' + x.s + '</span>'
        +  '<div class="d">' + (x.d || '') + (x.u ? ' · ' + x.u : '')
        +  (x.ap ? ' · 감정 ' + won2(x.ap) : '')
        +  (x.wp && x.ap ? ' · 낙찰가율 ' + Math.round(x.wp / x.ap * 100) + '%' : '')
        +  '</div></div>';
    });
    if(xs.length > 6) h += '<div class="pc-none">외 ' + (xs.length - 6) + '건</div>';
  } else {
    h += '<div class="pc-none">수집 범위(최근분)에 이력이 없습니다.</div>';
  }

  /* 5) 인접 필지 시세 */
  var nb = nearby(code, pnu, v, 400);
  h += '<div class="pc-h">인접 필지 실거래 · 반경 400m</div>';
  if(nb.length){
    var qs = nb.filter(function(x){ return x.q; }).map(function(x){ return x.q; });
    if(qs.length)
      h += '<div class="pc-r"><span>대지 평당 중위</span><span>' + nf(median(qs))
        +  '만원 · ' + qs.length + '건</span></div>';
    nb.slice(0, 5).forEach(function(x){
      h += '<div class="nbrow"><span class="nm">' + (x.a || '').split(' ').slice(-1)[0]
        +  ' <em style="font-style:normal;color:#84806f">' + x.d + 'm</em></span>'
        +  '<span class="vv">' + won(x.p) + (x.q ? ' · 평당 ' + nf(x.q) + '만' : '') + '</span></div>';
    });
    if(nb.length > 5) h += '<div class="pc-none">외 ' + (nb.length - 5) + '필지</div>';
  } else {
    h += '<div class="pc-none">반경 400m 안에 다른 실거래 필지가 없습니다.</div>';
  }

  h += '<div class="pc-src">필지 경계·공시지가는 국토교통부 연속지적도, 건물 정보는 건축물대장, '
    +  '거래는 국토교통부 실거래 신고분입니다. 경매는 법원, 공매는 온비드 자료입니다. '
    +  '용적률(참고)은 지하를 포함한 연면적으로 계산해 실제 값과 다를 수 있습니다. '
    +  '투자 권유가 아닙니다.</div>';

  document.getElementById('sbody').innerHTML = h;
  document.getElementById('sbody').scrollTop = 0;
  sheet.classList.add('on');
}

function drawPoly(){
  var z = map.getZoom();
  if(z < ZOOM_POLY){
    if(polyLayer.getLayers().length){ polyLayer.clearLayers(); drawn = {}; }
    return;
  }
  var b = map.getBounds(), n = 0, pending = 0;

  for(var code in IDX){
    var s = IDX[code];
    if(!b.intersects([[s.b[1], s.b[0]], [s.b[3], s.b[2]]])) continue;
    if(!loaded[code]){ pending++; load(code, drawPoly); continue; }

    var pack = (window.PARCEL || {})[code];
    if(!pack) continue;
    for(var pnu in pack){
      if(drawn[pnu]) { n++; continue; }
      var v = pack[pnu];
      if(!b.contains([v.c[1], v.c[0]])) continue;
      var kind = (v.t && v.t[0]) ? v.t[0].k : '상업업무용';
      if(!selOn(kind)) continue;                    // 상품 필터
      var col  = COLOR[kind] || '#8a6a2f';
      var ll   = toLatLng(v.g, v.y === 'P');
      var lyr  = L.polygon(ll, {
        color: col, weight: 1.4, opacity: .95,
        fillColor: col, fillOpacity: .26
      });
      lyr.on('click', (function(p, val, cd){ return function(){ openCard(p, val, cd); };
             })(pnu, v, code));
      lyr.on('mouseover', function(){ this.setStyle({fillOpacity:.5, weight:2.2}); });
      lyr.on('mouseout',  function(){ this.setStyle({fillOpacity:.26, weight:1.4}); });
      lyr.addTo(polyLayer);
      drawn[pnu] = 1;
      n++;
    }
  }
  stat(pending ? ('필지 ' + nf(n) + '개 · 불러오는 중…')
               : ('화면 안 필지 ' + nf(n) + '개'));
}

function refresh(){ drawSgg(); drawPoly(); }
map.on('moveend zoomend', refresh);

/* ---------- 검색 ---------- */
var qEl = document.getElementById('q');
function go(term){
  term = (term || '').trim();
  if(!term) return;
  var hits = [];
  for(var code in IDX){
    var nm = (IDX[code].a || []).join(' ');
    if(nm.indexOf(term) >= 0) hits.push(code);
  }
  if(!hits.length){ hint('"' + term + '" 은 실거래 필지가 없습니다'); return; }
  hits.sort(function(a, b){ return IDX[b].n - IDX[a].n; });
  var s = IDX[hits[0]];
  map.fitBounds([[s.b[1], s.b[0]], [s.b[3], s.b[2]]], {padding:[50,50], maxZoom:16});
  hint(s.a.join(' ') + ' · 필지 ' + s.n + '개'
       + (hits.length > 1 ? ' (외 ' + (hits.length-1) + '곳)' : ''));
}
qEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') go(qEl.value); });

/* ---------- 시작 ---------- */
var p = new URLSearchParams(location.search);
/* ?k=단독다가구,상업업무용 로 상품을 지정해 열 수 있다(원고 딥링크용) */
(p.get('k') || '').split(',').forEach(function(k){
  k = k.trim();
  if(KINDS.indexOf(k) >= 0) sel[k] = true;
});
buildChips();
layout();
window.addEventListener('resize', layout);
if(p.get('sgg') && IDX[p.get('sgg')]){
  var s0 = IDX[p.get('sgg')];
  map.fitBounds([[s0.b[1], s0.b[0]], [s0.b[3], s0.b[2]]], {padding:[50,50], maxZoom:16});
} else if(p.get('q')){
  qEl.value = p.get('q'); go(p.get('q'));
}
refresh();
window.__PARCEL_READY = true;   // 점검 스크립트용
})();
</script>
