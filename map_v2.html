function txBase(tx){
  /* 가격 외 공통 조건 (계약월·면적·층) — 거래 칩(curU)은 표시 단계에서 적용 */
  if(curD!=='all'&&tx.cd.indexOf(curD)!==0)return false;
  if(fA!=='all'){var ar=FAR[fA];if(tx.a==null||tx.a<ar[0]||tx.a>=ar[1])return false;}
  if(fF!=='all'){var fl=+tx.f;if(!fl||fl<(fF==='f5'?5:15))return false;}

}
function inR(v,r){return v>=r[0]&&v<r[1];}
function ptTxs(pt){
  /* 맞춤 검색: 설정된 가격 필터 프로파일을 "같은 지점"이 전부 충족해야 표시.
     매매가 → 해당 범위 매매 거래 보유 / 보증금(+월세액) → 해당 조건 전·월세 거래 보유.
     매매가+보증금 조합 = 매매가 X이면서 전세(보증금) Y인 매물(갭 검색). */
  if(curTset&&!curTset[pt.t])return [];
  if(fY!=='all'){
    var y=ptYear(pt);if(!y)return [];
    var ag=CURY-y;
    if(fY==='y5'&&ag>5)return [];
    if(fY==='y10'&&ag>10)return [];
    if(fY==='y20'&&ag<20)return [];
    /* 30·40년 구간 추가(2026-08-10). 재개발을 보는 사람에게 20년은 의미가 없다.
       노후·불량건축물 판단선이 30년이라 그 위를 볼 수 있어야 한다. */
    if(fY==='y30'&&ag<30)return [];
    if(fY==='y40'&&ag<40)return [];
  }
  var base=pt.txs.filter(txBase);
  var S=fSc||(fS!=='all'?FSR[fS]:null);
  var B=fBc||(fB!=='all'?FBR[fB]:null);
  var W=fWc||(fW!=='all'?FWR[fW]:null);
  var out;
  if(!S&&!B&&!W){

  }else{
    var sale=S?base.filter(function(t){return t.u==='매매'&&inR(t.p,S);}):[];
    var rent=[];
    if(W)rent=base.filter(function(t){return t.u==='월세'&&inR(t.r||0,W)&&(!B||inR(t.p,B));});
    else if(B)rent=base.filter(function(t){return (t.u==='전세'||t.u==='월세')&&inR(t.p,B);});
    if(S&&!sale.length)return [];
    if((B||W)&&!rent.length)return [];
    out=sale.concat(rent);

  }
  if(curU!=='all')out=out.filter(function(t){return t.u===curU;});

}

    if(cb){loadDetail._q=loadDetail._q||{};(loadDetail._q[code]=loadDetail._q[code]||[]).push(cb);}

  var b=map.getBounds(), m=0.065;
  /* 🔴 부하 제어(2026-08-10 석봉님 제보 'Page Unresponsive').
     렌더 자체는 1~2ms인데, 시군구 상세(detail_*.js)를 한꺼번에 받아 파싱하는 것이 문제였다.
     빌딩 필터로 넓은 화면을 열었을 때 12개 시군구·1.9MB를 동시에 파싱해 메인 스레드가 멎었다.
     ①확대할수록 상한을 줄이고 ②지금 켠 상품이 아예 없는 시군구는 아예 받지 않는다. */
  var _z=map.getZoom(), MAXR=(_z>=16?6:(_z>=14?9:12));
  var eb=L.latLngBounds([b.getSouth()-m,b.getWest()-m],[b.getNorth()+m,b.getEast()+m]);
  var out=SB.summary.regions.filter(function(r){
    if(!r.lat||!regionPass(r))return false;
    /* 상품 필터가 켜져 있으면 그 상품 거래가 0인 시군구는 건너뛴다(요약의 nt가 상품별 건수).
       예: 빌딩만 볼 때 빌딩 거래가 없는 구의 650KB 파일을 받을 이유가 없다. */
    if(curTset&&r.nt){var _has=false;for(var _k in curTset){if(r.nt[_k]){_has=true;break;}}if(!_has)return false;}
    /* 지점 범위(b)에는 여유를 더하지 않는다 — 사각형이라 이미 실제보다 넉넉하고,
       여유까지 주면 화면당 로드 대상이 평균 12곳까지 늘어 첫 진입이 느려진다
       (시뮬레이션 5,788건: 여유 있음 평균 12.2·최대 47 / 없음 평균 6.7·최대 24, 누락은 둘 다 0). */
    if(r.b&&r.b.length===4)return eb.intersects(L.latLngBounds([r.b[0],r.b[1]],[r.b[2],r.b[3]]));
    return eb.contains([r.lat,r.lng]);
  });
  /* 넓게 잡히는 날(도서 포함 시군구 등)을 대비한 상한. 화면 중심에서 지점 범위까지 가까운 순.
     상한 12에서도 시뮬레이션 누락 0건, 평균 5.7곳으로 종전(3.8곳)과 비슷하다. */
  if(out.length>MAXR){
    var c=map.getCenter();
    out.sort(function(x,y){return _bdist(x,c)-_bdist(y,c);});
    out=out.slice(0,MAXR);
  }
  return out;
}
function _bdist(r,c){   /* 화면 중심에서 그 시군구 지점 범위까지의 거리(도) */
  if(!r.b||r.b.length!==4)return Math.abs(r.lat-c.lat)+Math.abs(r.lng-c.lng);
  var dy=Math.max(r.b[0]-c.lat,0,c.lat-r.b[2]), dx=Math.max(r.b[1]-c.lng,0,c.lng-r.b[3]);
  return Math.sqrt(dy*dy+dx*dx);
}
function render(){
  layer.clearLayers();
  if(curMode==='redev'&&!redevShowTrade)return;

    SB.summary.regions.forEach(function(r){
      if(!r.lat||!regionPass(r))return;
      var tot;if(!curTset||!r.nt){tot=r.n['매매']+r.n['전세']+r.n['월세'];}else{tot=0;for(var _k in curTset){tot+=(r.nt[_k]||0);}}
      if(!tot)return;
      var sz=Math.min(64,Math.max(42,Math.round(14*Math.log(tot||1))));
      var icon=L.divIcon({className:'',html:'<div class="clus" style="width:'+sz+'px;height:'+sz+'px">'

        iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});

      nPt++;nTx+=tot;
    });

  }
  var need=visibleRegions(), pending=0;
  /* 동시에 여러 개를 받으면 파싱이 겹쳐 화면이 멎는다. 한 번에 3개까지만 시작하고
     나머지는 로드가 끝날 때마다 render()가 다시 불려 자연히 이어받는다(2026-08-10). */
  var _start=0;
  need.forEach(function(r){
    if(loaded[r.code])return;

    });
    Object.keys(dongs).forEach(function(k){
      var g=dongs[k],sz=Math.min(58,Math.max(38,Math.round(12*Math.log(g.tx+2))));
      var icon=L.divIcon({className:'',html:'<div class="clus dong" style="width:'+sz+'px;height:'+sz+'px">'
        +'<span class="cn">'+k+'</span><span class="cc">'+g.tx+'</span></div>',
        iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
      var la=g.lat/g.n,ln=g.lng/g.n;
      L.marker([la,ln],{icon:icon}).on('click',function(){go(la,ln,Z_POINT);}).addTo(layer);
      nPt++;nTx+=g.tx;
    });
    document.getElementById('stat').textContent='동 '+nPt+'곳 · '+nTx.toLocaleString()+'건'+(pending?' · 불러오는 중…':'');
    setFcount('화면 내 조건 일치 '+nTx.toLocaleString()+'건');
    return;
  }
  pts.forEach(function(o){
    var pt=o.pt,txs=o.txs,ti=TYPE[pt.t]||["기타","#6E6E6A"],col=ti[1],latest=txs[0];
    var icon=L.divIcon({className:'',html:'<div class="pricetag'+(pt.ax?' apx':'')+'" style="background:'+col+'">'
      +priceLabel(latest)+' <span class="n">'+(latest.a?Math.round(latest.a)+'㎡·'+PY(latest.a):'')+(latest.cd?' · '+latest.cd.slice(5):'')+'</span>'
      +'<span class="nm">'+pt.name+'</span></div>',iconSize:null,iconAnchor:[30,12]});
    var rows=txs.map(function(t){
      var u=t.u+(t.k?'·'+t.k.slice(0,2):'');
      var sqm=(t.u==='매매'&&t.a)?'<div style="font-weight:normal;font-size:10px;color:#888">'+Math.round(t.p/t.a*3.305785).toLocaleString()+'만/평</div>':'';
      return '<tr><td>'+t.cd.slice(5)+'</td><td>'+u+'</td><td>'+(t.a?t.a+'<span style="color:#9a938a;font-size:10px"> '+PY(t.a)+'</span>':'-')+'</td><td>'+t.f+'</td><td class="pr">'+priceLabel(t)+sqm+'</td></tr>';
    }).join('');
    var pop='<div class="pop"><h4>'+pt.name+'<span class="badge" style="background:'+col+'">'+ti[0]+'</span></h4>'
      +'<div class="meta">'+pt.dong+' '+pt.jibun+(pt.extra?' · '+pt.extra:'')+' · '+txs.length+'건'+(pt.ax?' · <b style="color:#D4573F">지번 비공개 · 동 단위 개략 위치</b>':'')+'</div>'
      +'<div class="tw"><table><thead><tr><th>계약</th><th>거래</th><th>면적㎡</th><th>층</th><th>가격</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    /* 카드에는 필터를 걸지 않은 그 지점의 전 거래를 넘긴다(2026-08-09).
       기본 필터가 '아파트·매매'가 되면서, 마커를 누르면 카드에서도 전세·월세가 사라져
       검색으로 연 카드(전 거래 표시)와 내용이 달라졌다. 지도는 걸러 보되 카드는 다 보여준다. */
    var mk=L.marker([pt.lat,pt.lng],{icon:icon}).on('click',function(){showAptCard(pt,(pt.txs||txs).slice());});
    mk.on('popupopen',function(){var el=mk.getElement();if(el){var t=el.querySelector('.pricetag');if(t)t.classList.add('sel');}});
    mk.on('popupclose',function(){var el=mk.getElement();if(el){var t=el.querySelector('.pricetag');if(t)t.classList.remove('sel');}});
    mk.addTo(layer);
    nPt++;nTx+=txs.length;
  });
  document.getElementById('stat').textContent='지점 '+nPt+' · '+nTx.toLocaleString()+'건'+(pending?' · 불러오는 중…':'');
  setFcount('화면 내 조건 일치 '+nTx.toLocaleString()+'건');
}

function mkChips(elId,items,cur,setter){
  var el=document.getElementById(elId);
  items.forEach(function(it){
    var b=document.createElement('button');
    b.className='chip'+(it[0]===cur?' on':'');
    b.innerHTML=(it[2]?'<span class="dot" style="background:'+it[2]+'"></span>':'')+it[1];
    b.addEventListener('click',function(){
      el.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');setter(it[0]);render();});
    el.appendChild(b);
  });
  /* 코드로 값이 바뀌었을 때 칩 표시를 맞추기 위한 동기화기(2026-08-09) */
  if(elId==='uchips')window._syncUUI=function(){
    el.querySelectorAll('.chip').forEach(function(x,i){x.classList.toggle('on',items[i][0]===curU);});
  };
}

(function(){

  function openSheet(cat){

  var h='<div class="rc-lab">최근 실거래 · '+(_T==='bldg'?'평당 연면적기준':(_T==='land'?'㎡·평당 토지기준':'평당 전용기준'))+'</div>';
  /* 평형이 둘 이상일 때만 칩을 보여준다(1종뿐인 지점이 절반 이상) */
  if(order.length>1){
    h+='<div id="rcPy" style="display:flex;gap:5px;flex-wrap:wrap;margin:0 0 9px">';
    h+='<button data-g="all" class="pychip" style="border:1px solid '+(C.grp==='all'?'#1a1a1a':'#ddd6c8')+';background:'+(C.grp==='all'?'#1a1a1a':'#fff')+';color:'+(C.grp==='all'?'#fff':'#6b6355')+';font:inherit;font-size:11.5px;font-weight:700;border-radius:20px;padding:4px 10px;cursor:pointer">전체 '+all.length+'</button>';
    order.forEach(function(k){
      var on=(String(C.grp)===String(k));
      h+='<button data-g="'+k+'" class="pychip" style="border:1px solid '+(on?'#1a1a1a':'#ddd6c8')+';background:'+(on?'#1a1a1a':'#fff')+';color:'+(on?'#fff':'#6b6355')+';font:inherit;font-size:11.5px;font-weight:700;border-radius:20px;padding:4px 10px;cursor:pointer">'+(_byFloor?(k+'층'):(k+'㎡·'+PY(k)))+' '+g[k].length+'</button>';
    });
    h+='</div>';
  }
  h+='<div id="rcU" style="display:flex;gap:5px;flex-wrap:wrap;margin:0 0 9px">'
    +['all','매매','전세','월세'].map(function(u){
        if(u!=='all'&&!UC[u])return '';
        var on=(C.u===u), lab=(u==='all'?'전체':u);
        return '<button data-u="'+u+'" class="uchip" style="border:1px solid '+(on?'#7a3b12':'#ddd6c8')+';background:'+(on?'#7a3b12':'#fff')+';color:'+(on?'#fff':'#6b6355')+';font:inherit;font-size:11.5px;font-weight:700;border-radius:20px;padding:4px 10px;cursor:pointer">'+lab+' '+UC[u]+'</button>';
      }).join('')+'</div>';
  /* 고른 평형의 매매 중위 — 전 평형 중위만 있으면 특정 평형을 보러 온 사람에게 쓸모가 없다 */
  if(C.grp!=='all'){
    var uu=(C.u==='all')?'매매':C.u;
    var sel=byPy.filter(function(t){return t.u===uu;});
    if(sel.length){
      var _aName=(_T==='bldg')?'연면적':(_T==='land'?'면적':'전용');
      var lab=(_byFloor?(C.grp+'층'):(_aName+' '+C.grp+'㎡('+PY(C.grp)+')'))+' · '+uu+' 중위 '+sel.length+'건';
      var big='', sub='';
      if(uu==='월세'){
        big=_eok(_med(sel.map(function(t){return t.p;})))+'/'+_med(sel.map(function(t){return t.r||0;}))+'만';
      }else{
        big=_eok(_med(sel.map(function(t){return t.p;})));
        var pyv=_med(sel.filter(function(t){return t.a;}).map(function(t){return Math.round(t.p/t.a*3.305785);}));
        var _base=(_T==='bldg')?'연면적':(_T==='land'?'토지':'전용');
        if(pyv)sub=' <span style="font-size:11.5px;font-weight:700">· 평당 '+pyv.toLocaleString()+'만('+_base+')</span>';
        /* 빌딩은 대지 평당가가 시장 표준이라 있으면 함께 적는다(2026-08-09) */
        if(_T==='bldg'){
          var _la=sel.filter(function(t){return t.la;});
          var _lapy=_med(_la.map(function(t){return Math.round(t.p/(t.la/3.305785));}));
          if(_lapy)sub+='<div style="font-size:11.5px;color:#7a3b12;font-weight:700;margin-top:2px">대지 평당 '+_lapy.toLocaleString()+'만 ('+_la.length+'건)</div>';
        }
        /* 표본이 3건 이상일 때만 범위를 함께 적는다(얇은 표본 규칙) */
        if(sel.length>=3){
          var ps=sel.map(function(t){return t.p;}).sort(function(x,y){return x-y;});
          sub+='<div style="font-size:11px;color:#8a8071;font-weight:600;margin-top:2px">범위 '+_eok(ps[0])+' ~ '+_eok(ps[ps.length-1])+'</div>';
        }
      }
      h+='<div style="background:#f4f0e6;border-radius:10px;padding:8px 11px;margin:0 0 9px">'
        +'<div style="font-size:11px;color:#8a8071">'+lab+'</div>'
        +'<div style="font-size:16px;font-weight:800;color:#7a3b12;margin-top:1px">'+big+sub+'</div></div>';
    }
  }
  if(!list.length){h+='<div style="color:#8a8071;font-size:13px">거래 없음</div>';box.innerHTML=h;return;}
  h+=list.slice(0,C.shown).map(function(t){
    var py=(t.u==='매매'&&t.a)?(' <span style="color:#8a8071;font-weight:400">'+Math.round(t.p/t.a*3.305785).toLocaleString()+'만/평</span>'):'';
    return '<div class="rc-dl"><span style="color:#6b6355">'+t.cd.slice(2)+' · '+(t.a?t.a+'㎡('+PY(t.a)+')':'-')+' · '+t.f+'층</span><b>'+priceLabel(t)+py+'</b></div>';
  }).join('');
  var left=list.length-C.shown;
  if(left>0)h+='<button id="rcMore" style="width:100%;margin-top:9px;border:1px solid #ddd6c8;background:#fff;color:#6b6355;font:inherit;font-size:12.5px;font-weight:700;border-radius:10px;padding:9px 0;cursor:pointer">더 보기 (남은 '+left+'건)</button>';
  box.innerHTML=h;
  var pc=document.getElementById('rcPy');
  if(pc)pc.addEventListener('click',function(e){var b=e.target.closest('.pychip');if(!b)return;
    C.grp=b.getAttribute('data-g');C.shown=8;_drawTx();});
  var uc=document.getElementById('rcU');
  if(uc)uc.addEventListener('click',function(e){var b=e.target.closest('.uchip');if(!b)return;
    C.u=b.getAttribute('data-u');C.shown=8;_drawTx();});
  var mb=document.getElementById('rcMore');
  if(mb)mb.onclick=function(){C.shown+=10;_drawTx();};
}
function showAptCard(pt, txs){
  var ti=TYPE[pt.t]||['기타','#6E6E6A'], col=ti[1];
  /* 2026-08-09: 목록은 _drawTx가 그린다(평형 칩 · 거래유형 칩 · 더 보기) */
  window._CARD={pt:pt,txs:txs,grp:'all',u:'all',shown:8};
  var rows='';
  var nz=[];
  if(typeof redevMarks!=='undefined' && redevMarks && redevMarks.length){
    redevMarks.forEach(function(m){var d=Math.round(_hav(pt.lat,pt.lng,m.lat,m.lon));if(d<=1200)nz.push({nm:m.nm,stage:m.stage,cat:m.cat,gubun:m.gubun,lat:m.lat,lon:m.lon,area:null,d:d});});
  }
  if(typeof redevData!=='undefined' && redevData && redevData.features){
    redevData.features.forEach(function(f){var r0=f.geometry.coordinates[0];var cx=0,cy=0;for(var i=0;i<r0.length;i++){cx+=r0[i][0];cy+=r0[i][1];}cx/=r0.length;cy/=r0.length;var d=Math.round(_hav(pt.lat,pt.lng,cy,cx));if(d<=1200)nz.push({nm:f.properties.nm,biz:f.properties.biz,stage:f.properties.stage,cat:f.properties.cat,gubun:f.properties.gubun,area:f.properties.area,lat:cy,lon:cx,d:d});});
  }
  nz.sort(function(a,b){return a.d-b.d;}); nz=nz.slice(0,6); window._NZ=nz;
  var near=nz.map(function(z,i){var cc=(RCOL[z.cat]||'#8a8071');
    return '<div class="rc-row" onclick="focusZone(window._NZ['+i+'])"><span>'+z.nm+' <span style="color:#8a8071">'+z.d+'m</span><span class="arw">→</span></span><span class="rc-badge" style="background:'+cc+'">'+(z.stage||'확인중')+'</span></div>';}).join('');
  var code=(window.SB&&SB.dongs&&SB.dongs[pt.dong])?SB.dongs[pt.dong][0]:'';
  if(code&&(!window.APTASK||window.APTASK[code]===undefined)){
    showAptCard._pend=showAptCard._pend||{};
    if(!showAptCard._pend[code]){showAptCard._pend[code]=1;
      var sc=document.createElement('script');sc.src='data/apt_asking_'+code+'.js';
      sc.onload=function(){var al=document.createElement('script');al.src='data/alias_'+code+'.js';
        al.onload=al.onerror=function(){showAptCard(pt,txs);};document.body.appendChild(al);};
      sc.onerror=function(){window.APTASK=window.APTASK||{};window.APTASK[code]={};};document.body.appendChild(sc);}
  }
  var _ab=(code&&window.APTALIAS&&window.APTALIAS[code])||null;
  var _al=_ab?(_ab[pt.name+'|'+(pt.dong||'')]||_ab[pt.name]||null):null;
  /* 호가 키는 '단지명|법정동'이다(2026-07-30). 전에는 단지명뿐이라 같은 구의
     동명이단지 호가가 섞였다(압구정 현대1차에 개포동 호가 36억이 붙어 실거래
     66억보다 낮게 나온 사고). 별칭이 없을 때도 반드시 법정동을 붙여 찾는다. */
  var _AB=(code&&window.APTASK&&window.APTASK[code])||null;
  var _ak=(_al&&_al.a)||(pt.name+'|'+(pt.dong||''));
  var A=(_AB&&_AB[_ak])||null;
  var hoSec='';
  {
    function eok2(m){if(!m)return '';var v=m/10000;return (v>=100?Math.round(v):(''+v.toFixed(1)).replace(/\.0$/,''))+'억';}
    function md(a){if(!a.length)return 0;var s=a.slice().sort(function(x,y){return x-y;});return s[Math.floor(s.length/2)];}
    var mmT=txs.filter(function(t){return t.u==='매매';}),jeT=txs.filter(function(t){return t.u==='전세';}),woT=txs.filter(function(t){return t.u==='월세';});
    function arng2(list){var a=list.filter(function(t){return t.a;}).map(function(t){return t.a;}).sort(function(x,y){return x-y;});
      if(!a.length)return '';var lo=a[0].toFixed(1),hi=a[a.length-1].toFixed(1);
      return '<span style="display:block;font-size:9.5px;color:#a39887;font-weight:600">'+(lo===hi?lo+'㎡·'+PY(a[0]):lo+'~'+hi+'㎡')+'</span>';}
    function rrow(l,rv,hv,ar){return '<div style="display:grid;grid-template-columns:52px 1fr 1fr;font-size:12.5px;padding:5px 0;border-bottom:1px dotted #e7e1d4"><b style="color:#6b6355;font-weight:700">'+l+(ar||'')+'</b><span style="text-align:right;font-weight:700">'+(rv||'·')+'</span><span style="text-align:right;font-weight:700;color:#c0562e">'+(hv||'·')+'</span></div>';}
    /* 기준 날짜를 열 제목에 바로 붙인다(2026-08-10 석봉님 지시). 카드 맨 아래 각주로만
       두면 숫자를 볼 때 눈에 안 들어온다. 실거래와 호가는 시점이 다른 자료라 같이 봐야 한다. */
    var _md=function(s){s=String(s||'');var m=s.match(/(\d{4})-(\d{2})-(\d{2})/);
      return m?(m[2].replace(/^0/,'')+'/'+m[3]):'';};
    /* 🔴 2026-08-10 석봉님: "실거래 기준일이 호가와 똑같이 나온다".
       그건 우리가 자료를 받아 온 날(전 지역 공통)이라 이 단지 얘기가 아니었다.
       이 단지에서 **가장 최근 계약일**을 적는다. 그게 사람이 궁금해하는 날짜다. */
    var _last=''; txs.forEach(function(t){if(t.cd&&t.cd>_last)_last=t.cd;});
    var _dTx=_md(_last), _dHo=_md(window.APTASKDAY||'');
    var _sub=function(t){return t?'<em style="display:block;font-style:normal;font-weight:600;font-size:9px;color:#a39887;letter-spacing:0">'+t+'</em>':'';};
    hoSec='<div class="rc-sec"><div class="rc-lab">실거래 vs 호가 · 중위</div>'
      +'<div style="display:grid;grid-template-columns:52px 1fr 1fr;font-size:10px;color:#8a8071;font-weight:700;padding-bottom:2px"><span></span>'
      +'<span style="text-align:right">실거래'+_sub(_dTx?'최근 '+_dTx+' 계약':'')+'</span>'
      +'<span style="text-align:right">호가'+_sub(_dHo?'수집 '+_dHo:(A?'':'미수집'))+'</span></div>'
      /* 호가에 건수 병기(2026-08-05). 매물 1건을 '중위'로 내보내던 문제 — 1건은 명시한다.
         월세 3,000만 초과는 파싱 오류 표본이라 숨김(단지상세와 동일 가드). */
      +rrow('매매',eok2(md(mmT.map(function(t){return t.p;}))),(A&&A.mm)?(eok2(A.mm.med)+'<small style="font-weight:600;color:#a39887"> '+(A.mm.n===1?'매물1건':A.mm.n+'건')+'</small>'):'',arng2(mmT))
      +rrow('전세',eok2(md(jeT.map(function(t){return t.p;}))),(A&&A.je)?(eok2(A.je.med)+'<small style="font-weight:600;color:#a39887"> '+(A.je.n===1?'매물1건':A.je.n+'건')+'</small>'):'',arng2(jeT))
      +rrow('월세',woT.length?(eok2(md(woT.map(function(t){return t.p;})))+'/'+md(woT.map(function(t){return t.r;}))+'만'):'',(A&&A.wo&&A.wo.wol<=3000)?(eok2(A.wo.bo)+'/'+A.wo.wol+'만<small style="font-weight:600;color:#a39887"> '+(A.wo.n===1?'매물1건':A.wo.n+'건')+'</small>'):'',arng2(woT))
      +'<div class="rc-note" style="padding:4px 0 0">거래된 <b>전 평형 중위</b>(특정 평형 아님, 좌측 면적범위 참고) · 호가=협상 전 매물가(주황). '+(A?'체결가와 다를 수 있음.':'이 단지 현재 호가 매물 없음.')+'</div></div>';
  }
  var favId=code+'|'+pt.name;
  var isFav=(window.SBAuth&&SBAuth.isIn())?SBAuth.favHas(favId):false;
  var html='<button id="rcClose" style="position:absolute;top:8px;right:10px;border:0;background:rgba(255,255,255,.28);color:#fff;font-size:18px;width:28px;height:28px;border-radius:50%;cursor:pointer;z-index:2">×</button>'
    +'<div class="rc-h" style="background:'+col+'"><div class="k">'+ti[0]+' · 실거래</div><h2>'+pt.name+'</h2><div class="loc">'+pt.dong+' '+(pt.jibun||'')+'</div>'
    +'<button id="rcFav" style="margin-top:9px;border:0;border-radius:100px;padding:8px 16px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;'
      +(isFav?'background:#ffd24d;color:#5c4300':'background:rgba(255,255,255,.92);color:#1a1a1a')+'">'
    +(isFav?'★ 등록됨 · 목록 보기':'☆ 관심단지 등록')+'</button></div>'
    +hoSec
    +'<div class="rc-sec" id="rcTx"></div>'
    +(near?'<div class="rc-sec"><div class="rc-lab">인근 정비구역 (누르면 이동)</div>'+near+'</div>':'')
    +'<a class="rc-cta" href="단지상세.html?code='+code+'&nm='+encodeURIComponent(pt.name)+'&dong='+encodeURIComponent(pt.dong||'')+'" style="background:#12203a">이 단지 실거래·평형별 상세 →</a>'
    /* 대출 문의(2026-08-02 석봉님 지시) — 지금은 준비 중 안내 페이지. 목적지 교체는 대출문의.html 한 파일만 */
    +'<div style="text-align:center;margin-top:7px"><a href="%EB%8C%80%EC%B6%9C%EB%AC%B8%EC%9D%98.html?ctx='+encodeURIComponent(pt.name+' '+(pt.dong||''))+'" style="font-size:12px;color:#8a8071;text-decoration:underline" onclick="if(window.gtag)gtag(\'event\',\'loan_inquiry_click\',{from:\'map_card\'})">💬 이 단지 담보 대출 문의</a></div>'
    +'<div class="rc-note">실거래 기준일 '+((window.SB&&SB.summary&&SB.summary.updated)||'-')+' · 호가 수집일 '+(window.APTASKDAY||(A?'-':'미수집 지역'))+'</div>';
  var rc=document.getElementById('rcard');rc.innerHTML=html;rc.classList.add('open');
  _drawTx();
  document.getElementById('rcClose').onclick=function(){rc.classList.remove('open');};
  var fb=document.getElementById('rcFav');
  if(fb)fb.onclick=function(){
    var item={id:favId,nm:pt.name,code:code,dong:pt.dong||'',lastN:(pt.txs||txs||[]).length};
    function paint(on){
      fb.textContent=on?'★ 등록됨 · 목록 보기':'☆ 관심단지 등록';
      fb.style.background=on?'#ffd24d':'rgba(255,255,255,.92)';fb.style.color=on?'#5c4300':'#1a1a1a';
    }
    if(!(window.SBAuth&&SBAuth.isIn())){
      if(window.SBAuth)SBAuth.gate(item,null);
      return;
    }
    if(SBAuth.favHas(favId)){
      if(confirm('관심단지 목록으로 이동할까요? (취소=등록 해제)')){location.href='favorites.html';return;}
      SBAuth.delFav(favId).then(function(ok){if(ok)paint(false);});
    }
    else{SBAuth.addFav(item).then(function(ok){if(ok)paint(true);});}
    try{if(typeof gtag==='function')gtag('event','favorite_toggle',{item_name:pt.name});}catch(e){}
  };
}

function setMode(m){
  curMode=m;
  document.querySelectorAll('#modes button').forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});
  document.body.classList.toggle('redev',m==='redev');
  if(!map.hasLayer(layer))map.addLayer(layer);
  if(m==='trade'){
    if(map.hasLayer(redevLayer))map.removeLayer(redevLayer);
    document.getElementById('rcard').classList.remove('open');
    tradeLegend();render();
  }else{
    if(!map.hasLayer(redevLayer))map.addLayer(redevLayer);
    redevLegend();render();loadRedev(renderRedev);
  }
}
document.querySelectorAll('#modes button').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.m);});});
/* 모바일에선 trade 칩이 #map 안으로 이동돼 있어 두 위치 모두 배선 */
document.querySelectorAll('#rfbar button,#map .rfc.trade').forEach(function(b){b.addEventListener('click',function(){
  var rf=b.dataset.rf;
  if(rf==='trade'){redevShowTrade=!redevShowTrade;b.classList.toggle('on',redevShowTrade);render();}
  else{curRF[rf]=!curRF[rf];b.classList.toggle('on',curRF[rf]);renderRedev();}
});});
/* ⚠️URL이 모드를 명시하면 그게 사용자의 의도다(2026-08-08 모바일 피드백).
   전에는 아래 뒤로가기 복원이 직전에 보던 모드로 되돌려서, 실거래 지도를 봤던 사람이
   홈에서 '재개발'을 눌러도 실거래 화면이 떴다. 명시 모드가 있으면 복원은 좌표만 한다. */
var _urlMode=null;try{_urlMode=(new URLSearchParams(location.search)).get('mode');}catch(e){}
if(_urlMode==='redev'){setMode('redev');}
/* 뒤로가기 복원: (명시 모드가 없을 때만) 모드까지 되돌린 뒤 보던 좌표·확대로 이동 */
if(_BACKVIEW){try{
  if(!_urlMode){
    if(_BACKVIEW.m==='redev'&&curMode!=='redev')setMode('redev');
    else if(_BACKVIEW.m!=='redev'&&curMode==='redev')setMode('trade');
  }
  setTimeout(function(){try{map.invalidateSize();map.setView([_BACKVIEW.lat,_BACKVIEW.lng],_BACKVIEW.z,{animate:false});}catch(e){}},80);
}catch(e){}}

render();
