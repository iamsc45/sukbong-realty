  .tb th,.tb td{padding:8px 5px;white-space:nowrap}

     모바일에서 숨겨지면 같이 숨긴다(2026-08-02). 안 그러면 값 없는 주석만 남는다. */

<script>
(function(){
  var A=window.SB&&SB.auction;
  var kel=document.getElementById('kpis'),tbl=document.getElementById('tbl'),ex=document.getElementById('extra');
  var seg=document.getElementById('segTable'),note=document.getElementById('note');
  if(!A){tbl.innerHTML='<p style="color:var(--muted)">데이터 연결 대기 중입니다.</p>';return;}
  document.getElementById('basis').textContent='법원경매·온비드 공매 낙찰 통계 · 기준일 '+A.updated;
  var NM={'아파트':'아파트','오피스텔':'오피스텔','연립다세대':'연립·다세대','단독다가구':'단독·다가구','상가업무':'상가·업무','토지':'토지','공장창고':'공장·창고','자동차중기':'자동차·중기','주거_기타':'주거 기타','기타':'기타'};
  function kpi(v,l){return '<div class="kpi2"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';}
  var hot=document.getElementById('hot');
  function eokM(m){if(!m)return '·';var v=m/10000;return v>=100?Math.round(v)+'억':v>=1?((''+v.toFixed(1)).replace(/\.0$/,''))+'억':Math.round(m).toLocaleString()+'만';}
  function fd(s){return s?s.slice(4,6)+'.'+s.slice(6,8):'';}
  /* 클릭 → 우리 지도의 해당 동으로. 낙찰가가 주변 실거래 대비 싼지 바로 비교하게 한다.
     (법원경매정보는 세션 기반이라 물건 딥링크가 불가능 — 외부로 보내는 대신 시세 비교로 연결) */
  function card(q,loc,nm,use,ap,sp,ratio,meta,d){
    var cls=ratio<70?'lo':(ratio>=100?'hi':'');
    return '<a class="hc" href="map.html?q='+encodeURIComponent(q)+'" '
      +'onclick="if(window.gtag)gtag(\'event\',\'auction_hot_click\',{q:\''+q.replace(/'/g,'')+'\'})">'
      +'<div class="loc">'+loc+'</div>'
      +'<div class="nm">'+nm+(use&&nm.indexOf(use)<0?'<small>'+use+'</small>':'')+'</div>'
      +'<div class="pr">감정 '+eokM(ap)+' → <b>'+eokM(sp)+'</b><span class="rt '+cls+'">'+ratio+'%</span></div>'
      +'<div class="mt"><span>'+meta+' · '+fd(d)+'</span><span class="go">지도에서 주변 시세 보기 →</span></div></a>';
  }
  function hotAuction(){
    var h=(A.hot&&A.hot.auc)||[];
    if(!h.length){hot.innerHTML='';return;}
    hot.innerHTML='<p class="seg">최근 2주 화제의 매각 결과 · 관심(조회수) 상위</p><div class="hotg">'
      +h.map(function(x){return card(x.dong, x.sido+' '+x.sgg+' '+x.dong, x.nm, x.use,
        x.ap, x.sp, x.ratio, '유찰 '+x.fail+'회 · 조회 '+x.view, x.d);}).join('')
      +'</div><p class="notice2" style="margin:8px 0 0">※ 낙찰가율은 감정가 대비이며, 감정 시점이 시세와 다를 수 있습니다. 카드를 누르면 실거래지도의 해당 동으로 이동해 주변 시세와 비교할 수 있습니다.</p>';
  }
  function hotOnbid(){
    var h=(A.hot&&A.hot.gong)||[];
    if(!h.length){hot.innerHTML='';return;}
    hot.innerHTML='<p class="seg">최근 개찰 화제의 낙찰 · 응찰자 몰린 물건</p><div class="hotg">'
      +h.map(function(x){return card(x.q, x.addr, x.use, '', x.ap, x.sp, x.ratio, '응찰 '+x.bid+'명', x.d);}).join('')
      +'</div><p class="notice2" style="margin:8px 0 0">※ 압류재산 등은 지분 매각·권리 제한이 흔해 낙찰가율이 극단적으로 낮거나 높을 수 있습니다. 반드시 공매공고 원문을 확인하세요. 카드를 누르면 실거래지도의 해당 지역으로 이동합니다.</p>';
  }
  function table(rows,xLabel){
    var maxRate=Math.max.apply(null,rows.map(function(r){return r.rate;}));
    return '<table class="tb"><thead><tr><th>상품</th><th>물건 수</th><th>낙찰률</th><th>낙찰가율</th><th>'+xLabel+'</th></tr></thead><tbody>'
      +rows.map(function(r){
        var w=maxRate?Math.max(4,Math.round(r.rate/maxRate*70)):4;
        return '<tr><td>'+(NM[r.p]||r.p)+'</td><td>'+r.n.toLocaleString()+'</td>'
          +'<td><span class="bar" style="width:'+w+'px"></span><span class="hl">'+r.rate+'%</span></td>'
          +'<td>'+(r.ratio?r.ratio+'%':'·')+'</td><td>'+(r.x?r.x:'·')+'</td></tr>';
      }).join('')+'</tbody></table>';
  }
  function auction(){
    var t=A.auction.total||{};
    kel.innerHTML=kpi(t.rate+'%','낙찰률 · 물건 기준')+kpi(t.ratio+'%','낙찰가율 · 감정가 대비')+kpi((t.n||0).toLocaleString(),'개찰 물건 수');
    seg.textContent='상품별 낙찰 통계 · 매각기일 '+A.auction.from+' ~ '+A.auction.to;
    tbl.innerHTML=table(A.auction.rows,'평균 유찰');
    ex.innerHTML='';
    hotAuction();
    note.textContent='※ 법원경매 매각결과를 매주 수집해 누적한 통계입니다(현재 '+A.auction.from+' 이후분, 매주 확대). 낙찰률은 물건 기준(낙찰 물건 ÷ 개찰 물건), 낙찰가율은 감정가 대비 매각가입니다. 유찰이 반복된 물건이 포함되어 실제 시세와 다를 수 있으며, 투자 권유가 아닙니다.';
  }
  function onbid(){
    var t=A.onbid.total||{};
    // 낙찰가율은 감정가 표본이 확보된 기간만 낸다(2026-08-02). 과거 구간은 감정가가
    // 채워진 물건이 낙찰 건의 12~26%뿐이라 그 소수만 평균 내면 값이 위로 편향된다.
    var rlab='낙찰가율 · 감정가 대비'+(t.ratio_from?' · '+t.ratio_from+'~'+t.ratio_to:'');
    kel.innerHTML=kpi(t.rate+'%','낙찰률 · 물건 기준')+kpi((t.ratio?t.ratio+'%':'·'),rlab)+kpi((t.n||0).toLocaleString(),'개찰 물건 수 · 최근 1년');
    seg.textContent='상품별 낙찰 통계 · 물건 수·낙찰률 최근 1년'+(t.ratio_from?' · 낙찰가율 '+t.ratio_from+'~'+t.ratio_to:'');
    tbl.innerHTML=table(A.onbid.rows,'평균 응찰');
    var m=A.onbid.monthly||[],hid=m.filter(function(r){return !r.ratio;}).length;
    ex.innerHTML=m.length?('<p class="seg">월별 추이 · 전체 상품(물건 기준)</p>'
      +'<table class="tb mtr"><thead><tr><th>개찰월</th><th>물건 수</th><th>낙찰률</th><th>낙찰가율</th><th></th></tr></thead><tbody>'
      +m.map(function(r){return '<tr><td>'+r.ym+'</td><td>'+r.n.toLocaleString()+'</td><td class="hl">'+r.rate+'%</td>'
        +'<td>'+(r.ratio?r.ratio+'%':'<span style="color:#9b958c">집계 제외</span>')+'</td>'
        +'<td style="color:#9b958c;font-size:12px">'+(r.ratio?'':'감정가 표본 '+(r.cov||0)+'%')+'</td></tr>';}).join('')
      +'</tbody></table>'
      +(hid?'<p class="notice2 mtnote" style="margin:8px 0 0">※ 낙찰가율이 \'집계 제외\'인 달은 낙찰 건 가운데 감정가가 함께 공개된 물건이 적어(표본 '+A.onbid.ratio_min_cov+'% 미만) 평균을 내면 실제보다 높게 나옵니다. 값을 지어내지 않고 비워 둡니다. 낙찰률은 전 기간 비교 가능합니다.</p>':'')):'';
    hotOnbid();
    note.textContent='※ 캠코 온비드 공매 입찰결과를 매일 수집해 누적한 통계입니다(최근 1년). 낙찰률은 물건 기준이며, 회차 기준 낙찰률은 이보다 크게 낮습니다(공매는 유찰 회차가 많음). 낙찰가율은 감정가 대비 낙찰가로, 감정가가 함께 공개된 물건만 집계합니다. 투자 권유가 아닙니다.';
  }
  var R={auction:auction,onbid:onbid};
  document.querySelectorAll('.tabs .tab').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.tabs .tab').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');(R[b.dataset.t]||auction)();
    });
  });
  auction();
})();
</script>
