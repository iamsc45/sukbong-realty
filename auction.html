<script src="data/auction.js"></script>
<script>
(function(){
  var A=window.SB&&SB.auction;
  var kel=document.getElementById('kpis'),tbl=document.getElementById('tbl'),ex=document.getElementById('extra');
  var seg=document.getElementById('segTable'),note=document.getElementById('note');
  if(!A){tbl.innerHTML='<p style="color:var(--muted)">데이터 연결 대기 중입니다.</p>';return;}
  document.getElementById('basis').textContent='법원경매·온비드 공매 낙찰 통계 · 기준일 '+A.updated;
  var NM={'아파트':'아파트','오피스텔':'오피스텔','연립다세대':'연립·다세대','단독다가구':'단독·다가구','상가업무':'상가·업무','토지':'토지','공장창고':'공장·창고','자동차중기':'자동차·중기','주거_기타':'주거 기타','기타':'기타'};
  function kpi(v,l){return '<div class="kpi2"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';}
  function table(rows,xLabel){
    var maxRate=Math.max.apply(null,rows.map(function(r){return r.rate;}));
    return '<table class="tb"><thead><tr><th>상품</th><th>물건 수</th><th>낙찰률</th><th>낙찰가율</th><th>'+xLabel+'</th></tr></thead><tbody>'
      +rows.map(function(r){
        var w=maxRate?Math.max(4,Math.round(r.rate/maxRate*70)):4;
        return '<tr><td>'+(NM[r.p]||r.p)+'</td><td>'+r.n.toLocaleString()+'</td>'
          +'<td><span class="bar" style="width:'+w+'px"></span><span class="hl">'+r.rate+'%</span></td>'
          +'<td>'+(r.ratio?r.ratio+'%':'·')+'</td><td>'+(r.x?r.x:'·')+'</td></tr>';
      }).join('')+'</tbody></table>';
  }
  function auction(){
    var t=A.auction.total||{};
    kel.innerHTML=kpi(t.rate+'%','낙찰률 · 물건 기준')+kpi(t.ratio+'%','낙찰가율 · 감정가 대비')+kpi((t.n||0).toLocaleString(),'개찰 물건 수');
    seg.textContent='상품별 낙찰 통계 · 매각기일 '+A.auction.from+' ~ '+A.auction.to;
    tbl.innerHTML=table(A.auction.rows,'평균 유찰');
    ex.innerHTML='';
    note.textContent='※ 법원경매 매각결과를 매주 수집해 누적한 통계입니다(현재 '+A.auction.from+' 이후분, 매주 확대). 낙찰률은 물건 기준(낙찰 물건 ÷ 개찰 물건), 낙찰가율은 감정가 대비 매각가입니다. 유찰이 반복된 물건이 포함되어 실제 시세와 다를 수 있으며, 투자 권유가 아닙니다.';
  }
  function onbid(){
    var t=A.onbid.total||{};
    kel.innerHTML=kpi(t.rate+'%','낙찰률 · 물건 기준')+kpi(t.ratio+'%','낙찰가율 · 감정가 대비')+kpi((t.n||0).toLocaleString(),'개찰 물건 수 · 최근 1년');
    seg.textContent='상품별 낙찰 통계 · 최근 1년 누적';
    tbl.innerHTML=table(A.onbid.rows,'평균 응찰');
    var m=A.onbid.monthly||[];
    ex.innerHTML=m.length?('<p class="seg">월별 추이 · 전체 상품(물건 기준)</p>'
      +'<table class="tb"><thead><tr><th>개찰월</th><th>물건 수</th><th>낙찰률</th><th>낙찰가율</th><th></th></tr></thead><tbody>'
      +m.map(function(r){return '<tr><td>'+r.ym+'</td><td>'+r.n.toLocaleString()+'</td><td class="hl">'+r.rate+'%</td><td>'+(r.ratio?r.ratio+'%':'·')+'</td><td></td></tr>';}).join('')
      +'</tbody></table>'):'';
    note.textContent='※ 캠코 온비드 공매 입찰결과를 매일 수집해 누적한 통계입니다(최근 1년). 낙찰률은 물건 기준이며, 회차 기준 낙찰률은 이보다 크게 낮습니다(공매는 유찰 회차가 많음). 낙찰가율은 감정가 대비 낙찰가입니다. 투자 권유가 아닙니다.';
  }
  var R={auction:auction,onbid:onbid};
  document.querySelectorAll('.tabs .tab').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.tabs .tab').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');(R[b.dataset.t]||auction)();
    });
  });
  auction();
})();
</script>
