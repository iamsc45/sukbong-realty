<script>
/* ─────────────────────────────────────────────────────────────
   토지 상세 페이지 (2026-08-19 신설, 석봉님 지시)

   왜 따로 만들었나
     상세 화면이 `단지상세.html` 하나뿐이라 **토지를 눌러도 아파트 화면**으로 갔다.
     그래서 땅에 「☆ 관심단지 등록」·「이 단지 현재 호가 매물 없음」·「전 평형 중위」가
     그대로 나왔다(2026-08-19 라이브 실측). 땅에는 단지도 평형도 없다.
     🔴 이 파일에서 「단지」·「평형」이라는 말을 쓰지 말 것.

   땅값 조회(`토지검색.html`)와 무엇이 다른가 — 둘은 겹치는 게 아니라 역할이 다르다
     · 땅값 조회 = 지번을 넣어 **정부 API를 실시간 호출**한다. 공시지가·행위제한·
       건축물대장까지 나오지만 **회원 하루 20회** 제한이 있다.
     · 이 화면  = **우리가 이미 만들어 둔 정적 자료(land_dong)만** 쓴다. 로그인이 필요 없고
       빠르다. 지도에서 눌러 바로 들어오는 자리다. 더 깊은 것은 땅값 조회로 넘긴다.

   ⚠️ `fetch` 에 `cache:'force-cache'` 를 쓰지 말 것 — 배포 전 404를 캐시에 물고
      「자료 없음」으로 굳는다(2026-08-18 실제 사고). GitHub Pages 는 ETag 를 준다.
   ───────────────────────────────────────────────────────────── */
(function(){
  var $=function(id){return document.getElementById(id);};
  var PYUNG=3.305785;
  var qs=new URLSearchParams(location.search);
  var code=(qs.get('code')||'').replace(/[^0-9]/g,'');
  var jb=(qs.get('jb')||'').trim();

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function comma(n){return Number(n||0).toLocaleString('ko-KR');}
  /* 면적은 ㎡ 옆에 평을 병기한다(사이트 공통 규칙). 100㎡ 미만은 소수 1자리. */
  function PY(m2){var m=+m2||0; if(!m) return ''; var p=m/PYUNG;
    return comma(Math.round(m*10)/10)+'㎡ ('+(m<100?(Math.round(p*10)/10):Math.round(p))+'평)';}
  /* 평당가는 전용(토지는 거래면적) 기준. 표기 반올림은 여기서 한 번만 한다. */
  function pyOf(man,m2){var a=(+m2||0)/PYUNG; return a?(+man||0)/a:0;}
  function eok(man){var v=+man||0;
    if(v>=10000) return comma(Math.round(v/1000)/10)+'억';
    return comma(v)+'만';}
  function ymTxt(ym){ym=String(ym||''); return ym.length===4?('20'+ym.slice(0,2)+'년 '+(+ym.slice(2))+'월'):'';}

  /* 🔴 자료의 등급값을 화면에 그대로 쓰지 않는다. 두 가지 이유다.
       ① 그 값은 내부 라벨이라 읽는 사람이 뜻을 모른다.
       ② 판정 근거를 문장으로 풀어 쓰면 우리가 무엇을 무엇과 맞추는지 알려 주는 셈이 된다.
          이 파일은 공개 소스라 주석까지 보인다(2026-08-20 석봉님 지적).
     그래서 화면에는 **확인 수준만** 남긴다. 근거와 대응표는 내부 문서에 둔다
     (`_인수인계_땅값계산기_20260818.md`). */
  function gradeTag(desc){
    desc=String(desc||'');
    var hi = desc.indexOf('확실')===0 || desc.indexOf('연쇄')>=0;
    var out = '<span class="tag'+(hi?' ok':'')+'">확인 수준 '+(hi?'높음':'보통')+'</span>';
    if(desc.indexOf('건물지')>=0) out += '<span class="tag warn">건물 있는 땅</span>';
    return out;
  }
  function dTxt(d){d=String(d||''); return d.length===8?(d.slice(0,4)+'년 '+(+d.slice(4,6))+'월 '+(+d.slice(6))+'일'):'';}

  /* 법정동 이름 */
  var B=null;
  (window.LANDBJD||[]).some(function(x){ if(x[0]===code){B=x;return true;} return false;});

  if(!code||!jb){
    $('state').className='err';
    $('state').textContent='주소가 올바르지 않습니다. 지도나 땅값 조회에서 다시 들어와 주세요.';
    return;
  }
  $('ttl').textContent=(B?B[3]:'')+' '+jb;
  $('loc').textContent=B?(B[1]+' '+B[2]+' '+B[3]):('법정동코드 '+code);
  document.title=(B?B[3]+' ':'')+jb+' 토지 상세 · 석봉 부동산 정보방';

  fetch('data/land_dong/'+code+'.json')
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(render)
    .catch(function(e){
      $('state').className='err';
      $('state').textContent='자료를 불러오지 못했습니다 ('+e.message+').\n'+
        '그 필지에 자료가 없다는 뜻이 아닙니다. 잠시 뒤 다시 열어 주세요.';
    });

  function render(D){
    $('state').style.display='none';
    var deals=(D.d||[]).filter(function(x){return x[0]===jb;});
    var lots =(D.l||[]).filter(function(x){return x[0]===jb;});
    /* 건물이 딸린 땅의 거래(2026-08-20 신설). 위에서 함께 정의한다 —
       「거래가 없습니다」 판정이 이것도 봐야 하기 때문이다. */
    var blds=(D.b||[]).filter(function(x){return x[0]===jb;});
    var h=[];

    /* ── 이 필지가 어떤 땅인가 (실거래·매물 어느 쪽에서든 지목·용도지역을 얻는다)
       ⚠️ 건물 거래(`b`)에는 지목·용도지역이 없다 — 대지면적만 쓴다. */
    var meta=deals[0]||lots[0]||null;
    var jimok=meta?(meta[4]||''):'', useZ=meta?(meta[5]||''):'';
    var area=meta?(meta[3]||meta[2]||0):0;
    if(!area && blds.length) area=blds[0][3]||0;

    if(!deals.length&&!lots.length&&!blds.length){
      h.push('<div class="disc"><b>이 지번으로 확정된 거래나 매물이 아직 없습니다.</b><br>'+
        '국토부 실거래는 토지 지번을 가려서 제공합니다. 우리는 공부 자료로 좁혀 되짚는데, '+
        '아직 이 필지까지 닿지 않았습니다. 아래 이 동네 시세와 땅값 조회를 이용해 주세요.</div>');
    }

    /* ── 바로가기 */
    h.push('<div class="jump" id="jump"></div>');

    /* ── 기본 */
    if(meta||area){
      h.push('<h2 id="s1">이 필지</h2><table class="t2">');
      h.push('<tr><th>지번</th><td>'+esc((B?B[3]+' ':'')+jb)+'</td></tr>');
      if(jimok) h.push('<tr><th>지목</th><td>'+esc(jimok)+'</td></tr>');
      if(useZ)  h.push('<tr><th>용도지역</th><td>'+esc(useZ)+'</td></tr>');
      if(area)  h.push('<tr><th>면적</th><td>'+PY(area)+'</td></tr>');
      h.push('</table>');
    }

    /* ── 실거래 */
    h.push('<h2 id="s2">이 필지 실거래</h2>');
    if(deals.length){
      var ds=deals.slice().sort(function(a,b){return String(b[1]).localeCompare(String(a[1]));});
      h.push('<table class="t2"><tr><th>계약</th><th class="n">거래금액</th><th class="n">면적 · 평당</th></tr>');
      ds.forEach(function(x){
        var py=pyOf(x[2],x[3]);
        h.push('<tr><td>'+esc(ymTxt(x[1]))+'<br>'+gradeTag(x[6])+'</td>'+
               '<td class="n">'+eok(x[2])+'</td>'+
               '<td class="n">'+PY(x[3])+'<br><span style="color:var(--muted)">평당 '+comma(Math.round(py))+'만</span></td></tr>');
      });
      h.push('</table>');
      h.push('<div class="disc">🔴 <b>확정이 아니라 추정입니다.</b><br>'+
        '정확한 소유·면적·권리관계는 <b>등기부등본</b>으로 확인하세요. '+
        '<a href="https://www.iros.go.kr" target="_blank" rel="noopener" '+
        'style="white-space:nowrap">인터넷등기소</a><br>'+
        '평당가는 국토부 신고 거래면적 기준입니다.</div>');
    } else {
      h.push('<div class="empty">이 지번으로 되짚은 거래가 없습니다. 확정 범위는 서울 2021년 이후와 전국 최근 6개월입니다.</div>');
    }

    /* ── 건물이 딸린 땅의 거래 (2026-08-20 신설)
       석봉님 지적에서 나왔다 — 단독·다가구 카드가 마스킹 지번으로 **여러 집을 뭉쳐**
       보여주고 있었는데, 매칭은 이미 끝나 있었고 화면이 안 쓰고 있었다.
       ⚠️ 이 거래의 금액은 **땅값 + 건물값**이라 위의 토지 실거래와 성격이 다르다.
          같은 표에 섞지 말 것(지목별 평당가에도 안 들어간다). */
    if(blds.length){
      var KIND={H:'단독·다가구', C:'상업·업무용', F:'공장·창고'};
      h.push('<h2 id="s2b">이 필지 건물 거래</h2>');
      h.push('<table class="t2"><tr><th>계약</th><th class="n">거래금액</th><th class="n">대지 · 연면적</th></tr>');
      blds.forEach(function(x){
        h.push('<tr><td>'+esc(ymTxt(x[1]))+'<br>'+
               '<span class="tag">'+esc(KIND[x[7]]||'건물')+'</span>'+
               (String(x[6]).charAt(0)==='S'?'<span class="tag ok">확인 수준 높음</span>'
                                            :'<span class="tag">확인 수준 보통</span>')+'</td>'+
               '<td class="n">'+eok(x[2])+'</td>'+
               '<td class="n">'+PY(x[3])+'<br><span style="color:var(--muted)">건물 '+
               PY(x[4])+(x[5]?' · '+esc(x[5])+'년':'')+'</span></td></tr>');
      });
      h.push('</table>');
      h.push('<div class="disc">이 금액은 <b>땅값과 건물값을 합한 것</b>입니다. '+
        '위의 토지 실거래(땅만 거래된 것)와 직접 비교하지 마세요.<br>'+
        '🔴 <b>확정이 아니라 추정입니다.</b> 정확한 내용은 <b>등기부등본</b>으로 확인하세요. '+
        '<a href="https://www.iros.go.kr" target="_blank" rel="noopener" '+
        'style="white-space:nowrap">인터넷등기소</a></div>');
    }

    /* ── 매물 */
    h.push('<h2 id="s3">지금 나와 있는 매물</h2>');
    if(lots.length){
      h.push('<table class="t2"><tr><th>호가</th><th class="n">면적 · 평당</th><th class="n">확인</th></tr>');
      lots.forEach(function(x){
        var py=pyOf(x[1],x[2]);
        var bld='';
        if(+x[9]){
          var yr=String(x[10]||''), age=yr.length===4?(new Date().getFullYear()-+yr):0;
          bld='<span class="tag warn">건물 있음 '+comma(x[9])+'㎡'+(x[11]?' · '+esc(x[11]):'')+
              (yr?' · '+esc(yr)+'년':'')+(age>=30?' (노후)':'')+'</span>';
        }
        h.push('<tr><td>'+eok(x[1])+bld+'</td>'+
               '<td class="n">'+PY(x[2])+'<br><span style="color:var(--muted)">평당 '+comma(Math.round(py))+'만</span></td>'+
               '<td class="n">'+esc(dTxt(x[6]||x[3]))+'</td></tr>');
      });
      h.push('</table>');
      h.push('<div class="disc"><b>호가는 협상 전 가격입니다.</b> 실제 거래가는 대개 이보다 낮습니다. '+
        '같은 땅을 여러 중개사가 각각 올리기도 해서 한 필지에 여러 건이 보일 수 있습니다.<br>'+
        '수도권만 수집하고 있으며, 다른 지역은 순차로 넓히는 중입니다.</div>');
    } else {
      h.push('<div class="empty">이 필지로 확정된 매물이 지금은 없습니다.</div>');
    }

    /* ── 동네 시세 */
    var S=D.s||{};
    var keys=Object.keys(S);
    h.push('<h2 id="s4">'+esc(B?B[3]:'이 동네')+' 지목별 평당가</h2>');
    if(keys.length){
      h.push('<table class="t2"><tr><th>지목</th><th class="n">실거래</th><th class="n">호가</th></tr>');
      keys.forEach(function(k){
        var v=S[k];
        var mark=(k===jimok)?' <span class="tag ok">이 필지</span>':'';
        h.push('<tr><td>'+esc(k)+mark+'</td>'+
               '<td class="n">'+(v[1]?comma(v[0])+'만 <span style="color:var(--muted)">('+v[1]+'건)</span>':'·')+'</td>'+
               '<td class="n">'+(v[3]?comma(v[2])+'만 <span style="color:var(--muted)">('+v[3]+'건)</span>':'·')+'</td></tr>');
      });
      h.push('</table>');
      /* ⚠️ 지분 거래 제외를 밝히는 이유 — 토지 매매의 30.7%가 지분이다(2026-08-20 실측).
         1㎡ 짜리 거래가 그렇게 들어오는데, 필지 전체가 아니라 일부만 파는 것이라
         면적으로 필지를 특정할 수 없어 집계에서 뺐다. 밝히지 않으면 「거래가 적다」로 읽힌다. */
      h.push('<div class="disc">평당 중위값입니다(거래면적 기준). 표본이 적은 지목은 한두 건에 크게 흔들립니다. '+
        '지목이 같아도 도로 접면·모양·규제에 따라 값이 크게 갈리므로 <b>구간을 참고하는 데까지만</b> 쓰세요.<br>'+
        '지분 거래(필지의 일부만 사고파는 것)는 집계에서 뺐습니다.</div>');
    } else {
      h.push('<div class="empty">이 동네 집계가 아직 없습니다.</div>');
    }

    /* ── 인근 실거래 */
    var near=(D.d||[]).filter(function(x){return x[0]!==jb;})
                      .sort(function(a,b){return String(b[1]).localeCompare(String(a[1]));}).slice(0,12);
    h.push('<h2 id="s5">인근 실거래 ('+esc(B?B[3]:'같은 동')+')</h2>');
    if(near.length){
      h.push('<table class="t2"><tr><th>지번 · 계약</th><th class="n">거래금액</th><th class="n">면적 · 평당</th></tr>');
      near.forEach(function(x){
        var py=pyOf(x[2],x[3]);
        h.push('<tr><td><a href="%ED%86%A0%EC%A7%80%EC%83%81%EC%84%B8.html?code='+code+'&jb='+encodeURIComponent(x[0])+'">'+esc(x[0])+'</a>'+
               '<br><span style="color:var(--muted)">'+esc(ymTxt(x[1]))+' · '+esc(x[4]||'')+'</span></td>'+
               '<td class="n">'+eok(x[2])+'</td>'+
               '<td class="n">'+PY(x[3])+'<br><span style="color:var(--muted)">평당 '+comma(Math.round(py))+'만</span></td></tr>');
      });
      h.push('</table>');
    } else {
      h.push('<div class="empty">같은 동에서 되짚은 다른 거래가 없습니다.</div>');
    }

    /* ── 다음 걸음 */
    var mapQ=(B?(B[1].slice(0,2)+' '+B[2]+' '+B[3]):'');
    h.push('<div class="cta">'+
      '<a class="p" href="%ED%86%A0%EC%A7%80%EA%B2%80%EC%83%89.html">공시지가·행위제한까지 보기</a>'+
      '<a class="l" href="map.html?q='+encodeURIComponent(mapQ)+'">지도에서 주변 보기</a>'+
      '<a class="l" href="%EB%8C%80%EC%B6%9C%EB%AC%B8%EC%9D%98.html">담보 대출 상담</a>'+
      '</div>');
    h.push('<div class="disc">이 화면은 우리가 모아 둔 자료로 만든 참고 정보입니다. '+
      '감정평가가 아니며 투자 권유도 아닙니다.</div>');

    $('out').innerHTML=h.join('');
    buildJump();
  }

  /* 큰 제목을 버튼으로 만들어 누르면 그 자리로 내려간다(땅값 조회와 같은 방식).
     헤더 높이를 실측해 sticky 위치를 잡는다 — 값을 박아 두면 헤더가 바뀔 때 어긋난다. */
  function buildJump(){
    var bar=$('jump'); if(!bar) return;
    var hd=document.querySelector('.site-header');
    var hdH=hd?hd.getBoundingClientRect().height:0;
    bar.style.top=hdH+'px';
    var hs=[].slice.call($('out').querySelectorAll('h2'));
    bar.innerHTML=hs.map(function(h){
      return '<a href="#'+h.id+'">'+esc(h.textContent)+'</a>';}).join('');
    fixAnchorOffset(hs, hdH, bar);
    /* 칩바는 flex-wrap 이라 화면 폭에 따라 줄 수가 바뀐다 → 여백도 다시 잰다 */
    window.addEventListener('resize', function(){
      fixAnchorOffset(hs, hd?hd.getBoundingClientRect().height:0, bar);
    });
  }

  /* 🔴 2026-08-20 — 칩을 눌러 내려갔을 때 제목이 고정 요소에 가리던 것을 고친다.
     헤더(sticky 51px)와 칩바(sticky 87px)가 겹쳐 **제목과 표 첫 행이 그 뒤로 숨었다**
     (석봉님 지적. 나는 하단 탭바만 재고 상단을 안 봐서 「가리는 글 0건」으로 통과시켰다).
     ⚠️ 높이를 숫자로 박지 말 것 — 헤더가 바뀌거나 칩이 두 줄이 되면 그대로 어긋난다. */
  function fixAnchorOffset(hs, hdH, bar){
    var off = Math.round(hdH + bar.getBoundingClientRect().height + 10);
    hs.forEach(function(h){ h.style.scrollMarginTop = off + 'px'; });
  }
})();
</script>
</body></html>
