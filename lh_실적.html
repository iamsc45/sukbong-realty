<style>
:root{--navy:#12264A;--navy2:#1B3F7A;--g1:#5A6478;--g2:#7A8698;--hair:#E3E8F0;--tint:#EEF3FB}
.wrap{max-width:860px;margin:0 auto;padding:26px 20px 70px}
h1{font-size:25px;letter-spacing:-.02em;margin:0 0 4px}
.loc{color:var(--g1);font-size:13.5px;margin:0 0 16px}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:4px;background:var(--tint);
  color:var(--navy2);font-size:11px;font-weight:800;vertical-align:2px}
/* 🔴 컴팩트 우선(석봉님 상시 지시). 박스는 **내용에 맞춰** 줄인다 —
   빈 상자를 크게 벌려 놓는 것이 가장 안 좋다. 값이 세 개면 세 개만큼만 차지한다. */
h2{font-size:15px;margin:20px 0 7px;padding-bottom:5px;border-bottom:1.5px solid var(--navy)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,186px));gap:8px;margin:0 0 6px;
  justify-content:start}   /* 상한을 둔다 — 값 세 개가 화면 폭만큼 벌어지면 그게 여백이다 */
.kpi div{background:var(--tint);border-radius:10px;padding:10px 12px}
.kpi .n{font-size:20px;font-weight:800;color:var(--navy);line-height:1.15;letter-spacing:-.02em}
/* 부연은 큰 숫자에 바짝 붙으면 한 낱말로 읽힌다(「57.5㎡17.4평」). 한 칸 띄운다(2026-08-25) */
.kpi .n em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--navy2);margin-left:5px}
.kpi .l{font-size:11px;color:var(--g1);margin-top:2px;line-height:1.35}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--navy);color:#fff;font-weight:700;font-size:11.5px;padding:6px 10px;text-align:left}
td{padding:6px 10px;border-bottom:1px solid var(--hair)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.note{font-size:12.5px;color:var(--g1);background:var(--tint);border-radius:10px;padding:13px 15px;margin:14px 0 0;line-height:1.7}
.warn{background:#FFF6F2;color:#8a4a3a}
.cta{display:inline-block;margin:16px 8px 0 0;padding:12px 20px;border-radius:11px;text-decoration:none;
  font-weight:800;font-size:13.5px;background:var(--navy);color:#fff}
.cta.line{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.msg{padding:40px 0;text-align:center;color:var(--g2)}
/* 인근 정보 카드 (2026-08-22 개편) */
/* 카드는 내용 높이만큼만. 4칸을 억지로 같은 높이로 늘이지 않는다(빈칸이 생긴다). */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 4px;align-items:start}
.card{border:1px solid var(--hair);border-radius:12px;padding:12px 14px;background:#fff}
.card h3{font-size:12.5px;margin:0 0 7px;color:var(--navy);letter-spacing:-.01em;
  display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card h3 small{font-size:10px;font-weight:600;color:var(--g2)}
/* 수익률 한 줄 — 임대 카드 안에 넣는다. 상자를 하나 더 만들 만큼의 정보가 아니다. */
.yield{display:flex;align-items:baseline;gap:7px;margin:8px 0 0;padding:8px 10px;
  background:var(--tint);border-radius:9px}
.yield b{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.yield span{font-size:10.5px;color:var(--g1);line-height:1.35}
/* 매입 추이 막대 — 그래프 하나 그리자고 라이브러리를 얹지 않는다. div 높이면 된다. */
.trend{display:flex;align-items:flex-end;gap:3px;height:54px;margin:2px 0 0}
.trend .b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.trend .bar{background:var(--navy2);border-radius:3px 3px 0 0;min-height:2px}
.trend .b.z .bar{background:var(--hair)}
.trend .b.hi .bar{background:var(--navy)}
.tlab{display:flex;gap:3px;margin:3px 0 0}
.tlab span{flex:1;min-width:0;text-align:center;font-size:9.5px;color:var(--g2);font-weight:700}
.tval{display:flex;gap:3px}
.tval span{flex:1;min-width:0;text-align:center;font-size:9.5px;color:var(--navy2);font-weight:800}
.dl{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--hair);font-size:12.5px}
.dl:first-of-type{border-top:0}
.dl .k{color:var(--g1)}
.dl .v{font-weight:800;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
.dl .v small{font-weight:600;color:var(--g2);font-size:11px}
.pill{display:inline-block;padding:1px 7px;border-radius:100px;background:var(--tint);color:var(--navy2);
  font-size:10.5px;font-weight:800;margin-right:5px}
.none{font-size:12.5px;color:var(--g2);padding:6px 0}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
/* 🔴 모바일을 데스크톱 축소판으로 두지 않는다(2026-08-22 석봉님 지적).
   여기 규칙이 두 줄뿐이던 탓에 **KPI 세 칸이 세로로 346px** 을 먹었다(화면의 41%).
   폭 186px 상한도 좁은 화면에서는 오른쪽을 비우는 값이라 그대로 두면 안 된다.
   방문자의 70.9% 가 모바일이다 — 이 화면의 기본은 모바일이다. */
@media(max-width:560px){

  h2{font-size:13.5px;margin:16px 0 6px}
  /* KPI 는 모바일에서 **2×2**(2026-08-25 네 번째 칸을 넣으면서 바꿨다).
     세 칸으로 두면 넷째가 혼자 다음 줄에 남아 가로로 늘어난다 — 그게 제일 보기 나쁘다.
     세로로 길게 쌓지 않으므로 첫 화면이 숫자로만 끝나는 문제도 없다. */
  .kpi{grid-template-columns:repeat(2,1fr);gap:5px;justify-content:stretch}
  .kpi div{padding:8px 7px;border-radius:9px}
  .kpi .n{font-size:16px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .n em{display:block;font-size:10px;margin-top:1px;margin-left:0}
  .kpi .l{font-size:9.5px;margin-top:3px;line-height:1.3;word-break:keep-all}
  .card{padding:10px 11px;border-radius:11px}
  .card h3{font-size:11.5px;margin:0 0 6px}
  .note{font-size:11.5px;padding:11px 12px;line-height:1.6;border-radius:9px}
  table{font-size:12.5px}
  th{font-size:10.5px;padding:5px 8px}
  td{padding:5px 8px}
  .dl{font-size:12px;padding:4px 0}
  .dl .v small{font-size:10.5px}
  .trend{height:44px}
  /* 버튼은 화면 폭을 꽉 채운다 — 좁은 화면에서 반쯤 걸친 버튼이 제일 누르기 어렵다 */
  .cta{display:block;margin:9px 0 0;padding:13px 14px;text-align:center;font-size:13px}
  /* 수익률은 값과 설명을 위아래로 — 한 줄에 두면 설명이 세 줄로 접혀 읽기 어렵다 */
  .yield{display:block;padding:8px 10px}
  .yield b{font-size:17px;display:block;margin-bottom:2px}
  .yield span{font-size:10px;display:block}
}
@media(max-width:360px){
  .kpi .n{font-size:14.5px}
  .kpi .l{font-size:9px}
}
</style>

<script>
/* ══════════════════════════════════════════════════════════════════
   LH 매입 실적 상세 (2026-08-22 신설)

   왜 만드나
     지도에서 필지를 누르면 팝업만 떴다(석봉님 지적 「카드와 상세페이지도 있어야 함」).
     다른 물건은 전부 카드 → 상세로 이어지는데 LH 만 거기서 끊겨 있었다.

   🔴 말에 관한 규칙 (사양서 1절 — 어기면 사실과 다른 화면이 된다)
     ① 이 자료를 **「매입약정」이라 부르지 않는다.** 원본에 약정 구분 컬럼이 없다.
        근거를 댈 수 있는 말은 「LH 매입임대 주택」과 「신축 매입(준공 1년 이내)」까지다.
     ② **「실적은 과거의 사실이며 향후 매입을 보장하지 않습니다」** 를 반드시 적는다.
     ③ **순위·등급으로 만들지 않는다.**
     ④ 기준시점(2025년 11월 20일)을 함께 적는다.

   ⚠️ 새 자료를 만들지 않는다 — 지도가 쓰는 `data/lh_parcel_<시도2>.js` 를 그대로 받는다.
   ══════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var LHBASE='2025년 11월 20일';
  var TYPEQ={1:'',2:'인근 필지 추정',3:'필지 미확정'};
  /* ㎡ → 평. 사이트 공통 규칙: 100㎡ 미만은 소수 1자리, 이상은 정수(2026-08-25 이 화면에도 적용) */
  function py(a){ if(!a)return ''; var v=a/3.305785;
    return a<100 ? Math.round(v*10)/10 : Math.round(v); }
  function e(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function qs(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(err){return '';}}
  var app=document.getElementById('app');
  function fail(m){app.innerHTML='<div class="msg">'+e(m)+'<br><br>'
    +'<a class="cta line" href="map.html?mode=lh">실거래지도에서 LH 매입 실적 보기 →</a></div>';}

  var sd=qs('sd'), pnu=qs('p');
  if(!/^\d{2}$/.test(sd)||!/^\d{19}$/.test(pnu)){fail('주소가 올바르지 않습니다.');return;}

  var sc=document.createElement('script');
  sc.src='data/lh_parcel_'+sd+'.js';
  sc.onerror=function(){fail('그 지역 자료를 찾지 못했습니다.');};
  sc.onload=function(){
    var arr=(window.LHPARCEL||{})[sd]||[];
    var r=null;
    for(var i=0;i<arr.length;i++){ if(String(arr[i].p)===pnu){r=arr[i];break;} }
    if(!r){fail('그 필지를 찾지 못했습니다.');return;}
    /* 건축물대장(건폐율·용적률·대지면적)은 **따로 받는다**(2026-08-25).
       ⚠️이 파일이 없거나 그 지번이 없어도 화면은 그대로 그린다 — 대장은 덤이지
         이 페이지의 본체가 아니다. 없으면 「건물」 절에서 그 줄만 안 나온다. */
    var b2=document.createElement('script');
    b2.src='data/lh_bldg_'+sd+'.js';
    b2.onerror=b2.onload=function(){ draw(r,arr); };
    document.body.appendChild(b2);
  };
  document.body.appendChild(sc);

  /* PNU → "법정동10|지번". 주소 문장을 파싱하지 않는다(수집기와 같은 규칙).
     PNU = 법정동10 + 산구분1 + 본번4 + 부번4 */
  function bldgOf(p){
    try{
      var s=String(p);
      var bun=parseInt(s.slice(11,15),10), ji=parseInt(s.slice(15,19),10);
      var jb=(s[10]==='2'?'산':'')+bun+(ji?'-'+ji:'');
      var o=(window.LHBLDG||{})[s.slice(0,2)]||{};
      return o[s.slice(0,10)+'|'+jb]||null;
    }catch(err){ return null; }
  }

  /* 이 법정동 연도별 매입 추이 — 「늘고 있나 줄고 있나」가 시행사의 물음이다.
     ⚠️ 라이브러리를 얹지 않는다. 막대 열 개면 div 높이로 충분하다(그래프 하나에 200KB 는 낭비).
     ⚠️ 거래가 없는 해도 **빈칸으로 남긴다** — 있는 해만 이으면 끊긴 기간이 안 보인다. */
  function trendBars(byYear){
    var ys=Object.keys(byYear||{}).filter(function(y){return /^\d{4}$/.test(y);});
    if(ys.length<2)return '';
    var now=(new Date()).getFullYear(), from=Math.max(Math.min.apply(null,ys.map(Number)), now-9);
    var span=[], mx=0;
    for(var y=from;y<=now;y++){ var v=byYear[String(y)]||0; span.push([y,v]); if(v>mx)mx=v; }
    if(!mx)return '';
    return '<div class="trend">'+span.map(function(p){
        var h=Math.round(p[1]/mx*100);
        return '<div class="b'+(p[1]?(p[1]===mx?' hi':''):' z')+'">'
          +'<div class="bar" style="height:'+(p[1]?Math.max(h,4):2)+'%"></div></div>';
      }).join('')+'</div>'
      +'<div class="tval">'+span.map(function(p){return '<span>'+(p[1]||'')+'</span>';}).join('')+'</div>'
      +'<div class="tlab">'+span.map(function(p){
        return '<span>'+((p[0]-from)%2===0||p[0]===now?String(p[0]).slice(2):'')+'</span>';}).join('')+'</div>';
  }

  function draw(r,arr){
    var ad=(r.ad||'').replace(/\s{2,}/g,' ');
    document.title=ad+' · LH 매입 실적 · 석봉 부동산 정보방';
    var den=(r.n||0)-(r.u||0), wp=den>0?Math.round((r.w||0)/den*100):null;
    var ys=Object.keys(r.y||{}).sort();
    var last=ys.length?ys[ys.length-1]:'';
    var multiKind=false;   /* 매입 형태가 두 종류 이상인가 — 안내 문구가 갈린다 */

    /* 같은 법정동의 실적을 함께 보여 준다 — 「이 동네에서 사 주기는 하나」가 이 화면의 물음이다.
       ⚠️ PNU 앞 10자리가 법정동이다. 자료를 새로 만들지 않고 받아 둔 배열에서 센다. */
    var dcode=pnu.slice(0,10), sameN=0, sameW=0, sameU=0, sameB=0, sameY={}, bigger=0;
    arr.forEach(function(x){
      if(String(x.p).slice(0,10)!==dcode)return;
      sameB++; sameN+=(x.n||0); sameW+=(x.w||0); sameU+=(x.u||0);
      if((x.n||0)>(r.n||0)) bigger++;      /* 이 자리보다 큰 곳 — 규모 순위를 낸다 */
      for(var y in (x.y||{})) sameY[y]=(sameY[y]||0)+x.y[y];
    });
    /* 이 자리가 그 동네에서 얼마나 큰가. 「LH 가 여기서 사 준다」만으로는 판단이 안 되고,
       **동네에서 흔한 규모인지 예외적으로 큰 자리인지**가 다음 물음이다(2026-08-25 석봉님). */
    var rank=bigger+1, share=sameN>0?Math.round((r.n||0)/sameN*1000)/10:null;
    /* 동 전체 신축 비중 — 개별 자리의 wp 와 같은 셈법(구분 미상은 분모에서 뺀다) */
    var sameDen=sameN-sameU, sameWp=sameDen>0?Math.round(sameW/sameDen*100):null;
    var sameYs=Object.keys(sameY).sort();
    var recent=sameYs.filter(function(y){return parseInt(y,10)>=(new Date()).getFullYear()-4;});
    var recentN=recent.reduce(function(a,y){return a+sameY[y];},0);

  var R=1000;                                   /* 반경 m. 걸어서 10분 남짓 */

      var yr=Math.max.apply(null,hit.map(function(x){return x[4]||0;}));
      put('cNear', dl('매입한 자리',hit.length.toLocaleString()+'곳')
        +dl('합계 호수',n.toLocaleString()+'호')
        +dl('그중 신축 매입',w.toLocaleString()+'호', n?Math.round(w/n*100)+'%':'')
        +dl('가장 최근 매입',(yr?yr+'년':'-')));
    });

    /* ②③ 인근 임대·매매 — 같은 파일 하나로 둘 다 낸다 */
    js('data/detail_'+sgg+'.js',function(){
      var D=(window.SB&&SB.d&&SB.d[sgg])||[];
      var near=D.filter(function(x){ return x.lat && dist(lat,lng,x.lat,x.lng)<=R; });
      /* 임대 — LH 매입임대는 결국 세를 놓는 물건이라 **전월세**가 가장 쓸모 있다.
         전용 19~85㎡ 로 좁힌다(LH 매입 요건 구간). 넓히면 대형 아파트가 중위를 끌어올린다. */
      var je=[], wo=[], woB=[];
      near.forEach(function(x){ (x.txs||[]).forEach(function(t){
        var a=+t.a||0; if(a<19||a>85)return;
        if(t.u==='전세'&&t.p)je.push(t.p);
        if(t.u==='월세'&&t.r){wo.push(t.r); woB.push(t.p||0);}
      });});
      /* 매매 — 평당가(전용)로 낸다. 우리 표기 원칙이 평당이다. */
      var pys=[], amt=[];
      near.forEach(function(x){ (x.txs||[]).forEach(function(t){
        var a=+t.a||0; if(t.u!=='매매'||!a||!t.p)return;
        if(a<19||a>85)return;
        pys.push(t.p/a*3.305785); amt.push(t.p);
      });});
      /* 🔴 표면 임대수익률 역산 (2026-08-22 석봉님 요청).
         (월세×12) ÷ (매매가 − 보증금). 셋 다 **같은 반경·같은 면적대의 중위**라 서로 견줄 만하다.
         ⚠️ 세금·공실·수선비·대출이자를 뺀 값이 아니다 — 그렇게 읽히지 않게 밑에 한 줄로 밝힌다.
         ⚠️ 보증금이 매매가보다 크면(표본이 얇은 동네) 음수가 나온다. 그럴 땐 아예 안 그린다. */
      var yBox='';
      if(wo.length&&pys.length){
        var P=med(amt), B=med(woB), M=med(wo);
        var invest=P-B;
        if(invest>0&&M>0){
          var yr=M*12/invest*100;
          /* ⚠️ 식에 적는 숫자는 **계산에 쓴 값 그대로**여야 한다(2026-08-22 검증에서 걸렸다).
             처음엔 「2.5억 − 0.8억」으로 적었는데 그대로 계산하면 3.88%, 화면은 4.00% 였다.
             억으로 반올림한 값을 식에 적었기 때문이다. 만원 단위로 적어 손검산이 맞게 한다. */
          if(yr>0&&yr<30) yBox='<div class="yield"><b>'+(Math.round(yr*100)/100).toFixed(2)+'%</b>'
            +'<span>표면 수익률 · 월세 '+M.toLocaleString()+'만×12 ÷ (매매 '+P.toLocaleString()
            +'만 − 보증금 '+B.toLocaleString()+'만)<br>'
            +'세금·공실·수선비·대출이자는 빼지 않은 값입니다</span></div>';
        }
      }
      put('cRent',(je.length||wo.length)
        ? (dl('전세 보증금 중위',eok(med(je)),je.length?je.length+'건':'표본 없음')
          +dl('월세 중위',wo.length?(eok(med(woB))+' / '+med(wo).toLocaleString()+'만'):'-',
              wo.length?wo.length+'건':'표본 없음')
          +yBox
          +'<div class="none" style="padding-top:6px">전용 19~85㎡ · 국토부 실거래 신고분</div>')
        : '');
      put('cSale', pys.length
        ? (dl('평당 중위',Math.round(med(pys)).toLocaleString()+'만','전용')
          +dl('거래가 중위',eok(med(amt)),pys.length+'건')
          +'<div class="none" style="padding-top:6px">전용 19~85㎡ · 국토부 실거래 신고분</div>')
        : '');
    },function(){ put('cRent',''); put('cSale',''); });

    /* ④ 인프라 — 지하철은 전국 한 파일, 학교는 시도별(없는 시도가 있다) */
    var sub=null, sch=null, done=0;
    function paintPoi(){
      if(++done<2)return;
      var out='';
      if(sub&&sub.length)out+=sub.map(function(x){
        return dl('<span class="pill">지하철</span>'+x[2]+'역', x.d.toLocaleString()+'m');}).join('');
      if(sch&&sch.length)out+=sch.map(function(x){
        var g=['초','중','고','기타'][x[3]]||'';
        return dl('<span class="pill">'+g+'</span>'+x[2], x.d.toLocaleString()+'m');}).join('');
      put('cPoi',out||'<div class="none">반경 1.5km 안에서 찾지 못했습니다</div>');
    }
    js('data/poi_subway.js',function(){
      var A=window.POISUB||[];
      sub=A.map(function(x){var y=x.slice();y.d=dist(lat,lng,x[0],x[1]);return y;})
           .filter(function(x){return x.d<=1500;})
           .sort(function(a,b){return a.d-b.d;}).slice(0,2);
      paintPoi();
    },function(){sub=[];paintPoi();});
    js('data/poi_school_'+sd+'.js',function(){
      var A=(window.POISCH||{})[sd]||[];
      sch=A.map(function(x){var y=x.slice();y.d=dist(lat,lng,x[0],x[1]);return y;})
           .filter(function(x){return x.d<=1500&&x[3]<3;})
           .sort(function(a,b){return a.d-b.d;}).slice(0,3);
      paintPoi();
    },function(){sch=[];paintPoi();});
  }
})();
</script>
